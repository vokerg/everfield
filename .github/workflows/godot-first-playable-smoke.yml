name: Godot first-playable smoke

on:
  pull_request:
    branches: [main]
    paths:
      - 'game/**'
      - 'tools/implementation/run_godot_smoke.sh'
      - 'tools/implementation/run_godot_movement_smoke.sh'
      - '.github/workflows/godot-first-playable-smoke.yml'
      - 'docs/implementation/first-playable.md'
      - 'docs/planning/handoffs/issue-1414.md'
      - 'docs/planning/handoffs/issue-1464.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: godot-first-playable-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Resolve reviewed Godot artifact lock
        id: godot
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "${GITHUB_OUTPUT}"
          import json
          from pathlib import Path
          lock = json.loads(Path('docs/planning/wave-2/evidence/ci/engine-toolchain-artifact-lock.json').read_text())
          entry = lock['entries']['godot_4.7.1_linux_x86_64_zip']
          if entry['version'] != '4.7.1-stable':
              raise SystemExit(f"unexpected reviewed Godot version: {entry['version']}")
          print(f"url={entry['url']}")
          print(f"sha256={entry['sha256']}")
          print(f"version={entry['version']}")
          PY

      - name: Acquire exact reviewed Godot 4.7.1 artifact
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output godot.zip '${{ steps.godot.outputs.url }}'
          printf '%s  %s\n' '${{ steps.godot.outputs.sha256 }}' godot.zip | sha256sum --check --strict
          unzip -q godot.zip -d .godot-bin
          chmod +x .godot-bin/Godot_v4.7.1-stable_linux.x86_64

      - name: Run playable, movement and published-component smokes
        shell: bash
        env:
          GODOT_BIN: ${{ github.workspace }}/.godot-bin/Godot_v4.7.1-stable_linux.x86_64
        run: |
          set -euo pipefail
          mkdir -p first-playable-evidence
          bash tools/implementation/run_godot_smoke.sh 2>&1 | tee first-playable-evidence/state-machine.log
          bash tools/implementation/run_godot_movement_smoke.sh 2>&1 | tee first-playable-evidence/movement-interaction.log
          "$GODOT_BIN" --headless --path game --script res://components/session_state/session_state_smoke.gd 2>&1 | tee first-playable-evidence/session-state.log
          grep -Fx 'EVERFIELD_SESSION_STATE_SMOKE_PASS' first-playable-evidence/session-state.log
          "$GODOT_BIN" --headless --path game --script res://components/diagnostics/diagnostic_catalog_smoke.gd 2>&1 | tee first-playable-evidence/diagnostic-contract.log
          grep -Fx 'EVERFIELD_DIAGNOSTIC_CONTRACT_SMOKE_PASS' first-playable-evidence/diagnostic-contract.log
          "$GODOT_BIN" --headless --path game --script res://components/hud_objectives/hud_objective_model_smoke.gd 2>&1 | tee first-playable-evidence/hud-objectives.log
          grep -Fx 'EVERFIELD_HUD_OBJECTIVE_MODEL_SMOKE_PASS' first-playable-evidence/hud-objectives.log
          checked_out_sha="$(git rev-parse HEAD)"
          printf 'event_sha=%s\nchecked_out_sha=%s\npr_head_sha=%s\nrun_id=%s\nrun_attempt=%s\nreviewed_godot_version=%s\nreviewed_godot_sha256=%s\n' \
            "$GITHUB_SHA" "$checked_out_sha" '${{ github.event.pull_request.head.sha || github.sha }}' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
            '${{ steps.godot.outputs.version }}' '${{ steps.godot.outputs.sha256 }}' \
            > first-playable-evidence/run-identity.txt
          sha256sum \
            game/project.godot \
            game/main.tscn \
            game/main.gd \
            game/smoke_test.gd \
            game/tests/movement_interaction_smoke.gd \
            tools/implementation/run_godot_movement_smoke.sh \
            game/components/old_works_world/old_works_world_presentation.gd \
            game/components/session_state/session_state.gd \
            game/components/session_state/session_state_smoke.gd \
            game/components/diagnostics/diagnostic_catalog.gd \
            game/components/diagnostics/diagnostic_catalog_smoke.gd \
            game/components/hud_objectives/hud_objective_model.gd \
            game/components/hud_objectives/hud_objective_model_smoke.gd \
            game/components/commons_hearing/commons_hearing_presentation.gd \
            game/components/commitment_consequences/commitment_consequence_presentation.gd \
            > first-playable-evidence/implementation.sha256

      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: godot-first-playable-${{ github.run_id }}-${{ github.run_attempt }}
          path: first-playable-evidence/
          if-no-files-found: error
          retention-days: 30

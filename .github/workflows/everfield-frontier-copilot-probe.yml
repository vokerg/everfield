name: Everfield Copilot Actions capability probe

# Security correction of the original read-only smoke test. This workflow is
# NEVER evaluated from a PR head. PR-only validation runs in existing planning-frontier-maintenance.yml
# with contents:read and no copilot-requests permission.
on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: everfield-copilot-trusted-main-manual
  cancel-in-progress: false

jobs:
  trusted-main-probe:
    if: >-
      github.repository == 'vokerg/everfield' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
      copilot-requests: write
    steps:
      - name: Checkout exact trusted main dispatch SHA without git credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      # No npm install, floating transitive dependency, executable install
      # script or arbitrary package postinstall: one exact Linux/x64 artifact.
      # SHA-512 is from npm lockfile for @github/copilot-linux-x64@1.0.80.
      - name: Fetch immutable and verified Copilot CLI binary
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -s)" = Linux
          test "$(uname -m)" = x86_64
          archive="$RUNNER_TEMP/copilot-1.0.80-linux-x64.tgz"
          curl --fail --silent --show-error --location --retry 2 \
            'https://registry.npmjs.org/@github/copilot-linux-x64/-/copilot-linux-x64-1.0.80.tgz' \
            --output "$archive"
          printf '%s  %s\n' \
            'aafd72b553700372032bb91c428c3e7c08a40faeede36f8043c5f8d9b2bfee8b9d362bf87eb55930ed328750d821e6d545c9848663ef6d53d8fe9b5550addc6c' \
            "$archive" | sha512sum --check --status
          mkdir -p "$RUNNER_TEMP/copilot-pinned"
          tar -xzf "$archive" --no-same-owner -C "$RUNNER_TEMP/copilot-pinned"
          copilot="$RUNNER_TEMP/copilot-pinned/package/copilot"
          test -f "$copilot"
          chmod 0755 "$copilot"
          "$copilot" --version
          printf 'COPILOT_PINNED=%s\n' "$copilot" >> "$GITHUB_ENV"

      - name: Single fixed read-only model invocation with exact-response check
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CI: 'true'
          NO_COLOR: '1'
        run: |
          set -euo pipefail
          # No --allow-all-tools, no shell/edit/git/GitHub write tools, no PR,
          # issue or repository content interpolated into this fixed prompt.
          response="$RUNNER_TEMP/copilot-fixed-response.txt"
          timeout 180s "$COPILOT_PINNED" \
            -p 'Reply with exactly this one plain-text line and nothing else: EVERFIELD_COPILOT_ACTIONS_PROBE_OK. Do not use tools or inspect repository files.' \
            -s > "$response"
          python3 - "$response" <<'PY'
          from pathlib import Path
          import sys
          payload = Path(sys.argv[1]).read_bytes()
          expected = b"EVERFIELD_COPILOT_ACTIONS_PROBE_OK"
          if payload not in (expected, expected + b"\n"):
              raise SystemExit("Unexpected Copilot response; strict full-output equality failed")
          print("EVERFIELD_COPILOT_ACTIONS_PROBE_OK")
          PY
          echo '::notice title=Manual model reachability only::No source/issue/PR write permission, registered route or autonomous executor exists.'

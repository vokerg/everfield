name: W2 CI remediated engine toolchain capability probe

on:
  push:
    branches:
      - planning/issue-343
    paths:
      - .github/workflows/w2-ci-engine-toolchain-probe.yml
      - tools/planning/engine_toolchain_probe.py
      - tools/planning/engine_toolchain_policy.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: w2-ci-rem-01-${{ github.ref }}
  cancel-in-progress: false

jobs:
  capability-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1

      - name: Provision exact Defold-compatible Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '25'

      - name: Record runner and remediation code identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/planning/wave-2/evidence/ci
          {
            echo "trigger_sha=${GITHUB_SHA}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "runner_os=${RUNNER_OS}"
            echo "runner_arch=${RUNNER_ARCH}"
            echo "image_os=${ImageOS:-unknown}"
            echo "image_version=${ImageVersion:-unknown}"
            echo "setup_java_action=cf277c60eb25467037889841efdb72551f06f6c3"
            java -version 2>&1
            sha256sum tools/planning/engine_toolchain_probe.py
            sha256sum tools/planning/engine_toolchain_policy.py
            sha256sum docs/planning/wave-2/evidence/engine-spike-protocol-fixtures.py
          } | tee docs/planning/wave-2/evidence/ci/engine-toolchain-run-identity.txt

      - name: Validate remediation code and policy regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/planning/engine_toolchain_probe.py tools/planning/engine_toolchain_policy.py
          python3 tools/planning/engine_toolchain_policy.py --self-test \
            | tee docs/planning/wave-2/evidence/ci/engine-toolchain-policy-selftest.json

      - name: Re-run reviewed harness validator
        shell: bash
        run: |
          set -euo pipefail
          python3 docs/planning/wave-2/evidence/engine-spike-protocol-fixtures.py \
            > docs/planning/wave-2/evidence/ci/engine-harness-validator-ci.json

      - name: Execute bounded toolchain capability probes
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/planning/engine_toolchain_probe.py \
            --out docs/planning/wave-2/evidence/ci/engine-toolchain-capability.json \
            --bevy-lock docs/planning/wave-2/evidence/ci/bevy-0.19.0-Cargo.lock \
            --artifact-lock docs/planning/wave-2/evidence/ci/engine-toolchain-artifact-lock.json \
            | tee docs/planning/wave-2/evidence/ci/engine-toolchain-probe-summary.log
          sha256sum docs/planning/wave-2/evidence/ci/engine-toolchain-capability.json \
            | tee docs/planning/wave-2/evidence/ci/engine-toolchain-capability.sha256
          sha256sum docs/planning/wave-2/evidence/ci/bevy-0.19.0-Cargo.lock \
            | tee docs/planning/wave-2/evidence/ci/bevy-0.19.0-Cargo.lock.sha256
          sha256sum docs/planning/wave-2/evidence/ci/engine-toolchain-artifact-lock.json \
            | tee docs/planning/wave-2/evidence/ci/engine-toolchain-artifact-lock.sha256

      - name: Evaluate fail-closed policy and retain result
        id: policy
        shell: bash
        run: |
          set +e
          python3 tools/planning/engine_toolchain_policy.py \
            --capability-json docs/planning/wave-2/evidence/ci/engine-toolchain-capability.json \
            --bevy-lock docs/planning/wave-2/evidence/ci/bevy-0.19.0-Cargo.lock \
            --artifact-lock docs/planning/wave-2/evidence/ci/engine-toolchain-artifact-lock.json \
            | tee docs/planning/wave-2/evidence/ci/engine-toolchain-policy-result.json
          code=${PIPESTATUS[0]}
          echo "${code}" > docs/planning/wave-2/evidence/ci/engine-toolchain-policy-exit.txt
          echo "policy_exit=${code}" >> "${GITHUB_OUTPUT}"
          exit 0

      - name: Persist exact run evidence on task branch
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/planning/wave-2/evidence/ci/
          if git diff --cached --quiet; then
            echo "No generated evidence delta"
            exit 0
          fi
          git commit -m "[PLAN-v1][W2-CI-REM-01] Record CI remediation probe run ${GITHUB_RUN_ID}"
          git push origin HEAD:planning/issue-343

      - name: Upload immutable run bundle
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: w2-ci-rem-01-${{ github.run_id }}-${{ github.run_attempt }}
          path: docs/planning/wave-2/evidence/ci/
          if-no-files-found: error
          retention-days: 30

      - name: Enforce fail-closed capability policy
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          code="$(cat docs/planning/wave-2/evidence/ci/engine-toolchain-policy-exit.txt 2>/dev/null || echo 99)"
          echo "Recorded capability-policy exit: ${code}"
          test "${code}" = "0"

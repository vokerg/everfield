name: Everfield Unity S3 reviewed-v5 lineage recorder

on:
  workflow_call:
    inputs:
      source_run_id:
        description: "Exact successful evaluator run id from the caller"
        required: true
        type: number
      source_run_attempt:
        description: "Exact evaluator run attempt from the caller"
        required: true
        type: number
      source_head_sha:
        description: "Exact evaluator source head on main"
        required: true
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: everfield-unity-s3-v5-lineage-recorder-${{ inputs.source_run_id }}-${{ inputs.source_run_attempt }}
  cancel-in-progress: false

jobs:
  record:
    if: >-
      github.repository == 'vokerg/everfield' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Bind exact caller-provided evaluator run and current-main identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.source_run_id }}
          RUN_ATTEMPT: ${{ inputs.source_run_attempt }}
          SOURCE_HEAD_SHA: ${{ inputs.source_head_sha }}
          EXPECTED_WORKFLOW_NAME: Everfield Unity S3 reviewed-v5 lineage evaluator
          EXPECTED_WORKFLOW_PATH: .github/workflows/unity-s3-v5-lineage-evaluator.yml
          EXPECTED_REPOSITORY: vokerg/everfield
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          api = os.environ["GITHUB_API_URL"].rstrip("/")
          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          run_id = os.environ["RUN_ID"]
          run_attempt = os.environ["RUN_ATTEMPT"]
          expected_repo = os.environ["EXPECTED_REPOSITORY"]
          expected_path = os.environ["EXPECTED_WORKFLOW_PATH"]
          expected_name = os.environ["EXPECTED_WORKFLOW_NAME"]
          expected_head = os.environ["SOURCE_HEAD_SHA"]

          if repo != expected_repo:
              raise SystemExit("repository identity mismatch")
          if not run_id.isdigit() or not run_attempt.isdigit():
              raise SystemExit("caller run identity is not numeric")
          if len(expected_head) != 40 or any(c not in "0123456789abcdef" for c in expected_head.lower()):
              raise SystemExit("caller source head is not a sha40")

          def get(path):
              request = urllib.request.Request(
                  f"{api}/repos/{repo}/{path}",
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(request, timeout=20) as response:
                  return json.load(response)

          run = get(f"actions/runs/{run_id}")
          checks = {
              "id": str(run.get("id")) == run_id,
              "run_attempt": str(run.get("run_attempt")) == run_attempt,
              "name": run.get("name") == expected_name,
              "event": run.get("event") == "workflow_dispatch",
              "status": run.get("status") == "completed",
              "conclusion": run.get("conclusion") == "success",
              "head_branch": run.get("head_branch") == "main",
              "head_sha": run.get("head_sha") == expected_head,
              "repository": (run.get("repository") or {}).get("full_name") == expected_repo,
          }
          failed = [key for key, ok in checks.items() if not ok]
          if failed:
              raise SystemExit(f"upstream run identity mismatch: {failed}")

          workflow_id = str(run.get("workflow_id") or "")
          if not workflow_id.isdigit():
              raise SystemExit("upstream workflow id is invalid")
          workflow = get(f"actions/workflows/{workflow_id}")
          if (
              workflow.get("path") != expected_path
              or workflow.get("name") != expected_name
              or str(workflow.get("id")) != workflow_id
          ):
              raise SystemExit("trusted lineage evaluator workflow identity mismatch")

          branch = get("branches/main")
          publication_base = (branch.get("commit") or {}).get("sha")
          if publication_base != expected_head:
              raise SystemExit("source head is not exact current main")

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as out:
              out.write(f"SOURCE_WORKFLOW_ID={workflow_id}\n")
              out.write(f"SOURCE_WORKFLOW_PATH={expected_path}\n")
              out.write(f"SOURCE_WORKFLOW_NAME={expected_name}\n")
              out.write(f"PUBLICATION_BASE_MAIN_SHA={publication_base}\n")
          print(json.dumps({
              "run_id": run["id"],
              "run_attempt": run["run_attempt"],
              "workflow_id": workflow_id,
              "head_sha": expected_head,
              "publication_base_main_sha": publication_base,
          }, sort_keys=True))
          PY

      - name: Checkout exact source head for trusted projection code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.source_head_sha }}
          fetch-depth: 1

      - name: Verify projection code identity and deterministic self-tests
        shell: bash
        env:
          SOURCE_HEAD_SHA: ${{ inputs.source_head_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_HEAD_SHA"
          test -f "$SOURCE_WORKFLOW_PATH"
          test -f tools/planning/unity_s3_v5_lineage.py
          test -f tools/planning/record_unity_s3_v5_lineage.py
          PYTHONPYCACHEPREFIX="$RUNNER_TEMP/unity-s3-v5-lineage-recorder-pycache" \
            python3 -m py_compile \
              tools/planning/unity_s3_v5_lineage.py \
              tools/planning/record_unity_s3_v5_lineage.py
          PYTHONPYCACHEPREFIX="$RUNNER_TEMP/unity-s3-v5-lineage-recorder-pycache" \
            python3 tools/planning/unity_s3_v5_lineage.py --self-test
          PYTHONPYCACHEPREFIX="$RUNNER_TEMP/unity-s3-v5-lineage-recorder-pycache" \
            python3 -m tools.planning.record_unity_s3_v5_lineage --self-test
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Download only the exact upstream lineage artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: w2-unity-s3-v5-lineage-${{ inputs.source_run_id }}-${{ inputs.source_run_attempt }}
          path: ${{ runner.temp }}/everfield-unity-s3-v5-lineage
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}

      - name: Validate and project exact Unity S3 v5 lineage evidence
        shell: bash
        env:
          SOURCE: ${{ runner.temp }}/everfield-unity-s3-v5-lineage/lineage.json
          RUN_ID: ${{ inputs.source_run_id }}
          RUN_ATTEMPT: ${{ inputs.source_run_attempt }}
          SOURCE_HEAD_SHA: ${{ inputs.source_head_sha }}
          SOURCE_HEAD_BRANCH: main
          SOURCE_EVENT: workflow_dispatch
        run: |
          set -euo pipefail
          EVIDENCE_PATH="docs/planning/wave-2/evidence/ci/unity-s3-v5-lineage/$RUN_ID/lineage.json"
          PYTHONPYCACHEPREFIX="$RUNNER_TEMP/unity-s3-v5-lineage-recorder-pycache" \
            python3 -m tools.planning.record_unity_s3_v5_lineage \
              --input "$SOURCE" \
              --output "$EVIDENCE_PATH" \
              --run-id "$RUN_ID" \
              --run-attempt "$RUN_ATTEMPT" \
              --head-sha "$SOURCE_HEAD_SHA" \
              --branch "$SOURCE_HEAD_BRANCH" \
              --source-workflow-id "$SOURCE_WORKFLOW_ID" \
              --source-workflow-name "$SOURCE_WORKFLOW_NAME" \
              --source-workflow-path "$SOURCE_WORKFLOW_PATH" \
              --source-event "$SOURCE_EVENT" \
              --source-conclusion success \
              --projection-code-sha "$SOURCE_HEAD_SHA" \
              --publication-base-main-sha "$PUBLICATION_BASE_MAIN_SHA"
          echo "EVIDENCE_PATH=$EVIDENCE_PATH" >> "$GITHUB_ENV"

      - name: Verify checkout has exactly one bounded generated evidence change
        shell: bash
        run: |
          set -euo pipefail
          test -f "$EVIDENCE_PATH"
          test "$(git rev-parse HEAD)" = "${{ inputs.source_head_sha }}"
          test "$(git status --porcelain --untracked-files=all)" = "?? $EVIDENCE_PATH"

      - name: Publish immutable lineage evidence branch handoff
        shell: bash
        env:
          RUN_ID: ${{ inputs.source_run_id }}
          RUN_ATTEMPT: ${{ inputs.source_run_attempt }}
          SOURCE_HEAD_SHA: ${{ inputs.source_head_sha }}
        run: |
          set -euo pipefail
          EVIDENCE_BRANCH="evidence/unity-s3-v5-lineage/run-${RUN_ID}-attempt-${RUN_ATTEMPT}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$EVIDENCE_BRANCH"
          git add -- "$EVIDENCE_PATH"
          test "$(git diff --cached --name-only)" = "$EVIDENCE_PATH"
          git commit -m "[PLAN-v1][W2-ENG-TECH-UNITY-S3-V5-RERUN-01] Stage lineage run ${RUN_ID}"
          git push origin "HEAD:refs/heads/$EVIDENCE_BRANCH"
          export EVIDENCE_BRANCH
          python3 - <<'PY'
          import json
          import os

          print(json.dumps({
              "draft_pr_created_by_workflow": False,
              "draft_pr_required": True,
              "evidence_branch": os.environ["EVIDENCE_BRANCH"],
              "evidence_path": os.environ["EVIDENCE_PATH"],
              "integration_authority": False,
              "next_step": "SEPARATE_NORMAL_OWNERSHIP_EPISODE_OPENS_DRAFT_PR",
              "publication_base_main_sha": os.environ["PUBLICATION_BASE_MAIN_SHA"],
              "run_attempt": os.environ["RUN_ATTEMPT"],
              "run_id": os.environ["RUN_ID"],
              "source_head_sha": os.environ["SOURCE_HEAD_SHA"],
              "source_workflow_id": os.environ["SOURCE_WORKFLOW_ID"],
          }, sort_keys=True))
          PY

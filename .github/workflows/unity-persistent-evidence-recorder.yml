name: Everfield persistent Unity evidence recorder

on:
  workflow_run:
    workflows:
      - Everfield persistent Unity exact-main evaluator
    types:
      - completed

permissions:
  actions: read
  contents: write

concurrency:
  group: everfield-unity-persistent-recorder-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
  cancel-in-progress: false

jobs:
  record:
    if: >-
      github.repository == 'vokerg/everfield' &&
      github.event.workflow_run.name == 'Everfield persistent Unity exact-main evaluator' &&
      github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch') &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == 'vokerg/everfield'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Bind exact upstream workflow, run, and trusted-main identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          SOURCE_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          SOURCE_EVENT: ${{ github.event.workflow_run.event }}
          EVENT_WORKFLOW_ID: ${{ github.event.workflow_run.workflow_id }}
          EXPECTED_WORKFLOW_NAME: Everfield persistent Unity exact-main evaluator
          EXPECTED_WORKFLOW_PATH: .github/workflows/unity-persistent-evaluator.yml
          EXPECTED_REPOSITORY: vokerg/everfield
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          api = os.environ['GITHUB_API_URL'].rstrip('/')
          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          run_id = os.environ['RUN_ID']
          expected_repo = os.environ['EXPECTED_REPOSITORY']
          expected_path = os.environ['EXPECTED_WORKFLOW_PATH']
          expected_name = os.environ['EXPECTED_WORKFLOW_NAME']
          event_workflow_id = str(os.environ['EVENT_WORKFLOW_ID'])
          expected_head = os.environ['SOURCE_HEAD_SHA']
          expected_event = os.environ['SOURCE_EVENT']

          if repo != expected_repo:
              raise SystemExit('repository identity mismatch')

          def get(path):
              request = urllib.request.Request(
                  f"{api}/repos/{repo}/{path}",
                  headers={
                      'Authorization': f'Bearer {token}',
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28',
                  },
              )
              with urllib.request.urlopen(request, timeout=20) as response:
                  return json.load(response)

          run = get(f"actions/runs/{run_id}")
          checks = {
              'id': str(run.get('id')) == run_id,
              'run_attempt': str(run.get('run_attempt')) == os.environ['RUN_ATTEMPT'],
              'name': run.get('name') == expected_name,
              'event': run.get('event') == expected_event,
              'event_allowed': expected_event in {'push', 'workflow_dispatch'},
              'status': run.get('status') == 'completed',
              'conclusion': run.get('conclusion') == 'success',
              'head_branch': run.get('head_branch') == 'main',
              'head_sha': run.get('head_sha') == expected_head,
              'repository': (run.get('repository') or {}).get('full_name') == expected_repo,
              'workflow_id': str(run.get('workflow_id')) == event_workflow_id,
          }
          failed = [key for key, ok in checks.items() if not ok]
          if failed:
              raise SystemExit(f"upstream run identity mismatch: {failed}")

          workflow = get(f"actions/workflows/{run['workflow_id']}")
          if workflow.get('path') != expected_path:
              raise SystemExit('trusted persistent evaluator workflow path mismatch')
          if str(workflow.get('id')) != event_workflow_id:
              raise SystemExit('trusted persistent evaluator workflow id mismatch')

          branch = get('branches/main')
          publication_base = (branch.get('commit') or {}).get('sha')
          if publication_base != expected_head:
              compare = get(f"compare/{expected_head}...{publication_base}")
              if (compare.get('merge_base_commit') or {}).get('sha') != expected_head:
                  raise SystemExit('source head is no longer an ancestor of current main')

          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as out:
              out.write(f"SOURCE_WORKFLOW_ID={run['workflow_id']}\n")
              out.write(f"SOURCE_WORKFLOW_PATH={expected_path}\n")
              out.write(f"SOURCE_WORKFLOW_NAME={expected_name}\n")
              out.write(f"PUBLICATION_BASE_MAIN_SHA={publication_base}\n")
          print(json.dumps({
              'run_id': run['id'],
              'run_attempt': run['run_attempt'],
              'workflow_id': run['workflow_id'],
              'workflow_path': expected_path,
              'head_sha': expected_head,
              'source_event': expected_event,
              'publication_base_main_sha': publication_base,
          }, sort_keys=True))
          PY

      - name: Checkout exact source head for trusted projection code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 1

      - name: Fail closed unless projection code identity matches source head
        shell: bash
        env:
          SOURCE_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_HEAD_SHA"
          test -f "$SOURCE_WORKFLOW_PATH"
          test -f tools/planning/record_unity_persistent_evidence.py
          PYTHONPYCACHEPREFIX="$RUNNER_TEMP/persistent-unity-recorder-pycache" \
            python3 -m py_compile tools/planning/record_unity_persistent_evidence.py tools/planning/record_provider_effective_access.py
          test -z "$(git status --porcelain --untracked-files=all)"
          echo "persistent projection code identity: $SOURCE_HEAD_SHA"

      - name: Download only the exact upstream persistent Unity artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: w2-unity-persistent-access-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          path: ${{ runner.temp }}/everfield-unity-persistent
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Validate and project persistent Unity evidence
        shell: bash
        env:
          SOURCE: ${{ runner.temp }}/everfield-unity-persistent/provider-effective-access.json
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          SOURCE_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          SOURCE_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          SOURCE_EVENT: ${{ github.event.workflow_run.event }}
        run: |
          set -euo pipefail
          EVIDENCE_PATH="docs/planning/wave-2/evidence/ci/unity-persistent-access/$RUN_ID/effective.json"
          python3 tools/planning/record_unity_persistent_evidence.py \
            --input "$SOURCE" \
            --output "$EVIDENCE_PATH" \
            --run-id "$RUN_ID" \
            --run-attempt "$RUN_ATTEMPT" \
            --head-sha "$SOURCE_HEAD_SHA" \
            --branch "$SOURCE_HEAD_BRANCH" \
            --source-workflow-id "$SOURCE_WORKFLOW_ID" \
            --source-workflow-name "$SOURCE_WORKFLOW_NAME" \
            --source-workflow-path "$SOURCE_WORKFLOW_PATH" \
            --source-event "$SOURCE_EVENT" \
            --source-conclusion success \
            --projection-code-sha "$SOURCE_HEAD_SHA" \
            --publication-base-main-sha "$PUBLICATION_BASE_MAIN_SHA"
          echo "EVIDENCE_PATH=$EVIDENCE_PATH" >> "$GITHUB_ENV"

      - name: Verify checkout has only the bounded generated evidence change
        shell: bash
        run: |
          set -euo pipefail
          test -f "$EVIDENCE_PATH"
          test "$(git rev-parse HEAD)" = "${{ github.event.workflow_run.head_sha }}"
          test "$(git status --porcelain --untracked-files=all)" = "?? $EVIDENCE_PATH"

      - name: Publish immutable persistent Unity evidence branch handoff
        shell: bash
        env:
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          SOURCE_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          EVIDENCE_BRANCH="evidence/unity-persistent-access/run-${RUN_ID}-attempt-${RUN_ATTEMPT}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$EVIDENCE_BRANCH"
          git add -- "$EVIDENCE_PATH"
          test "$(git diff --cached --name-only)" = "$EVIDENCE_PATH"
          git commit -m "[PLAN-v1][W2-ENG-UNITY-PERSISTENT-RUNNER-01] Stage persistent Unity run ${RUN_ID}"
          git push origin "HEAD:refs/heads/$EVIDENCE_BRANCH"
          export EVIDENCE_BRANCH
          python3 - <<'PY'
          import json
          import os

          print(json.dumps({
              'draft_pr_created_by_workflow': False,
              'draft_pr_required': True,
              'evidence_branch': os.environ['EVIDENCE_BRANCH'],
              'evidence_path': os.environ['EVIDENCE_PATH'],
              'integration_authority': False,
              'next_step': 'SEPARATE_NORMAL_OWNERSHIP_EPISODE_OPENS_DRAFT_PR',
              'publication_base_main_sha': os.environ['PUBLICATION_BASE_MAIN_SHA'],
              'run_attempt': os.environ['RUN_ATTEMPT'],
              'run_id': os.environ['RUN_ID'],
              'source_head_sha': os.environ['SOURCE_HEAD_SHA'],
              'source_workflow_id': os.environ['SOURCE_WORKFLOW_ID'],
          }, sort_keys=True))
          PY

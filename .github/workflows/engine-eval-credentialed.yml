name: Everfield engine effective credentialed evaluator

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: everfield-engine-effective-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  credentialed-evaluator:
    if: >-
      github.repository == 'vokerg/everfield' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    environment: engine-eval
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      UNITY_EDITOR_VERSION: ${{ vars.UNITY_EDITOR_VERSION }}
      UNREAL_ENGINE_VERSION: ${{ vars.UNREAL_ENGINE_VERSION }}
      UNREAL_GITHUB_USERNAME: ${{ vars.UNREAL_GITHUB_USERNAME }}
    steps:
      - name: Checkout exact trusted event SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Fail closed unless checkout matches the trusted-main event
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
          EXPECTED_REF: refs/heads/main
          EXPECTED_REPOSITORY: vokerg/everfield
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "$EXPECTED_REPOSITORY"
          test "$GITHUB_REF" = "$EXPECTED_REF"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -f .github/workflows/engine-eval-credentialed.yml
          echo "trusted evaluator source identity: $EXPECTED_SHA"

      - name: Install and pin the Unity CLI channel
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://public-cdn.cloud.unity3d.com/hub/prod/cli/install.sh | UNITY_CLI_VERSION=1.0.0-beta.5 bash
          export PATH="$HOME/.unity/bin:$PATH"
          test "$(unity --version)" = "1.0.0-beta.5"
          echo "UNITY_CLI=$HOME/.unity/bin/unity" >> "$GITHUB_ENV"

      - name: Validate validator syntax and deterministic self-tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            tools/planning/engine_provider_effective_validator.py \
            tools/planning/record_provider_effective_access.py
          python3 tools/planning/engine_provider_effective_validator.py --self-test

      - name: Run effective per-provider development-access validation
        shell: bash
        env:
          UNITY_SERVICE_ACCOUNT_ID: ${{ secrets.UNITY_SERVICE_ACCOUNT_ID }}
          UNITY_SERVICE_ACCOUNT_SECRET: ${{ secrets.UNITY_SERVICE_ACCOUNT_SECRET }}
          UNREAL_GITHUB_TOKEN: ${{ secrets.UNREAL_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p "$RUNNER_TEMP/everfield-engine-effective"
          python3 tools/planning/engine_provider_effective_validator.py \
            --out "$RUNNER_TEMP/everfield-engine-effective/provider-effective-access.json"

      - name: Assert evidence is sanitized and preserves the historical frontier
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path(__import__('os').environ['RUNNER_TEMP']) / 'everfield-engine-effective/provider-effective-access.json'
          d = json.loads(p.read_text())
          assert d['schema'] == 'W2-ENG-PROVIDER-EFFECTIVE-ACCESS-v1'
          assert set(d['providers']) == {'Unity', 'Unreal Engine'}
          assert d['frontier']['combined_predicate_used_for_individual_unlock'] is False
          assert d['frontier']['historical_not_run_cells_preserved'] == 50
          assert d['frontier']['historical_not_run_cells_mutated'] is False
          assert d['secret_values_in_evidence'] is False
          assert d['secret_hashes_in_evidence'] is False
          text = p.read_text()
          for term in ('UNITY_SERVICE_ACCOUNT_SECRET', 'UNREAL_GITHUB_TOKEN', 'password=', 'token='):
              assert term not in text
          print('sanitized effective-access envelope: PASS')
          PY

      - name: Upload sanitized evidence for the trusted recorder
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: w2-engine-effective-access-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/everfield-engine-effective/provider-effective-access.json
          if-no-files-found: error
          retention-days: 30

name: Verify Commons Hearing component for Issue 1429

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/verify-commons-hearing-1429.yml'
      - 'docs/planning/handoffs/issue-1429.md'

permissions:
  contents: read

concurrency:
  group: verify-commons-hearing-1429-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  exact-component-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact frozen producer
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: a610b00ed03282cc079cca4d4f9430ddd54e9bf0
          fetch-depth: 1

      - name: Verify frozen producer identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "a610b00ed03282cc079cca4d4f9430ddd54e9bf0"
          test "$(git hash-object game/components/commons_hearing/commons_hearing_presentation.gd)" = "9682c47ee2c84ea42417651d0ca2e4f30ebf78b2"
          test "$(git hash-object game/components/commons_hearing/commons_hearing_presentation_smoke.gd)" = "0ebbccebf03e12386ba8fd31f593aade200b4323"

      - name: Resolve reviewed Godot artifact lock
        id: godot
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          lock = json.loads(Path("docs/planning/wave-2/evidence/ci/engine-toolchain-artifact-lock.json").read_text())
          entry = lock["entries"]["godot_4.7.1_linux_x86_64_zip"]
          if entry["version"] != "4.7.1-stable":
              raise SystemExit(f"unexpected reviewed Godot version: {entry['version']}")
          print(f"url={entry['url']}")
          print(f"sha256={entry['sha256']}")
          print(f"version={entry['version']}")
          PY

      - name: Acquire exact reviewed Godot 4.7.1 artifact
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output godot.zip '${{ steps.godot.outputs.url }}'
          printf '%s  %s\n' '${{ steps.godot.outputs.sha256 }}' godot.zip | sha256sum --check --strict
          unzip -q godot.zip -d .godot-bin
          chmod +x .godot-bin/Godot_v4.7.1-stable_linux.x86_64

      - name: Run exact Commons Hearing component smoke
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p issue-1429-evidence
          godot_bin="$GITHUB_WORKSPACE/.godot-bin/Godot_v4.7.1-stable_linux.x86_64"
          version="$("$godot_bin" --version)"
          printf 'godot_version=%s\n' "$version" | tee issue-1429-evidence/engine.txt
          [[ "$version" =~ ^4\.7\.1\.stable ]]
          "$godot_bin" --headless --path game --editor --quit
          "$godot_bin" --headless --path game --script res://components/commons_hearing/commons_hearing_presentation_smoke.gd \
            2>&1 | tee issue-1429-evidence/component-smoke.log
          grep -Fx 'EVERFIELD_COMMONS_HEARING_PRESENTATION_SMOKE_PASS' issue-1429-evidence/component-smoke.log
          printf 'producer_head=%s\ncomponent_blob=%s\nsmoke_blob=%s\nrun_id=%s\nrun_attempt=%s\nreviewed_godot_version=%s\nreviewed_godot_sha256=%s\nsentinel=%s\n' \
            "$(git rev-parse HEAD)" \
            "$(git hash-object game/components/commons_hearing/commons_hearing_presentation.gd)" \
            "$(git hash-object game/components/commons_hearing/commons_hearing_presentation_smoke.gd)" \
            "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
            '${{ steps.godot.outputs.version }}' '${{ steps.godot.outputs.sha256 }}' \
            'EVERFIELD_COMMONS_HEARING_PRESENTATION_SMOKE_PASS' \
            > issue-1429-evidence/run-identity.txt

      - name: Upload exact runtime evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue-1429-commons-hearing-component-${{ github.run_id }}-${{ github.run_attempt }}
          path: issue-1429-evidence/
          if-no-files-found: error
          retention-days: 30

name: Review 773 factory convergence validation

on:
  push:
    branches:
      - planning/issue-773

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact judged producer
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 5760bbcf6a35db03c6f47567a5237f466f495145
          fetch-depth: 1
          persist-credentials: false

      - name: Compile and run full maintenance self-tests
        run: |
          python3 -m py_compile \
            tools/planning/frontier_maintenance.py \
            tools/planning/frontier_maintenance_v2.py \
            tools/planning/frontier_maintenance_v3.py
          python3 tools/planning/frontier_maintenance_v3.py --self-test

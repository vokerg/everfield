name: Issue 1092 exact-head validation

on:
  push:
    branches:
      - planning/issue-1092

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact event SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Compile and run frontier maintenance self-tests
        run: |
          python3 -m py_compile \
            tools/planning/frontier_maintenance.py \
            tools/planning/frontier_maintenance_v2.py \
            tools/planning/frontier_maintenance_v3.py \
            tools/planning/frontier_maintenance_v4.py \
            tools/planning/frontier_maintenance_v5.py
          python3 tools/planning/frontier_maintenance_v5.py --self-test

name: W2 ENG technical S6 remediation

on:
  push:
    branches:
      - planning/issue-460
    paths:
      - .github/workflows/w2-eng-technical-s6-remediation.yml
      - tools/planning/engine_technical_s6_remediation.py
      - tools/planning/engine_technical_s6_remediation_verify.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: w2-eng-tech-s6-rem-01-${{ github.ref }}
  cancel-in-progress: false

jobs:
  remediate-s6:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact remediation trigger
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1

      - name: Provision real X11 capture plumbing
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb scrot imagemagick libglu1-mesa libx11-6 libxcursor1 libxi6 libxrandr2 libxinerama1 libxkbcommon0

      - name: Validate remediation code and frozen S6 authority
        shell: bash
        run: |
          set -euo pipefail
          out=docs/planning/wave-2/evidence/ci/engine-technical-s6-remediation
          mkdir -p "$out"
          python3 -m py_compile tools/planning/engine_technical_s6_remediation.py tools/planning/engine_technical_s6_remediation_verify.py tools/planning/engine_toolchain_probe.py docs/planning/wave-2/evidence/engine-spike-protocol-fixtures.py
          python3 docs/planning/wave-2/evidence/engine-spike-protocol-fixtures.py > "$out/harness-validator.json"
          python3 - <<'PY'
          import importlib.util
          p='docs/planning/wave-2/evidence/engine-spike-protocol-fixtures.py'
          s=importlib.util.spec_from_file_location('v',p);v=importlib.util.module_from_spec(s);s.loader.exec_module(v)
          assert v.FEATURE['capture_fixture']=={'logical_state_marker':'CAPTURE-STATE-042','viewport_width':1280,'viewport_height':720,'required_frame_count':1}
          assert v.SCENARIOS['S6']['fixed_input_refs']==['SLICE:logical_state','SLICE:player_surface','SLICE:capture_fixture']
          assert v.SCENARIOS['S6']['obligations']==['reach_known_state','identity_bound_capture','state_vs_capture_failure_separated']
          assert v.SCENARIOS['S6']['required_injections']==['FI-S6-CAPTURE-DOWN-v2']
          PY
          {
            echo "trigger_sha=${GITHUB_SHA}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "issue=460"
            echo "claim_comment=5309348003"
            echo "producer_issue=456"
            echo "producer_terminal=5309296967"
            echo "producer_head=0719199237d3ac46505f52a06df0a0fc93429c9f"
            echo "review_issue=458"
            echo "review_terminal=5309336848"
            echo "review_head=d2e7c34e583eedd2b2d5c4b02c8969e581b80563"
            sha256sum tools/planning/engine_technical_s6_remediation.py
            sha256sum tools/planning/engine_technical_s6_remediation_verify.py
            sha256sum tools/planning/engine_toolchain_probe.py
            sha256sum docs/planning/wave-2/evidence/engine-spike-protocol-fixtures.py
            sha256sum docs/planning/wave-2/evidence/ci/engine-toolchain-artifact-lock.json
          } | tee "$out/run-identity.txt"

      - name: Fresh Godot-only M01/M02 remediation execution
        shell: bash
        run: |
          set -euo pipefail
          out=docs/planning/wave-2/evidence/ci/engine-technical-s6-remediation
          Xvfb :99 -screen 0 1280x720x24 -nolisten tcp > "$out/xvfb.log" 2>&1 &
          xvfb_pid=$!
          trap 'kill "$xvfb_pid" 2>/dev/null || true' EXIT
          export DISPLAY=:99
          sleep 2
          python3 tools/planning/engine_technical_s6_remediation.py \
            --out "$out" \
            --validator docs/planning/wave-2/evidence/engine-spike-protocol-fixtures.py \
            --toolchain-probe tools/planning/engine_toolchain_probe.py \
            --artifact-lock docs/planning/wave-2/evidence/ci/engine-toolchain-artifact-lock.json \
            | tee "$out/summary.log"
          test -s "$out/frames/Godot/N1.png"
          test -s "$out/frames/Godot/N2.png"
          sha256sum "$out/evidence.json" | tee "$out/evidence.sha256"
          sha256sum "$out/frames/Godot/N1.png" "$out/frames/Godot/N2.png" | tee "$out/retained-frame-sha256.txt"

      - name: Independently verify retained bytes and real FI failure
        shell: bash
        run: |
          set -euo pipefail
          out=docs/planning/wave-2/evidence/ci/engine-technical-s6-remediation
          python3 tools/planning/engine_technical_s6_remediation_verify.py \
            --evidence "$out/evidence.json" \
            --validator docs/planning/wave-2/evidence/engine-spike-protocol-fixtures.py \
            --out "$out/independent-verification.json" \
            | tee "$out/independent-verification.log"
          sha256sum "$out/independent-verification.json" | tee "$out/independent-verification.sha256"

      - name: Enforce exact remediation envelope
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,pathlib
          out=pathlib.Path('docs/planning/wave-2/evidence/ci/engine-technical-s6-remediation')
          d=json.load(open(out/'evidence.json'));v=json.load(open(out/'independent-verification.json'))
          assert d['schema']=='W2-ENG-TECHNICAL-S6-REMEDIATION-v1' and d['mission_id']=='W2-ENG-TECH-S6-REM-01' and d['issue']==460
          assert d['frozen_provenance']['producer_head']=='0719199237d3ac46505f52a06df0a0fc93429c9f'
          assert d['frozen_provenance']['review_head']=='d2e7c34e583eedd2b2d5c4b02c8969e581b80563'
          assert d['frozen_provenance']['review_findings']==['W2-ENG-TECH-S6-REV-M01','W2-ENG-TECH-S6-REV-M02']
          assert d['local_semantics_ok'] is True and d['normal_frames_byte_distinct'] is True
          assert d['adaptation_validation']['result']=='ACCEPT'
          assert d['aggregate']=={'aggregate':'PASS_FOR_COMPARISON','reasons':[],'valid_envelope':True}
          assert d['candidate_matrix']['Godot']=='REMEDIATED_EMPIRICAL_S6_EVIDENCE_PENDING_REQUIRED_REVIEW'
          assert d['candidate_matrix']['Bevy']=='INCONCLUSIVE_HARNESS_OR_INFRA' and d['candidate_matrix']['Defold']=='INCONCLUSIVE_HARNESS_OR_INFRA'
          assert d['candidate_matrix']['Unity']=='NOT_RUN_BLOCKED_BY_SPECIFIC_AUTHORITY' and d['candidate_matrix']['Unreal Engine']=='NOT_RUN_BLOCKED_BY_SPECIFIC_AUTHORITY'
          raws=d['raw_attempts'];assert [x['record']['label'] for x in raws]==['N1','N2','FI1']
          n1,n2,fi=[x['record']['source'] for x in raws]
          assert n1['capture']['sha256'] != n2['capture']['sha256']
          for label,s in [('N1',n1),('N2',n2)]:
              p=out/s['retained_frame']['relative_path'];assert p.is_file() and p.stat().st_size>0
              assert hashlib.sha256(p.read_bytes()).hexdigest()==s['retained_frame']['sha256']==s['capture']['sha256']
              assert s['capture']['dimensions']==[1280,720] and s['capture']['marker_hex']==s['state_observation']['attempt_marker_hex']
          c=fi['capture'];assert fi['state_observation']['marker']=='CAPTURE-STATE-042' and fi['candidate_process_alive_at_capture'] is True
          assert c['real_capture_invoked'] is True and c['program']=='scrot' and c['capture_environment']['DISPLAY']==':199' and c['exit'] not in (0,None) and c['timed_out'] is False and c['path_exists'] is False and c['frame_count']==0
          assert fi['failure_separation']['classification']=='STATE_REACHABLE_CAPTURE_PIPELINE_UNAVAILABLE'
          assert v['schema']=='W2-ENG-TECHNICAL-S6-REMEDIATION-INDEPENDENT-VERIFY-v1' and v['all_remediation_invariants_verified'] is True
          assert v['actual_byte_substitution_rejected'] is True and v['fi_misclassification_rejected'] is True
          assert d['fresh_required_review'] is True and d['trusted_bounded_s6_comparison_authority'] is False and d['integration_authority'] is False and d['engine_selected'] is False and d['implementation_readiness'] is False and d['canonicality']=='NOT_CANONICAL'
          print(json.dumps({'validated':True,'generation':v['generation_id'],'m01_closed_for_review':True,'m02_closed_for_review':True},sort_keys=True))
          PY

      - name: Persist byte-bearing remediation evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/planning/wave-2/evidence/ci/engine-technical-s6-remediation/
          if git diff --cached --quiet; then echo "No generated evidence delta"; exit 0; fi
          git commit -m "[PLAN-v1][W2-ENG-TECH-S6-REM-01] Record byte-bearing S6 remediation run ${GITHUB_RUN_ID}"
          git push origin HEAD:planning/issue-460

      - name: Upload immutable byte-bearing remediation bundle
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: w2-eng-tech-s6-rem-01-${{ github.run_id }}-${{ github.run_attempt }}
          path: docs/planning/wave-2/evidence/ci/engine-technical-s6-remediation/
          if-no-files-found: error
          retention-days: 30

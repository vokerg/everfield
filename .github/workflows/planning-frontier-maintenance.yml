name: Everfield planning frontier maintenance

# Owner-directed incident freeze (2026-10-17): no unattended mutating
# reconciliation on a timer or every push while executable routes are empty.
# Keep the PR-only regression suite and allow deliberate manual reconciliation.
on:
  pull_request:
    paths:
      - 'tools/planning/frontier_maintenance*.py'
      - '.github/workflows/planning-frontier-maintenance.yml'
      - '.github/workflows/everfield-frontier-copilot-probe.yml'
      - 'docs/planning/handoffs/issue-1813.md'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write
  actions: write

concurrency:
  # Do not let main-push reconciliation evict pending PR validation.
  # Live mutating maintenance stays serialized independently.
  group: planning-frontier-maintenance-${{ github.event_name == 'pull_request' && github.head_ref || 'live' }}
  cancel-in-progress: false

jobs:
  validate-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - name: Checkout proposed merge
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Offline syntax and regression tests
        run: |
          python3 -m py_compile tools/planning/frontier_maintenance*.py
          python3 tools/planning/frontier_maintenance_v7.py --self-test

      - name: Fail closed on paid PR triggers, unsafe permissions or output matching
        if: hashFiles('.github/workflows/everfield-frontier-copilot-probe.yml') != ''
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          content = Path('.github/workflows/everfield-frontier-copilot-probe.yml').read_text()
          assert re.search(r'(?m)^on:\n  workflow_dispatch:\s*$', content)
          assert not re.search(r'(?m)^\s*(?:pull_request|push|schedule|pull_request_target):', content)
          assert re.search(r'(?m)^permissions: \{\}\s*$', content)
          assert 'github.ref == \'refs/heads/main\'' in content
          assert "github.event_name == 'workflow_dispatch'" in content
          assert "github.repository == 'vokerg/everfield'" in content
          assert 'copilot-requests: write' in content
          assert 'contents: write' not in content
          assert 'issues: write' not in content
          assert 'pull-requests: write' not in content
          assert 'persist-credentials: false' in content
          assert 'sha512sum --check --status' in content
          assert 'copilot-linux-x64-1.0.80.tgz' in content
          assert 'payload not in (expected, expected + b"\\n")' in content
          assert '--allow-all-tools' not in content.split('Single fixed read-only model invocation')[1].split('run: |',1)[-1].split('echo \'::notice')[0].replace('# No --allow-all-tools', '')
          print('paid model workflow manual-main-only static controls: PASS')
          PY
      - name: Independently verify and smoke test pinned CLI package without model token
        if: hashFiles('.github/workflows/everfield-frontier-copilot-probe.yml') != ''
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/copilot-1.0.80-linux-x64.tgz"
          curl --fail --silent --show-error --location --retry 2 \
            'https://registry.npmjs.org/@github/copilot-linux-x64/-/copilot-linux-x64-1.0.80.tgz' \
            --output "$archive"
          printf '%s  %s\n' \
            'aafd72b553700372032bb91c428c3e7c08a40faeede36f8043c5f8d9b2bfee8b9d362bf87eb55930ed328750d821e6d545c9848663ef6d53d8fe9b5550addc6c' \
            "$archive" | sha512sum --check --status
          mkdir -p "$RUNNER_TEMP/copilot-pinned"
          tar -xzf "$archive" --no-same-owner -C "$RUNNER_TEMP/copilot-pinned"
          test -f "$RUNNER_TEMP/copilot-pinned/package/copilot"
          chmod 0755 "$RUNNER_TEMP/copilot-pinned/package/copilot"
          "$RUNNER_TEMP/copilot-pinned/package/copilot" --version
          echo 'read-only immutable distribution check: PASS (zero paid model requests)'


  maintain:
    if: github.repository == 'vokerg/everfield' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact event SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Validate maintenance tool
        run: |
          python3 -m py_compile \
            tools/planning/frontier_maintenance.py \
            tools/planning/frontier_maintenance_v2.py \
            tools/planning/frontier_maintenance_v3.py \
            tools/planning/frontier_maintenance_v4.py \
            tools/planning/frontier_maintenance_v5.py \
            tools/planning/frontier_maintenance_v6.py \
            tools/planning/frontier_maintenance_v7.py
          python3 tools/planning/frontier_maintenance_v7.py --self-test

      - name: Reconcile frontier and registered transitions
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FRONTIER_ROUTES_PATH: .github/planning-frontier-routes.json
        run: python3 tools/planning/frontier_maintenance_v7.py

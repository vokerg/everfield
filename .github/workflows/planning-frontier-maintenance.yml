name: Everfield planning frontier maintenance

# Owner-directed incident freeze (2026-10-17): no unattended mutating
# reconciliation on a timer or every push while executable routes are empty.
# Keep the PR-only regression suite and allow deliberate manual reconciliation.
on:
  pull_request:
    paths:
      - 'tools/planning/frontier_maintenance*.py'
      - '.github/workflows/planning-frontier-maintenance.yml'
      - '.github/workflows/everfield-frontier-copilot-probe.yml'
      - 'docs/planning/handoffs/issue-1813.md'
      - '.github/workflows/everfield-frontier-worker.yml'
      - '.github/workflows/verify-movement-testability-1448.yml'
      - 'tools/factory/guarded_patch.py'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write
  actions: write

concurrency:
  # Do not let main-push reconciliation evict pending PR validation.
  # Live mutating maintenance stays serialized independently.
  group: planning-frontier-maintenance-${{ github.event_name == 'pull_request' && github.head_ref || 'live' }}
  cancel-in-progress: false

jobs:
  validate-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - name: Checkout proposed merge
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Offline syntax and regression tests
        run: |
          python3 -m py_compile tools/planning/frontier_maintenance*.py
          python3 tools/planning/frontier_maintenance_v7.py --self-test

      - name: Fail closed on paid PR triggers, unsafe permissions or output matching
        if: hashFiles('.github/workflows/everfield-frontier-copilot-probe.yml') != ''
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          content = Path('.github/workflows/everfield-frontier-copilot-probe.yml').read_text()
          assert re.search(r'(?m)^on:\n  workflow_dispatch:\s*$', content)
          assert not re.search(r'(?m)^\s*(?:pull_request|push|schedule|pull_request_target):', content)
          assert re.search(r'(?m)^permissions: \{\}\s*$', content)
          assert 'github.ref == \'refs/heads/main\'' in content
          assert "github.event_name == 'workflow_dispatch'" in content
          assert "github.repository == 'vokerg/everfield'" in content
          assert 'copilot-requests: write' in content
          assert 'contents: write' not in content
          assert 'issues: write' not in content
          assert 'pull-requests: write' not in content
          assert 'persist-credentials: false' in content
          assert 'sha512sum --check --status' in content
          assert 'copilot-linux-x64-1.0.80.tgz' in content
          assert "--available-tools='__everfield_no_tools__'" in content
          assert "--deny-tool='shell,read,write,url,memory'" in content
          assert '--no-ask-user' in content
          assert 'export COPILOT_HOME="$RUNNER_TEMP/copilot-fresh-home"' in content
          assert 'cd "$RUNNER_TEMP/copilot-isolated-cwd"' in content
          assert 'payload not in (expected, expected + b"\\n")' in content
          assert '--allow-all-tools' not in content.split('Single fixed read-only model invocation')[1].split('run: |',1)[-1].split('echo \'::notice')[0].replace('# No --allow-all-tools', '')
          print('paid model workflow manual-main-only static controls: PASS')
          PY
      - name: Independently verify and smoke test pinned CLI package without model token
        if: hashFiles('.github/workflows/everfield-frontier-copilot-probe.yml') != ''
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/copilot-1.0.80-linux-x64.tgz"
          curl --fail --silent --show-error --location --retry 2 \
            'https://registry.npmjs.org/@github/copilot-linux-x64/-/copilot-linux-x64-1.0.80.tgz' \
            --output "$archive"
          printf '%s  %s\n' \
            'aafd72b553700372032bb91c428c3e7c08a40faeede36f8043c5f8d9b2bfee8b9d362bf87eb55930ed328750d821e6d545c9848663ef6d53d8fe9b5550addc6c' \
            "$archive" | sha512sum --check --status
          mkdir -p "$RUNNER_TEMP/copilot-pinned"
          tar -xzf "$archive" --no-same-owner -C "$RUNNER_TEMP/copilot-pinned"
          test -f "$RUNNER_TEMP/copilot-pinned/package/copilot"
          chmod 0755 "$RUNNER_TEMP/copilot-pinned/package/copilot"
          "$RUNNER_TEMP/copilot-pinned/package/copilot" --version
          "$RUNNER_TEMP/copilot-pinned/package/copilot" --help > "$RUNNER_TEMP/copilot-help.txt"
          grep -F -- '--available-tools' "$RUNNER_TEMP/copilot-help.txt"
          grep -F -- '--deny-tool' "$RUNNER_TEMP/copilot-help.txt"
          grep -F -- '--no-ask-user' "$RUNNER_TEMP/copilot-help.txt"
          echo 'read-only immutable distribution/tool isolation check: PASS (zero paid model requests)'


      - name: Validate draft-worker isolation and patch allowlist
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/factory/guarded_patch.py
          python3 tools/factory/guarded_patch.py self-test
          python3 - <<'PY'
          from pathlib import Path
          import re
          w = Path(".github/workflows/everfield-frontier-worker.yml").read_text()
          assert re.search(r"(?m)^on:\n  issue_comment:\n    types: \[created\]\n  workflow_dispatch:\n    inputs:", w)
          assert not re.search(r"(?m)^  (?:push|pull_request|pull_request_target|schedule):", w)
          assert "github.event.comment.user.login == 'vokerg'" in w
          assert w.count("github.actor == 'vokerg'") == 2
          assert "github.event.comment.author_association == 'OWNER'" in w
          assert "github.event.comment.body == '/everfield worker run'" in w
          assert "github.event.issue.pull_request == null" in w
          assert w.count("github.ref == 'refs/heads/main'") == 2
          assert "github.ref == 'refs/heads/main'" in w
          assert "github.repository == 'vokerg/everfield'" in w
          assert "permissions: {}" in w
          generate, publish = w.split("\n  publish:\n", 1)
          assert "copilot-requests: write" in generate
          assert "contents: write" not in generate
          assert "pull-requests: write" not in generate
          assert "contents: write" in publish and "pull-requests: write" in publish
          assert "copilot-requests: write" not in publish
          assert "persist-credentials: false" in generate and "persist-credentials: false" in publish
          assert "--available-tools='view,edit,create,apply_patch,grep,glob'" in generate
          assert "--allow-tool='read,write'" in generate
          assert "--deny-tool='shell,url,memory'" in generate
          assert "export COPILOT_AUTO_UPDATE=false" in generate
          assert "sha256sum --check \"$RUNNER_TEMP/guarded_patch.sha256\"" in generate
          assert 'python3 "$RUNNER_TEMP/guarded_patch.py" capture' in generate
          assert 'python3 tools/factory/guarded_patch.py self-test' not in generate
          assert "Frozen trusted guard" not in publish
          assert "--allow-all" not in w
          assert 'python3 "$RUNNER_TEMP/guarded_patch.py" capture' in generate
          assert "issues/$ISSUE_NUMBER/comments?per_page=100" in generate
          assert "possible active task ownership" in generate
          assert "guarded_patch.py publish" in publish
          assert "actions: write" in publish and "issues: write" in publish
          assert "git/matching-refs/heads/factory/issue-$ISSUE_NUMBER-run-" in publish
          # Paid generation must fail closed on duplicate tasks and stale main
          # before downloading/launching the billable model, not only afterward.
          assert "git/matching-refs/heads/factory/issue-$ISSUE_NUMBER-run-" in generate
          assert "pulls?state=all&per_page=100" in generate
          assert ".head.ref | startswith(" in generate
          assert "git ls-remote origin refs/heads/main" in generate
          assert generate.index("existing_branches=") < generate.index("Download the exact reviewed Copilot CLI distribution")
          assert generate.index("test \"$(git ls-remote origin refs/heads/main") < generate.index("Let Copilot edit only disposable workspace files")
          assert 'gh workflow run godot-first-playable-smoke.yml --ref "$branch"' in publish
          assert 'if ! gh pr create --base main --head "$branch" --draft' in publish
          assert 'gh issue comment "$ISSUE_NUMBER" --body' in publish
          assert "Godot smoke via workflow_dispatch" in publish
          assert "Issue ownership changed before publication" in publish
          # The publish job must prove the exact title/body accepted by the
          # paid generator remained unchanged. A renamed/reworded task must
          # never quietly acquire authority from an older model response.
          assert "task_sha256: ${{ steps.task.outputs.task_sha256 }}" in generate
          assert "id: task" in generate
          assert "task_sha256=" in generate
          assert "TASK_SHA256: ${{ needs.generate.outputs.task_sha256 }}" in publish
          assert "Issue title/body changed since model input" in publish
          assert "Published task specification matches frozen model-input digest" in publish
          assert w.count("sort_keys=True, ensure_ascii=False, separators=") == 2
          import textwrap
          scripts = re.findall(r"(?ms)^          python3 [^\\n]* <<'PY'\\n(.*?)^          PY$", w)
          assert len(scripts) >= 3
          for script in scripts:
              compile(textwrap.dedent(script), "<workflow inline Python>", "exec")
          import hashlib, json
          def fingerprint(title, body):
              data = json.dumps({"title": title, "body": body}, sort_keys=True,
                                ensure_ascii=False, separators=(",", ":")).encode("utf-8")
              return hashlib.sha256(data).hexdigest()
          original = fingerprint("[PLAN-v1][IMPLEMENTATION-A]", "scope")
          assert original == fingerprint("[PLAN-v1][IMPLEMENTATION-A]", "scope")
          assert original != fingerprint("[PLAN-v1][IMPLEMENTATION-A]", "modified scope")
          assert original != fingerprint("[PLAN-v1][IMPLEMENTATION-B]", "scope")
          # Distinct issues may generate concurrently; one must not destroy
          # another's paid work solely because a reviewed merge advanced main.
          # A stale-base branch is review-only, never auto-integrated.
          assert 'publication_main="$(git ls-remote origin refs/heads/main | cut -f1)"' in publish
          assert "preserving stale-base source as draft ONLY" in publish
          assert "Trusted generation base: $GITHUB_SHA" in publish
          assert "main at publication $publication_main" in publish
          assert 'test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"' not in publish
          assert "--draft" in publish
          print("guarded issue-to-draft worker static isolation: PASS")
          PY


      - name: Confirm historical movement evidence cannot veto new gameplay
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          legacy = Path(".github/workflows/verify-movement-testability-1448.yml").read_text()
          trigger = legacy.split("\npermissions:", 1)[0]
          assert "github.event.pull_request.number == 1449" in legacy
          assert "github.event.pull_request.head.ref == 'planning/issue-1448'" in legacy
          assert "'game/tests/movement_interaction_smoke.gd'" not in trigger
          assert "'tools/implementation/run_godot_movement_smoke.sh'" not in trigger
          assert "pull_request:" in trigger
          assert "schedule:" not in trigger and "push:" not in trigger
          print("frozen #1448 movement verifier isolated from modern gameplay: PASS")
          PY


  maintain:
    if: github.repository == 'vokerg/everfield' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact event SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Validate maintenance tool
        run: |
          python3 -m py_compile \
            tools/planning/frontier_maintenance.py \
            tools/planning/frontier_maintenance_v2.py \
            tools/planning/frontier_maintenance_v3.py \
            tools/planning/frontier_maintenance_v4.py \
            tools/planning/frontier_maintenance_v5.py \
            tools/planning/frontier_maintenance_v6.py \
            tools/planning/frontier_maintenance_v7.py
          python3 tools/planning/frontier_maintenance_v7.py --self-test

      - name: Reconcile frontier and registered transitions
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FRONTIER_ROUTES_PATH: .github/planning-frontier-routes.json
        run: python3 tools/planning/frontier_maintenance_v7.py

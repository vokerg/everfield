name: Everfield planning frontier maintenance

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *'
  pull_request:
    paths:
      - 'tools/planning/frontier_maintenance*.py'
      - '.github/workflows/planning-frontier-maintenance.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write
  actions: write

concurrency:
  # Do not let main-push reconciliation evict pending PR validation.
  # Live mutating maintenance stays serialized independently.
  group: planning-frontier-maintenance-${{ github.event_name == 'pull_request' && github.head_ref || 'live' }}
  cancel-in-progress: false

jobs:
  validate-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout proposed merge
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Offline syntax and regression tests
        run: |
          python3 -m py_compile tools/planning/frontier_maintenance*.py
          python3 tools/planning/frontier_maintenance_v7.py --self-test

  maintain:
    if: github.repository == 'vokerg/everfield' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact event SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Validate maintenance tool
        run: |
          python3 -m py_compile \
            tools/planning/frontier_maintenance.py \
            tools/planning/frontier_maintenance_v2.py \
            tools/planning/frontier_maintenance_v3.py \
            tools/planning/frontier_maintenance_v4.py \
            tools/planning/frontier_maintenance_v5.py \
            tools/planning/frontier_maintenance_v6.py \
            tools/planning/frontier_maintenance_v7.py
          python3 tools/planning/frontier_maintenance_v7.py --self-test

      - name: Reconcile frontier and registered transitions
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FRONTIER_ROUTES_PATH: .github/planning-frontier-routes.json
        run: python3 tools/planning/frontier_maintenance_v7.py

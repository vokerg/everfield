name: Independently measure frozen approved public-text viewport #1626

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/verify-public-text-fit-1626.yml'
      - 'docs/planning/handoffs/issue-1642.md'

permissions:
  contents: read

concurrency:
  group: verify-public-text-fit-1626-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-frozen-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact frozen #1626 source, never verifier PR code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 3a9c8d59e6c21ae15e333b713fb98f987bf3490c
          fetch-depth: 1

      - name: Verify source and reviewed engine lock
        id: lock
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public-text-fit-evidence
          test "$(git rev-parse HEAD)" = '3a9c8d59e6c21ae15e333b713fb98f987bf3490c'
          test "$(git hash-object game/project.godot)" = '9da4153ed378945ef5e9634e0e5cae48289845d8'
          test "$(git hash-object game/tests/public_text_navigation/public_text_fit_smoke.gd)" = '949adfabbd685ddcfd11be823e45916b5fafe50e'
          test "$(git hash-object docs/planning/handoffs/issue-1626.md)" = '9e5cf370667e4ed8cb438e5b964983a033046d17'
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          lock = json.loads(Path("docs/planning/wave-2/evidence/ci/engine-toolchain-artifact-lock.json").read_text())
          entry = lock["entries"]["godot_4.7.1_linux_x86_64_zip"]
          assert entry["version"] == "4.7.1-stable"
          assert entry["sha256"] == "c7ff14fd28472c8d4f193043de30278dcf7e5241a1dcf7566b02e27addaa33ba"
          assert entry["url"] == "https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip"
          print("url=" + entry["url"])
          print("sha256=" + entry["sha256"])
          PY
          printf 'source_issue=1626\nsource_pr=1641\nsource_head=3a9c8d59e6c21ae15e333b713fb98f987bf3490c\nactual_checkout=%s\nverifier_pr_head=%s\nrun_id=%s\nrun_attempt=%s\n' \
            "$(git rev-parse HEAD)" '${{ github.event.pull_request.head.sha }}' \
            "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > public-text-fit-evidence/identity.txt
          sha256sum game/project.godot game/tests/public_text_navigation/public_text_fit_smoke.gd docs/planning/handoffs/issue-1626.md > public-text-fit-evidence/source-files.sha256

      - name: Obtain hash-locked reviewed Godot 4.7.1
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output godot.zip '${{ steps.lock.outputs.url }}'
          printf '%s  %s\n' '${{ steps.lock.outputs.sha256 }}' godot.zip | sha256sum --check --strict
          unzip -q godot.zip -d .godot-bin
          chmod +x .godot-bin/Godot_v4.7.1-stable_linux.x86_64

      - name: Run isolated approved-text fit measurement and regressions
        shell: bash
        env:
          GODOT_BIN: ${{ github.workspace }}/.godot-bin/Godot_v4.7.1-stable_linux.x86_64
        run: |
          set -euo pipefail
          test "$("$GODOT_BIN" --version)" = '4.7.1.stable.official.a13da4feb'
          printf 'godot_version=%s\ngodot_zip_sha256=%s\n' "$("$GODOT_BIN" --version)" '${{ steps.lock.outputs.sha256 }}' >> public-text-fit-evidence/identity.txt
          "$GODOT_BIN" --headless --path game --script res://tests/public_text_navigation/public_text_fit_smoke.gd 2>&1 | tee public-text-fit-evidence/public-text-fit-smoke.log
          grep -E '^EVERFIELD_PUBLIC_TEXT_FIT_MEASURED scenarios=13 overflow_count=[0-9]+$' public-text-fit-evidence/public-text-fit-smoke.log
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path
          log = Path("public-text-fit-evidence/public-text-fit-smoke.log").read_text()
          events = []
          for line in log.splitlines():
              marker = "EVERFIELD_PUBLIC_TEXT_FIT_EVIDENCE "
              if line.startswith(marker):
                  events.append(json.loads(line[len(marker):]))
          names = {
              "world_intro", "world_public_record", "world_material_trace",
              "world_truth_deferral", "commons_hearing_opening",
              "hearing_repair", "hearing_records_first", "hearing_explicit_deferral",
              "combined_repair", "combined_records_first", "combined_explicit_deferral",
              "consequence_repair_completion", "consequence_records_completion",
          }
          assert len(events) == len(names) == 13, "not 13 source-backed measurements"
          assert {x["scenario"] for x in events} == names, "missing/duplicate public scenario"
          count = sum(1 for x in events if x["overflow"])
          assert all(x["viewport"] == [960, 540] for x in events), "viewport mismatch"
          assert all(x["label_size"] == [422, 134] for x in events), "label geometry mismatch"
          assert all(x["available_height"] == 134 and x["line_count"] > 0 for x in events), "unusable measurement"
          assert all(x["required_height"] >= 0 and x["text_characters"] > 0 for x in events), "empty public text"
          assert all(re.fullmatch(r"[0-9a-f]{64}", x["text_sha256"]) for x in events), "source text hash absent"
          sentinel = f"EVERFIELD_PUBLIC_TEXT_FIT_MEASURED scenarios=13 overflow_count={count}"
          assert log.splitlines().count(sentinel) == 1, "missing or contradictory total sentinel"
          summary = {"scenarios": 13, "overflow_count": count,
                     "measurements": events, "assessment": "measurement_only_no_fit_certification"}
          Path("public-text-fit-evidence/measurements.json").write_text(
              json.dumps(summary, indent=2, sort_keys=True) + "\n"
          )
          print(f"EVERFIELD_PUBLIC_TEXT_VERIFIER_MEASURED scenarios=13 overflow_count={count}")
          PY
          ! grep -E 'SCRIPT ERROR|Parse Error|Assertion failed' public-text-fit-evidence/public-text-fit-smoke.log
          ! grep -F '[EVERFIELD][PUBLIC-TEXT-FIT][FAIL]' public-text-fit-evidence/public-text-fit-smoke.log
          bash tools/implementation/run_godot_smoke.sh 2>&1 | tee public-text-fit-evidence/first-playable.log
          bash tools/implementation/run_godot_movement_smoke.sh 2>&1 | tee public-text-fit-evidence/movement-interaction.log
          ! grep -E 'SCRIPT ERROR|Parse Error|Assertion failed' public-text-fit-evidence/first-playable.log
          ! grep -F '[EF-SMOKE][FAIL]' public-text-fit-evidence/first-playable.log
          ! grep -E 'SCRIPT ERROR|Parse Error|Assertion failed' public-text-fit-evidence/movement-interaction.log
          ! grep -F '[EF-MOVEMENT-SMOKE][FAIL]' public-text-fit-evidence/movement-interaction.log
          printf 'measurement_and_existing_smokes=PASS\n' >> public-text-fit-evidence/identity.txt

      - name: Upload immutable run evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-text-fit-1627-${{ github.run_id }}-${{ github.run_attempt }}
          path: public-text-fit-evidence/
          if-no-files-found: warn
          retention-days: 30

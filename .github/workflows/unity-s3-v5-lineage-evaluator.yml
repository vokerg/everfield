name: Everfield Unity S3 reviewed-v5 lineage evaluator

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Bounded reviewed-v5 lineage rerun reason"
        required: false
        default: "unity-s3-v5-lineage"

permissions:
  contents: read

concurrency:
  group: everfield-unity-s3-v5-lineage-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  lineage:
    if: >-
      github.repository == 'vokerg/everfield' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, macOS, ARM64, everfield-unity]
    timeout-minutes: 30
    env:
      EXPECTED_REPOSITORY: vokerg/everfield
      EXPECTED_REF: refs/heads/main
      EXPECTED_RUNNER_NAME: everfield-unity-mac
      EXPECTED_RUNNER_OS: macOS
      EXPECTED_RUNNER_ARCH: ARM64
      UNITY_EDITOR_VERSION: 6000.5.6f1
    steps:
      - name: Checkout exact trusted event SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          clean: true
          persist-credentials: false

      - name: Fail closed unless repository, ref, SHA, current main, and runner identity match
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "$EXPECTED_REPOSITORY"
          test "$GITHUB_REF" = "$EXPECTED_REF"
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$RUNNER_NAME" = "$EXPECTED_RUNNER_NAME"
          test "$RUNNER_OS" = "$EXPECTED_RUNNER_OS"
          test "$RUNNER_ARCH" = "$EXPECTED_RUNNER_ARCH"
          current_main_sha="$(curl --fail --silent --show-error \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$EXPECTED_REPOSITORY/branches/main" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["commit"]["sha"])')"
          test "$current_main_sha" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Run deterministic non-secret lineage self-tests
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPYCACHEPREFIX="$RUNNER_TEMP/unity-s3-v5-lineage-pycache" \
            python3 -m py_compile \
              tools/planning/unity_s3_v5_lineage.py \
              tools/planning/record_unity_s3_v5_lineage.py
          PYTHONPYCACHEPREFIX="$RUNNER_TEMP/unity-s3-v5-lineage-pycache" \
            python3 tools/planning/unity_s3_v5_lineage.py --self-test
          PYTHONPYCACHEPREFIX="$RUNNER_TEMP/unity-s3-v5-lineage-pycache" \
            python3 -m tools.planning.record_unity_s3_v5_lineage --self-test
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Resolve exact pinned Unity editor without logging local paths
        shell: bash
        run: |
          set -euo pipefail
          unity_cli="$(command -v unity || true)"
          if [ -z "$unity_cli" ] || [ ! -x "$unity_cli" ]; then
            unity_cli="$HOME/.unity/bin/unity"
          fi
          test -x "$unity_cli"
          test "$($unity_cli --version)" = "1.0.0-beta.5"
          installed_json="$RUNNER_TEMP/everfield-unity-s3-v5-installed.json"
          "$unity_cli" editors --installed --format json --non-interactive > "$installed_json"
          editor_path="$(python3 - "$installed_json" "$UNITY_EDITOR_VERSION" <<'PY'
          import json
          import pathlib
          import sys
          from tools.planning.engine_provider_effective_validator import editor_path_from_install

          payload = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          path = editor_path_from_install(payload, sys.argv[2])
          if not path:
              raise SystemExit("pinned Unity editor was not observed")
          print(path)
          PY
          )"
          test -n "$editor_path"
          test -x "$editor_path"
          printf 'UNITY_EDITOR_PATH=%s\n' "$editor_path" >> "$GITHUB_ENV"
          rm -f "$installed_json"
          echo "pinned Unity CLI/editor identity verified"

      - name: Execute isolated native S3 N1 N2 FI1 lineage run
        shell: bash
        run: |
          set -euo pipefail
          command -v caffeinate >/dev/null
          output_dir="$RUNNER_TEMP/everfield-unity-s3-v5-lineage"
          output_path="$output_dir/lineage.json"
          mkdir -p "$output_dir"
          PYTHONPYCACHEPREFIX="$RUNNER_TEMP/unity-s3-v5-lineage-pycache" \
            caffeinate -i python3 tools/planning/unity_s3_v5_lineage.py \
              --editor-path "$UNITY_EDITOR_PATH" \
              --out "$output_path"
          PYTHONPYCACHEPREFIX="$RUNNER_TEMP/unity-s3-v5-lineage-pycache" \
            python3 tools/planning/unity_s3_v5_lineage.py --validate "$output_path"
          test -s "$output_path"

      - name: Assert bounded sanitized artifact shape
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/everfield-unity-s3-v5-lineage/lineage.json" <<'PY'
          import json
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])
          data = json.loads(path.read_text(encoding="utf-8"))
          assert data["schema"] == "W2-ENG-UNITY-S3-V5-LINEAGE-v1"
          assert data["mission_id"] == "W2-ENG-TECH-UNITY-S3-V5-RERUN-01"
          assert data["run"]["repository"] == "vokerg/everfield"
          assert data["run"]["ref"] == "refs/heads/main"
          assert data["run"]["head_sha"] == __import__("os").environ["GITHUB_SHA"]
          assert data["contract"]["resource_class"] == "W2-ENG-HOST-COMMON-v2"
          assert data["run_registry_refs"] == ["UNITY-S3-N1", "UNITY-S3-N2", "UNITY-S3-FI1"]
          assert len({data["attempts"][key]["workspace_id"] for key in data["run_registry_refs"]}) == 3
          assert len({data["attempts"][key]["reset_id"] for key in data["run_registry_refs"]}) == 3
          assert all(data["attempts"][key]["reset_verified"] is True for key in data["run_registry_refs"])
          assert data["authority"]["pass_for_comparison"] is False
          assert data["authority"]["integration_authority"] is False
          assert data["historical_not_run_cells_preserved"] == 50
          assert data["historical_not_run_cells_mutated"] is False
          serialized = path.read_text(encoding="utf-8").lower()
          for forbidden in (
              "unity_service_account_secret", "unreal_github_token", "password=",
              "token=", "authorization:", "cookie=", "bearer ",
          ):
              assert forbidden not in serialized, forbidden
          PY

      - name: Upload only sanitized Unity S3 v5 lineage evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: w2-unity-s3-v5-lineage-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/everfield-unity-s3-v5-lineage/lineage.json
          if-no-files-found: error
          retention-days: 30

  dispatch_recording:
    name: Dispatch separate exact lineage recorder
    needs: lineage
    if: >-
      needs.lineage.result == 'success' &&
      github.repository == 'vokerg/everfield' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Dispatch recorder as a separate workflow run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.run_id }}
          SOURCE_RUN_ATTEMPT: ${{ github.run_attempt }}
          SOURCE_HEAD_SHA: ${{ github.sha }}
          EXPECTED_REPOSITORY: vokerg/everfield
          EXPECTED_REF: refs/heads/main
          EXPECTED_EVENT: workflow_dispatch
          RECORDER_WORKFLOW: unity-s3-v5-lineage-recorder.yml
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          api = os.environ["GITHUB_API_URL"].rstrip("/")
          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          source_run_id = os.environ["SOURCE_RUN_ID"]
          source_run_attempt = os.environ["SOURCE_RUN_ATTEMPT"]
          source_head_sha = os.environ["SOURCE_HEAD_SHA"]
          expected_repo = os.environ["EXPECTED_REPOSITORY"]
          expected_ref = os.environ["EXPECTED_REF"]
          expected_event = os.environ["EXPECTED_EVENT"]
          recorder_workflow = os.environ["RECORDER_WORKFLOW"]

          if repo != expected_repo:
              raise SystemExit("dispatch repository identity mismatch")
          if os.environ["GITHUB_REF"] != expected_ref:
              raise SystemExit("dispatch ref identity mismatch")
          if os.environ["GITHUB_EVENT_NAME"] != expected_event:
              raise SystemExit("dispatch event identity mismatch")
          if not source_run_id.isdigit() or not source_run_attempt.isdigit():
              raise SystemExit("dispatch source run identity is not numeric")
          if len(source_head_sha) != 40 or any(c not in "0123456789abcdef" for c in source_head_sha.lower()):
              raise SystemExit("dispatch source head is not sha40")

          payload = json.dumps({
              "ref": "main",
              "inputs": {
                  "source_run_id": source_run_id,
                  "source_run_attempt": source_run_attempt,
                  "source_head_sha": source_head_sha,
              },
          }).encode("utf-8")
          request = urllib.request.Request(
              f"{api}/repos/{repo}/actions/workflows/{recorder_workflow}/dispatches",
              data=payload,
              method="POST",
              headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Content-Type": "application/json",
              },
          )
          with urllib.request.urlopen(request, timeout=20) as response:
              status = response.status
              body = response.read()
          if status not in (200, 204):
              raise SystemExit(f"recorder workflow dispatch failed with HTTP {status}")
          dispatched_run_id = None
          if body:
              decoded = json.loads(body)
              dispatched_run_id = decoded.get("workflow_run_id")
              if dispatched_run_id is not None and not str(dispatched_run_id).isdigit():
                  raise SystemExit("recorder dispatch returned invalid workflow_run_id")
          print(json.dumps({
              "recorder_dispatched": True,
              "recorder_workflow": recorder_workflow,
              "source_run_attempt": source_run_attempt,
              "source_run_id": source_run_id,
              "source_head_sha": source_head_sha,
              "dispatched_run_id": dispatched_run_id,
          }, sort_keys=True))
          PY

name: Verify immutable route-history component at #1627 head

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/verify-route-history-1627.yml'
      - 'docs/planning/handoffs/issue-1635.md'

permissions:
  contents: read

concurrency:
  group: verify-route-history-1627-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-frozen-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact frozen #1627 source, never verifier PR code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ba8325232de970400352782e77506e5b1dfba91b
          fetch-depth: 1

      - name: Verify source and reviewed engine lock
        id: lock
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p route-history-evidence
          test "$(git rev-parse HEAD)" = 'ba8325232de970400352782e77506e5b1dfba91b'
          test "$(git hash-object game/components/route_history_view/route_history_view.gd)" = '8539cd5afb990a5702100e5ae2abdab38b27debe'
          test "$(git hash-object game/tests/route_history_view/route_history_view_smoke.gd)" = 'bf968b39d7a161e2f44e5ff94f5536607b89db9d'
          test "$(git hash-object docs/planning/handoffs/issue-1627.md)" = '75b37ba2c7d38f9cf3371590ac476d80af116448'
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          lock = json.loads(Path("docs/planning/wave-2/evidence/ci/engine-toolchain-artifact-lock.json").read_text())
          entry = lock["entries"]["godot_4.7.1_linux_x86_64_zip"]
          assert entry["version"] == "4.7.1-stable"
          assert entry["sha256"] == "c7ff14fd28472c8d4f193043de30278dcf7e5241a1dcf7566b02e27addaa33ba"
          assert entry["url"] == "https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip"
          print("url=" + entry["url"])
          print("sha256=" + entry["sha256"])
          PY
          printf 'source_issue=1627\nsource_pr=1630\nsource_head=ba8325232de970400352782e77506e5b1dfba91b\nactual_checkout=%s\nverifier_pr_head=%s\nrun_id=%s\nrun_attempt=%s\n' \
            "$(git rev-parse HEAD)" '${{ github.event.pull_request.head.sha }}' \
            "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > route-history-evidence/identity.txt
          sha256sum game/components/route_history_view/route_history_view.gd game/tests/route_history_view/route_history_view_smoke.gd docs/planning/handoffs/issue-1627.md > route-history-evidence/source-files.sha256

      - name: Obtain hash-locked reviewed Godot 4.7.1
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output godot.zip '${{ steps.lock.outputs.url }}'
          printf '%s  %s\n' '${{ steps.lock.outputs.sha256 }}' godot.zip | sha256sum --check --strict
          unzip -q godot.zip -d .godot-bin
          chmod +x .godot-bin/Godot_v4.7.1-stable_linux.x86_64

      - name: Run isolated route-history and existing executable regressions
        shell: bash
        env:
          GODOT_BIN: ${{ github.workspace }}/.godot-bin/Godot_v4.7.1-stable_linux.x86_64
        run: |
          set -euo pipefail
          test "$("$GODOT_BIN" --version)" = '4.7.1.stable.official.a13da4feb'
          printf 'godot_version=%s\ngodot_zip_sha256=%s\n' "$("$GODOT_BIN" --version)" '${{ steps.lock.outputs.sha256 }}' >> route-history-evidence/identity.txt
          "$GODOT_BIN" --headless --path game --script res://tests/route_history_view/route_history_view_smoke.gd 2>&1 | tee route-history-evidence/route-history-smoke.log
          grep -E '^EVERFIELD_ROUTE_HISTORY_VIEW_PASS checks=[1-9][0-9]*$' route-history-evidence/route-history-smoke.log
          ! grep -E 'SCRIPT ERROR|Parse Error|Assertion failed' route-history-evidence/route-history-smoke.log
          ! grep -F '[EVERFIELD][ROUTE-HISTORY][FAIL]' route-history-evidence/route-history-smoke.log
          bash tools/implementation/run_godot_smoke.sh 2>&1 | tee route-history-evidence/first-playable.log
          bash tools/implementation/run_godot_movement_smoke.sh 2>&1 | tee route-history-evidence/movement-interaction.log
          ! grep -E 'SCRIPT ERROR|Parse Error|Assertion failed' route-history-evidence/first-playable.log
          ! grep -F '[EF-SMOKE][FAIL]' route-history-evidence/first-playable.log
          ! grep -E 'SCRIPT ERROR|Parse Error|Assertion failed' route-history-evidence/movement-interaction.log
          ! grep -F '[EF-MOVEMENT-SMOKE][FAIL]' route-history-evidence/movement-interaction.log
          printf 'isolated_and_existing_smokes=PASS\n' >> route-history-evidence/identity.txt

      - name: Upload immutable run evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: route-history-1627-${{ github.run_id }}-${{ github.run_attempt }}
          path: route-history-evidence/
          if-no-files-found: warn
          retention-days: 30

name: Old Works component runtime evidence

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/old-works-world-component-runtime-evidence.yml'
      - 'docs/planning/handoffs/issue-1421.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-component-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact frozen producer
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 20284fa9171d1d6f91e3e930d627f587062485cb
          fetch-depth: 1

      - name: Verify frozen identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "20284fa9171d1d6f91e3e930d627f587062485cb"
          test "$(git rev-parse HEAD:game/components/old_works_world/old_works_world_presentation.gd)" = "8e498156bb9a5413f53a84b14fc279c4be6c8f23"
          test "$(git rev-parse HEAD:game/components/old_works_world/old_works_world_presentation_smoke.gd)" = "a69e4c93960cf459544d42a160cc532d03401e5d"

      - name: Resolve reviewed Godot artifact lock
        id: godot
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          lock = json.loads(Path("docs/planning/wave-2/evidence/ci/engine-toolchain-artifact-lock.json").read_text())
          entry = lock["entries"]["godot_4.7.1_linux_x86_64_zip"]
          assert entry["version"] == "4.7.1-stable"
          print("url=" + entry["url"])
          print("sha256=" + entry["sha256"])
          print("version=" + entry["version"])
          PY

      - name: Acquire reviewed Godot artifact
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output godot.zip '${{ steps.godot.outputs.url }}'
          printf '%s  godot.zip\n' '${{ steps.godot.outputs.sha256 }}' | sha256sum --check --strict
          unzip -q godot.zip -d .godot-bin
          chmod +x .godot-bin/Godot_v4.7.1-stable_linux.x86_64

      - name: Run exact component smoke
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p component-runtime-evidence
          .godot-bin/Godot_v4.7.1-stable_linux.x86_64 --headless --path game --script res://components/old_works_world/old_works_world_presentation_smoke.gd 2>&1 | tee component-runtime-evidence/smoke.log
          grep -F 'EVERFIELD_OLD_WORKS_WORLD_PRESENTATION_SMOKE_PASS' component-runtime-evidence/smoke.log
          printf 'frozen_producer_sha=%s\nchecked_out_sha=%s\nrun_id=%s\nrun_attempt=%s\nreviewed_godot_version=%s\nreviewed_godot_sha256=%s\ncomponent_blob_sha=%s\nsmoke_blob_sha=%s\nsentinel=%s\n' \
            '20284fa9171d1d6f91e3e930d627f587062485cb' "$(git rev-parse HEAD)" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
            '${{ steps.godot.outputs.version }}' '${{ steps.godot.outputs.sha256 }}' \
            '8e498156bb9a5413f53a84b14fc279c4be6c8f23' 'a69e4c93960cf459544d42a160cc532d03401e5d' \
            'EVERFIELD_OLD_WORKS_WORLD_PRESENTATION_SMOKE_PASS' > component-runtime-evidence/run-identity.txt

      - name: Upload exact runtime evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: old-works-world-component-runtime-${{ github.run_id }}-${{ github.run_attempt }}
          path: component-runtime-evidence/
          if-no-files-found: error
          retention-days: 30

name: Everfield engine effective access health check

on:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: everfield-engine-effective-health
  cancel-in-progress: false

jobs:
  health:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    environment: engine-eval
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      UNITY_EDITOR_VERSION: ${{ vars.UNITY_EDITOR_VERSION }}
      UNREAL_ENGINE_VERSION: ${{ vars.UNREAL_ENGINE_VERSION }}
      UNREAL_GITHUB_USERNAME: ${{ vars.UNREAL_GITHUB_USERNAME }}
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 1

      - name: Install and pin the Unity CLI channel
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://public-cdn.cloud.unity3d.com/hub/prod/cli/install.sh | UNITY_CLI_VERSION=1.0.0-beta.5 bash
          export PATH="$HOME/.unity/bin:$PATH"
          test "$(unity --version)" = "1.0.0-beta.5"
          echo "UNITY_CLI=$HOME/.unity/bin/unity" >> "$GITHUB_ENV"

      - name: Run credentialed health validation
        shell: bash
        env:
          UNITY_SERVICE_ACCOUNT_ID: ${{ secrets.UNITY_SERVICE_ACCOUNT_ID }}
          UNITY_SERVICE_ACCOUNT_SECRET: ${{ secrets.UNITY_SERVICE_ACCOUNT_SECRET }}
          UNREAL_GITHUB_TOKEN: ${{ secrets.UNREAL_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/everfield-engine-health"
          python3 tools/planning/engine_provider_effective_validator.py \
            --health-only \
            --out "$RUNNER_TEMP/everfield-engine-health/provider-effective-health.json"

      - name: Upload non-secret health evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: w2-engine-effective-health-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/everfield-engine-health/provider-effective-health.json
          if-no-files-found: error
          retention-days: 30

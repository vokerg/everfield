name: Verify consequence component for Issue 1423

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/verify-commitment-consequence-1423.yml'
      - 'docs/planning/handoffs/issue-1423.md'

permissions:
  contents: read

concurrency:
  group: verify-commitment-consequence-1423-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  exact-component-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact frozen producer
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: d18d3c34cf3da6f5ab8893af8a0c0af5fce0b073
          fetch-depth: 1

      - name: Verify frozen producer identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "d18d3c34cf3da6f5ab8893af8a0c0af5fce0b073"
          test "$(git hash-object game/components/commitment_consequences/commitment_consequence_presentation.gd)" = "419688e17515bf5f67b383182c0b6330111ce4be"
          test "$(git hash-object game/components/commitment_consequences/commitment_consequence_smoke.gd)" = "9eed8bc5be54863b18e70475b16e5472c7679dd1"

      - name: Resolve reviewed Godot artifact lock
        id: godot
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          lock = json.loads(Path("docs/planning/wave-2/evidence/ci/engine-toolchain-artifact-lock.json").read_text())
          entry = lock["entries"]["godot_4.7.1_linux_x86_64_zip"]
          if entry["version"] != "4.7.1-stable":
              raise SystemExit(f"unexpected reviewed Godot version: {entry['version']}")
          print(f"url={entry['url']}")
          print(f"sha256={entry['sha256']}")
          print(f"version={entry['version']}")
          PY

      - name: Acquire exact reviewed Godot 4.7.1 artifact
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output godot.zip '${{ steps.godot.outputs.url }}'
          printf '%s  %s\n' '${{ steps.godot.outputs.sha256 }}' godot.zip | sha256sum --check --strict
          unzip -q godot.zip -d .godot-bin
          chmod +x .godot-bin/Godot_v4.7.1-stable_linux.x86_64

      - name: Run exact commitment consequence component smoke
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p issue-1423-evidence
          godot_bin="$GITHUB_WORKSPACE/.godot-bin/Godot_v4.7.1-stable_linux.x86_64"
          version="$("$godot_bin" --version)"
          printf 'godot_version=%s\n' "$version" | tee issue-1423-evidence/engine.txt
          [[ "$version" =~ ^4\.7\.1\.stable ]]
          "$godot_bin" --headless --path game --editor --quit
          "$godot_bin" --headless --path game --script res://components/commitment_consequences/commitment_consequence_smoke.gd             2>&1 | tee issue-1423-evidence/component-smoke.log
          grep -Fx 'EVERFIELD_COMMITMENT_CONSEQUENCE_SMOKE_PASS' issue-1423-evidence/component-smoke.log
          printf 'producer_head=%s\ncomponent_blob=%s\nsmoke_blob=%s\nrun_id=%s\nrun_attempt=%s\nreviewed_godot_version=%s\nreviewed_godot_sha256=%s\n'             "$(git rev-parse HEAD)"             "$(git hash-object game/components/commitment_consequences/commitment_consequence_presentation.gd)"             "$(git hash-object game/components/commitment_consequences/commitment_consequence_smoke.gd)"             "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"             '${{ steps.godot.outputs.version }}' '${{ steps.godot.outputs.sha256 }}'             > issue-1423-evidence/run-identity.txt

      - name: Upload exact runtime evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue-1423-consequence-component-${{ github.run_id }}-${{ github.run_attempt }}
          path: issue-1423-evidence/
          if-no-files-found: error
          retention-days: 30

name: W2 Unity Personal path public CLI diagnostic

on:
  push:
    branches:
      - planning/issue-557
    paths:
      - .github/workflows/w2-eng-provider-unity-personal-path-diag.yml
      - tools/planning/unity_personal_path_diag.py

permissions:
  contents: read

jobs:
  diagnose-public-cli-surface:
    if: github.repository == 'vokerg/everfield' && github.ref == 'refs/heads/planning/issue-557'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact task head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Verify non-secret task boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "vokerg/everfield"
          test "$GITHUB_REF" = "refs/heads/planning/issue-557"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -m py_compile tools/planning/unity_personal_path_diag.py
          python3 tools/planning/unity_personal_path_diag.py --self-test > /dev/null

      - name: Install and pin exact Unity CLI
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://public-cdn.cloud.unity3d.com/hub/prod/cli/install.sh | UNITY_CLI_VERSION=1.0.0-beta.5 bash
          export PATH="$HOME/.unity/bin:$PATH"
          discovered="$(command -v unity)"
          test -n "$discovered"
          test -x "$discovered"
          resolved="$(readlink -f "$discovered")"
          test -n "$resolved"
          test -x "$resolved"
          observed="$("$resolved" --version)"
          test "$observed" = "1.0.0-beta.5"
          echo "UNITY_CLI=$resolved" >> "$GITHUB_ENV"
          echo "UNITY_CLI_OBSERVED_VERSION=$observed" >> "$GITHUB_ENV"

      - name: Capture public help only
        shell: bash
        run: |
          set -u
          d="$RUNNER_TEMP/unity-personal-path-help"
          mkdir -p "$d"
          capture() {
            name="$1"; shift
            set +e
            "$UNITY_CLI" "$@" --help > "$d/$name.txt" 2>&1
            code=$?
            set -e
            echo "${name^^}_EXIT=$code" | tr '-' '_' >> "$GITHUB_ENV"
            sha256sum "$d/$name.txt"
          }
          capture auth auth
          capture auth_login auth login
          capture auth_status auth status
          capture license license
          capture activate license activate
          capture status license status
          echo "Raw public help remains runner-temporary and will not be uploaded."

      - name: Project bounded Personal-path evidence
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/unity-personal-path-help"
          out="$RUNNER_TEMP/unity-personal-path-diag"
          mkdir -p "$out"
          python3 tools/planning/unity_personal_path_diag.py \
            --observed-version "$UNITY_CLI_OBSERVED_VERSION" \
            --auth-help "$d/auth.txt" --auth-exit "$AUTH_EXIT" \
            --auth-login-help "$d/auth_login.txt" --auth-login-exit "$AUTH_LOGIN_EXIT" \
            --auth-status-help "$d/auth_status.txt" --auth-status-exit "$AUTH_STATUS_EXIT" \
            --license-help "$d/license.txt" --license-exit "$LICENSE_EXIT" \
            --activate-help "$d/activate.txt" --activate-exit "$ACTIVATE_EXIT" \
            --status-help "$d/status.txt" --status-exit "$STATUS_EXIT" \
            --out "$out/diagnostic.json"
          python3 tools/planning/unity_personal_path_diag.py --self-test --out "$out/selftest.json"
          python3 - <<'PY'
          import json, os
          p=os.path.join(os.environ['RUNNER_TEMP'],'unity-personal-path-diag','diagnostic.json')
          d=json.load(open(p))
          assert d['schema']=='W2-ENG-PROVIDER-UNITY-PERSONAL-PATH-DIAG-v1'
          assert d['unity_cli_observed_version']=='1.0.0-beta.5'
          assert d['credential_or_session_value_consumed'] is False
          assert d['activation_command_executed'] is False
          assert d['provider_authentication_validated'] is False
          assert d['unity_license_validated'] is False
          assert d['integration_authority'] is False
          assert d['canonicality']=='NOT_CANONICAL'
          assert d['disposition'] in {
            'PERSONAL_PATH_SUPPORTED_CONTRACT_REMEDIATION_REQUIRED',
            'PERSONAL_PATH_REQUIRES_EXACT_EXTERNAL_USER_SESSION_PREDICATE',
            'PINNED_CLI_PERSONAL_PATH_SURFACE_INCONSISTENT',
          }
          for cmd in d['commands'].values():
            assert cmd['raw_text_persisted'] is False
            assert len(cmd['raw_sha256']) == 64
          print('bounded Personal-path projection: PASS')
          PY
          {
            echo "source_sha=${GITHUB_SHA}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "issue=557"
            echo "mission_id=W2-ENG-PROVIDER-UNITY-PERSONAL-PATH-DIAG-01"
            echo "unity_cli_version=${UNITY_CLI_OBSERVED_VERSION}"
            sha256sum tools/planning/unity_personal_path_diag.py
            sha256sum "$out/diagnostic.json"
            sha256sum "$out/selftest.json"
          } > "$out/run-identity.txt"

      - name: Upload immutable non-secret diagnostic artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: w2-unity-personal-path-diag-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/unity-personal-path-diag/
          if-no-files-found: error
          retention-days: 30

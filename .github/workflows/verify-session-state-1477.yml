name: Verify exact session-state smoke for Issue 1477

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/verify-session-state-1477.yml'
      - 'docs/planning/handoffs/issue-1477.md'

permissions:
  contents: read

concurrency:
  group: verify-session-state-1477-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  exact-session-state-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact frozen producer head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: dd2a4107b1a4dcba0bd097ef9e6e3cca18f2dc51
          fetch-depth: 1

      - name: Verify frozen producer and toolchain identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "dd2a4107b1a4dcba0bd097ef9e6e3cca18f2dc51"
          test "$(git hash-object game/components/session_state/session_state.gd)" = "97a0d4f35f9ffe3ed813a67d24daeb3aff08f398"
          test "$(git hash-object game/components/session_state/session_state_smoke.gd)" = "27bfe698c63592c7805c97a473383675715c4626"
          test "$(git hash-object docs/planning/handoffs/issue-1461.md)" = "a94fa1915f27d3c6f9da9bf9c56b0d7c735e6a9d"
          test "$(git hash-object docs/planning/wave-2/evidence/ci/engine-toolchain-artifact-lock.json)" = "4a88990ae24768eb4f83a8a1311e2a830834649f"
          test "$(git hash-object game/project.godot)" = "9da4153ed378945ef5e9634e0e5cae48289845d8"

      - name: Resolve reviewed Godot artifact lock
        id: godot
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          lock = json.loads(Path("docs/planning/wave-2/evidence/ci/engine-toolchain-artifact-lock.json").read_text())
          entry = lock["entries"]["godot_4.7.1_linux_x86_64_zip"]
          expected_sha = "c7ff14fd28472c8d4f193043de30278dcf7e5241a1dcf7566b02e27addaa33ba"
          if entry["version"] != "4.7.1-stable":
              raise SystemExit(f"unexpected reviewed Godot version: {entry['version']}")
          if entry["sha256"] != expected_sha:
              raise SystemExit(f"unexpected reviewed Godot sha256: {entry['sha256']}")
          print(f"url={entry['url']}")
          print(f"sha256={entry['sha256']}")
          print(f"version={entry['version']}")
          PY

      - name: Acquire exact reviewed Godot 4.7.1 artifact
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output godot.zip '${{ steps.godot.outputs.url }}'
          printf '%s  %s\n' '${{ steps.godot.outputs.sha256 }}' godot.zip | sha256sum --check --strict
          unzip -q godot.zip -d .godot-bin
          chmod +x .godot-bin/Godot_v4.7.1-stable_linux.x86_64

      - name: Run exact frozen session-state smoke
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p issue-1477-evidence
          godot_bin="$GITHUB_WORKSPACE/.godot-bin/Godot_v4.7.1-stable_linux.x86_64"
          version="$("$godot_bin" --version)"
          printf 'godot_version=%s\n' "$version" | tee issue-1477-evidence/engine.txt
          [[ "$version" =~ ^4\.7\.1\.stable ]]
          "$godot_bin" --headless --path game --script res://components/session_state/session_state_smoke.gd 2>&1 | tee issue-1477-evidence/session-state-smoke.log
          grep -Fx 'EVERFIELD_SESSION_STATE_SMOKE_PASS' issue-1477-evidence/session-state-smoke.log
          printf 'producer_head=%s\nworkflow_pr_head=%s\ncomponent_blob=%s\nsmoke_blob=%s\nproducer_handoff_blob=%s\nlock_blob=%s\nproject_blob=%s\nrun_id=%s\nrun_attempt=%s\nreviewed_godot_version=%s\nreviewed_godot_sha256=%s\nsentinel=%s\n' \
            "$(git rev-parse HEAD)" \
            '${{ github.event.pull_request.head.sha }}' \
            "$(git hash-object game/components/session_state/session_state.gd)" \
            "$(git hash-object game/components/session_state/session_state_smoke.gd)" \
            "$(git hash-object docs/planning/handoffs/issue-1461.md)" \
            "$(git hash-object docs/planning/wave-2/evidence/ci/engine-toolchain-artifact-lock.json)" \
            "$(git hash-object game/project.godot)" \
            "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
            '${{ steps.godot.outputs.version }}' '${{ steps.godot.outputs.sha256 }}' \
            'EVERFIELD_SESSION_STATE_SMOKE_PASS' \
            > issue-1477-evidence/run-identity.txt

      - name: Upload exact runtime evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue-1477-session-state-${{ github.run_id }}-${{ github.run_attempt }}
          path: issue-1477-evidence/
          if-no-files-found: error
          retention-days: 30

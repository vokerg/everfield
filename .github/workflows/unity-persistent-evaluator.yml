name: Everfield persistent Unity exact-main evaluator

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Bounded remote trigger reason"
        required: false
        default: "remote-go"

permissions:
  contents: read

concurrency:
  group: everfield-unity-persistent-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  persistent-unity:
    if: >-
      github.repository == 'vokerg/everfield' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, macOS, ARM64, everfield-unity]
    timeout-minutes: 30
    env:
      EXPECTED_REPOSITORY: vokerg/everfield
      EXPECTED_REF: refs/heads/main
      EXPECTED_RUNNER_NAME: everfield-unity-mac
      EXPECTED_RUNNER_OS: macOS
      EXPECTED_RUNNER_ARCH: ARM64
      UNITY_EDITOR_VERSION: 6000.5.6f1
    steps:
      - name: Checkout exact trusted event SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          clean: true

      - name: Fail closed unless repository, ref, SHA, current main, and runner identity match
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "$EXPECTED_REPOSITORY"
          test "$GITHUB_REF" = "$EXPECTED_REF"
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$RUNNER_NAME" = "$EXPECTED_RUNNER_NAME"
          test "$RUNNER_OS" = "$EXPECTED_RUNNER_OS"
          test "$RUNNER_ARCH" = "$EXPECTED_RUNNER_ARCH"
          current_main_sha="$(curl --fail --silent --show-error \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$EXPECTED_REPOSITORY/branches/main" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["commit"]["sha"])')"
          test "$current_main_sha" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          echo "trusted persistent Unity identity: repo=$GITHUB_REPOSITORY ref=$GITHUB_REF sha=$GITHUB_SHA runner=$RUNNER_NAME"

      - name: Verify pinned Unity CLI and editor identity
        shell: bash
        run: |
          set -euo pipefail
          unity_cli="$(command -v unity || true)"
          if [ -z "$unity_cli" ] || [ ! -x "$unity_cli" ]; then
            unity_cli="$HOME/.unity/bin/unity"
          fi
          test -x "$unity_cli"
          test "$($unity_cli --version)" = "1.0.0-beta.5"
          installed_json="$RUNNER_TEMP/everfield-unity-installed.json"
          "$unity_cli" editors --installed --format json --non-interactive > "$installed_json"
          python3 - "$installed_json" "$UNITY_EDITOR_VERSION" <<'PY'
          import json
          import pathlib
          import sys

          payload = json.loads(pathlib.Path(sys.argv[1]).read_text())
          version = sys.argv[2]

          def contains_version(value):
              if isinstance(value, dict):
                  return any(contains_version(child) for child in value.values())
              if isinstance(value, list):
                  return any(contains_version(child) for child in value)
              return version in str(value)

          assert contains_version(payload), "pinned Unity editor was not observed"
          PY
          echo "UNITY_CLI=$unity_cli" >> "$GITHUB_ENV"
          echo "pinned Unity CLI/editor identity: 1.0.0-beta.5 / $UNITY_EDITOR_VERSION"

      - name: Run native Unity S3 validation in the persistent workstation context
        shell: bash
        run: |
          set -euo pipefail
          output_path="$RUNNER_TEMP/everfield-unity-persistent/provider-effective-access.json"
          mkdir -p "$(dirname "$output_path")"
          set +e
          python3 tools/planning/engine_provider_effective_validator.py \
            --persistent-unity-proof \
            --out "$output_path" > "$RUNNER_TEMP/everfield-unity-persistent/validator.stdout"
          validator_exit=$?
          set -e
          test -s "$output_path"
          echo "persistent Unity validator exit: $validator_exit"

      - name: Assert sanitized persistent evidence and bounded result
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/everfield-unity-persistent/provider-effective-access.json" <<'PY'
          import json
          import pathlib
          import sys

          data = json.loads(pathlib.Path(sys.argv[1]).read_text())
          assert data["schema"] == "W2-ENG-UNITY-PERSISTENT-ACCESS-v1"
          assert data["mission_id"] == "W2-ENG-UNITY-PERSISTENT-RUNNER-01"
          assert data["execution_context"] == "PERSISTENT_SELF_HOSTED_WORKSTATION"
          assert data["runner"]["trusted"] is True
          assert data["runner"]["runner_name"] == "everfield-unity-mac"
          assert data["runner"]["runner_os"] == "macOS"
          assert data["runner"]["runner_arch"] == "ARM64"
          assert data["runner"]["ref"] == "refs/heads/main"
          assert data["runner"]["sha"] == __import__("os").environ["GITHUB_SHA"]
          assert data["unity"]["state"] in {
              "VALIDATED_DEVELOPMENT_ACCESS",
              "TRANSIENT_VALIDATION_FAILURE",
              "BLOCKED_BY_SPECIFIC_EXTERNAL_CONDITION",
          }
          assert data["secret_values_in_evidence"] is False
          assert data["secret_hashes_in_evidence"] is False
          serialized = pathlib.Path(sys.argv[1]).read_text().lower()
          for forbidden in (
              "unity_service_account_secret",
              "unreal_github_token",
              "password=",
              "token=",
              "authorization:",
              "cookie=",
              "bearer ",
          ):
              assert forbidden not in serialized, forbidden
          print({
              "execution_context": data["execution_context"],
              "runner": data["runner"]["runner_name"],
              "unity_state": data["unity"]["state"],
              "native_s3_pass": bool(data["unity"].get("native_s3", {}).get("pass")),
              "sanitized": True,
          })
          PY

      - name: Upload sanitized persistent Unity evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: w2-unity-persistent-access-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/everfield-unity-persistent/provider-effective-access.json
          if-no-files-found: error
          retention-days: 30

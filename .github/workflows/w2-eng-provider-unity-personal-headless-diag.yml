name: W2 Unity Personal headless user-login diagnostic

on:
  push:
    branches:
      - planning/issue-561
    paths:
      - .github/workflows/w2-eng-provider-unity-personal-headless-diag.yml
      - tools/planning/unity_personal_headless_diag.py

permissions:
  contents: read

jobs:
  headless-user-login-probe:
    if: github.repository == 'vokerg/everfield' && github.ref == 'refs/heads/planning/issue-561'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact task head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Verify non-secret quarantine boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/planning/issue-561"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -m py_compile tools/planning/unity_personal_headless_diag.py
          python3 tools/planning/unity_personal_headless_diag.py --self-test > /dev/null

      - name: Install and pin exact Unity CLI
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://public-cdn.cloud.unity3d.com/hub/prod/cli/install.sh | UNITY_CLI_VERSION=1.0.0-beta.5 bash
          export PATH="$HOME/.unity/bin:$PATH"
          discovered="$(command -v unity)"
          test -n "$discovered"
          resolved="$(readlink -f "$discovered")"
          test -x "$resolved"
          observed="$("$resolved" --version)"
          test "$observed" = "1.0.0-beta.5"
          echo "UNITY_CLI=$resolved" >> "$GITHUB_ENV"
          echo "UNITY_CLI_OBSERVED_VERSION=$observed" >> "$GITHUB_ENV"

      - name: Run quarantined no-credential user login attempt
        shell: bash
        run: |
          set -u
          q="$RUNNER_TEMP/unity-personal-headless-quarantine"
          mkdir -p "$q"
          chmod 700 "$q"
          set +e
          timeout 20s "$UNITY_CLI" auth login --no-store --non-interactive --format json > "$q/login.raw" 2>&1
          login_exit=$?
          "$UNITY_CLI" auth status --format json > "$q/status.raw" 2>&1
          status_exit=$?
          set -e
          chmod 600 "$q/login.raw" "$q/status.raw"
          echo "LOGIN_EXIT=$login_exit" >> "$GITHUB_ENV"
          echo "STATUS_EXIT=$status_exit" >> "$GITHUB_ENV"
          if [ "$login_exit" -eq 124 ]; then
            echo "LOGIN_TIMED_OUT=true" >> "$GITHUB_ENV"
          else
            echo "LOGIN_TIMED_OUT=false" >> "$GITHUB_ENV"
          fi
          # Intentionally do not cat, hash, upload, or otherwise expose quarantined raw output.
          echo "Quarantined login/status output captured; raw authentication material will not leave runner temp."

      - name: Project bounded behavior only
        shell: bash
        run: |
          set -euo pipefail
          q="$RUNNER_TEMP/unity-personal-headless-quarantine"
          out="$RUNNER_TEMP/unity-personal-headless-diag"
          mkdir -p "$out"
          timed_flag=""
          if [ "$LOGIN_TIMED_OUT" = "true" ]; then timed_flag="--login-timed-out"; fi
          python3 tools/planning/unity_personal_headless_diag.py \
            --observed-version "$UNITY_CLI_OBSERVED_VERSION" \
            --login-output "$q/login.raw" \
            --status-output "$q/status.raw" \
            --login-exit "$LOGIN_EXIT" \
            $timed_flag \
            --timeout-seconds 20 \
            --out "$out/diagnostic.json"
          python3 tools/planning/unity_personal_headless_diag.py --self-test --out "$out/selftest.json"
          python3 - <<'PY'
          import json, os
          p=os.path.join(os.environ['RUNNER_TEMP'],'unity-personal-headless-diag','diagnostic.json')
          d=json.load(open(p))
          assert d['schema']=='W2-ENG-PROVIDER-UNITY-PERSONAL-HEADLESS-DIAG-v1'
          assert d['unity_cli_observed_version']=='1.0.0-beta.5'
          assert d['credential_or_session_value_consumed'] is False
          assert d['provider_authentication_validated'] is False
          assert d['unity_license_validated'] is False
          assert d['oauth_url_or_code_persisted'] is False
          assert d['login']['raw_output_persisted'] is False
          assert d['login']['raw_output_hashed'] is False
          assert d['status_raw_output_persisted'] is False
          assert d['status_raw_output_hashed'] is False
          assert d['post_login_status_signed_in'] is False, 'unexpected signed-in user after no-credential probe'
          assert d['login']['disposition'] in {
            'HEADLESS_USER_LOGIN_REQUIRES_INTERACTIVE_BROWSER_OR_PERSISTENT_SESSION',
            'SUPPORTED_DEVICE_OR_NONINTERACTIVE_USER_FLOW_DISCOVERED_REQUIRES_REVIEW',
            'HEADLESS_USER_LOGIN_DIAGNOSTIC_INCONCLUSIVE',
          }
          print('bounded headless behavior projection: PASS')
          PY
          {
            echo "source_sha=${GITHUB_SHA}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "issue=561"
            echo "mission_id=W2-ENG-PROVIDER-UNITY-PERSONAL-HEADLESS-DIAG-01"
            echo "unity_cli_version=${UNITY_CLI_OBSERVED_VERSION}"
            sha256sum tools/planning/unity_personal_headless_diag.py
            sha256sum "$out/diagnostic.json"
            sha256sum "$out/selftest.json"
          } > "$out/run-identity.txt"
          rm -f "$q/login.raw" "$q/status.raw"
          rmdir "$q"

      - name: Upload bounded evidence only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: w2-unity-personal-headless-diag-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/unity-personal-headless-diag/
          if-no-files-found: error
          retention-days: 30

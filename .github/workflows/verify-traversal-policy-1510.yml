name: Verify frozen traversal-policy and movement smoke for Issue 1510

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/verify-traversal-policy-1510.yml'
      - 'docs/planning/handoffs/issue-1510.md'

permissions:
  contents: read

concurrency:
  group: verify-traversal-policy-1510-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  exact-traversal-policy-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact frozen producer head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 755b50d9ef0b125fef1f4358b5a4004a9d427696
          fetch-depth: 1

      - name: Verify frozen producer and toolchain identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "755b50d9ef0b125fef1f4358b5a4004a9d427696"
          test "$(git hash-object game/components/traversal_policy/traversal_policy.gd)" = "8376bd1289890d084fc94992ba56c4cd64588a44"
          test "$(git hash-object game/components/traversal_policy/traversal_policy_smoke.gd)" = "3daed72928dbaecee0339e691e89403a7eaa98b2"
          test "$(git hash-object docs/planning/handoffs/issue-1505.md)" = "84608ffd05a15cc83126c1319d770e0c3e592123"
          test "$(git hash-object docs/planning/wave-2/evidence/ci/engine-toolchain-artifact-lock.json)" = "4a88990ae24768eb4f83a8a1311e2a830834649f"
          test "$(git hash-object game/project.godot)" = "9da4153ed378945ef5e9634e0e5cae48289845d8"
          test "$(git hash-object game/main.gd)" = "9b406cc0a0115f0818df633eda67d69ab7779a06"
          test "$(git hash-object game/tests/movement_interaction_smoke.gd)" = "4c5bd980eecd47fcc620d72f4819e3dab687d059"

      - name: Resolve reviewed Godot artifact lock
        id: godot
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          lock = json.loads(Path("docs/planning/wave-2/evidence/ci/engine-toolchain-artifact-lock.json").read_text())
          entry = lock["entries"]["godot_4.7.1_linux_x86_64_zip"]
          expected_sha = "c7ff14fd28472c8d4f193043de30278dcf7e5241a1dcf7566b02e27addaa33ba"
          if entry["version"] != "4.7.1-stable":
              raise SystemExit(f"unexpected reviewed Godot version: {entry['version']}")
          if entry["sha256"] != expected_sha:
              raise SystemExit(f"unexpected reviewed Godot sha256: {entry['sha256']}")
          print(f"url={entry['url']}")
          print(f"sha256={entry['sha256']}")
          print(f"version={entry['version']}")
          PY

      - name: Acquire exact reviewed Godot 4.7.1 artifact
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output godot.zip '${{ steps.godot.outputs.url }}'
          printf '%s  %s\n' '${{ steps.godot.outputs.sha256 }}' godot.zip | sha256sum --check --strict
          unzip -q godot.zip -d .godot-bin
          chmod +x .godot-bin/Godot_v4.7.1-stable_linux.x86_64

      - name: Run exact frozen traversal-policy smoke
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p issue-1510-evidence
          godot_bin="$GITHUB_WORKSPACE/.godot-bin/Godot_v4.7.1-stable_linux.x86_64"
          version="$("$godot_bin" --version)"
          printf 'godot_version=%s\n' "$version" | tee issue-1510-evidence/engine.txt
          [[ "$version" =~ ^4\.7\.1\.stable ]]
          "$godot_bin" --headless --path game --script res://components/traversal_policy/traversal_policy_smoke.gd 2>&1 | tee issue-1510-evidence/traversal-policy-smoke.log
          grep -Fx 'EVERFIELD_TRAVERSAL_POLICY_SMOKE_PASS' issue-1510-evidence/traversal-policy-smoke.log
          ! grep -F '[EF-TRAVERSAL-POLICY][FAIL]' issue-1510-evidence/traversal-policy-smoke.log
          ! grep -F 'EVERFIELD_TRAVERSAL_POLICY_SMOKE_FAIL' issue-1510-evidence/traversal-policy-smoke.log
          "$godot_bin" --headless --path game --script res://tests/movement_interaction_smoke.gd 2>&1 | tee issue-1510-evidence/movement-interaction-smoke.log
          grep -Fx 'EVERFIELD_MOVEMENT_INTERACTION_SMOKE_PASS' issue-1510-evidence/movement-interaction-smoke.log
          printf 'producer_head=%s\nworkflow_pr_head=%s\ncomponent_blob=%s\nsmoke_blob=%s\nproducer_handoff_blob=%s\nlock_blob=%s\nproject_blob=%s\nrun_id=%s\nrun_attempt=%s\nreviewed_godot_version=%s\nreviewed_godot_sha256=%s\nsentinel=%s\n' \
            "$(git rev-parse HEAD)" \
            '${{ github.event.pull_request.head.sha }}' \
            "$(git hash-object game/components/traversal_policy/traversal_policy.gd)" \
            "$(git hash-object game/components/traversal_policy/traversal_policy_smoke.gd)" \
            "$(git hash-object docs/planning/handoffs/issue-1505.md)" \
            "$(git hash-object docs/planning/wave-2/evidence/ci/engine-toolchain-artifact-lock.json)" \
            "$(git hash-object game/project.godot)" \
            "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
            '${{ steps.godot.outputs.version }}' '${{ steps.godot.outputs.sha256 }}' \
            'EVERFIELD_TRAVERSAL_POLICY_SMOKE_PASS' \
            > issue-1510-evidence/run-identity.txt

      - name: Upload exact runtime evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue-1510-traversal-policy-${{ github.run_id }}-${{ github.run_attempt }}
          path: issue-1510-evidence/
          if-no-files-found: error
          retention-days: 30

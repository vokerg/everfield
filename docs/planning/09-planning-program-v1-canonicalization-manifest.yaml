version: 2
state: REVIEWED_CANDIDATE_SUPPORT
bootstrap_remediation_issue: 11
candidate_path: docs/planning/09-planning-program-v1-remediated-candidate.md
dispositions_path: docs/planning/reviews/issue-5-finding-dispositions.md

supersedes_for_verification:
  - path: docs/planning/08-planning-program-v1-reviewed-candidate.md
    work_sha: 1d7b9a980e74d6999789c86694f3c7fb99e13b99
    blob_sha: 1170d97490c2a4ccbf1b9f51191ce97123536439
    state: SUPERSEDED_FOR_VERIFICATION
  - path: docs/planning/08-planning-program-v1-canonicalization-manifest.yaml
    blob_sha: d7ba9d5e9f6afe6b83837f2da13831873a5b8ddd
    state: PARTIALLY_ADOPTED_PROVENANCE

verification_contract:
  verifier_issue: 5
  required_fresh_independent_context: true
  required_result: PASS
  bind:
    - remediation_candidate_work_sha
    - remediation_manifest_blob_or_work_sha
    - adopted_wave_1_contract_blob_sha
    - verified_base_main_sha
    - simulated_wave_1_issue_graph
  pass_forbidden_with_unresolved_severity: [BLOCKER, MAJOR]

bootstrap_canonicalization:
  issue: 6
  pre_merge_requirements:
    current_main_must_equal_verified_base_main_sha: true
    base_drift_action: independent_compatibility_or_reverification
    unresolved_blocker_major_forbidden: true
    merge_method: squash
  program_promotion:
    source: docs/planning/09-planning-program-v1-remediated-candidate.md
    destination: docs/planning/PLANNING-PROGRAM-v1.md
    transform:
      type: exact_literal_replacements_then_byte_identical_remainder
      replacements:
        - from: "**State:** REVIEWED-CANDIDATE-REMEDIATED"
          to: "**State:** CANONICAL"
        - from: "**Bootstrap remediation issue:** #11"
          to: "**Canonicalized by:** Bootstrap Issue #6"
        - from: "**Authority:** Candidate operating model only. It is NON-CANONICAL until a fresh independent Bootstrap Issue #5 verifier records PASS for this exact remediation work state and Bootstrap Issue #6 performs the verified mechanical promotion."
          to: "**Authority:** CANONICAL planning operating model for the current planning phase, activated only after the verified Bootstrap Issue #6 squash integration recorded on GitHub."
        - from: "When this document's header state is `CANONICAL` and `docs/planning/START-HERE.md` points here, a fresh planning agent MUST:"
          to: "When this document's header state is `CANONICAL`, `docs/planning/START-HERE.md` points here, and Bootstrap Issue #6 has a valid terminal schema-2 `INTEGRATION_STATUS` for this exact canonical main SHA, a fresh planning agent MUST:"
        - from: "**After this file is CANONICAL, Bootstrap Issues #2–#6 and #11 are historical provenance only and MUST NOT be selected as normal planning work.**"
          to: "**After this file is CANONICAL and Issue #6 has posted a valid terminal schema-2 INTEGRATION_STATUS for this exact canonical main SHA, Bootstrap Issues #2–#6 and #11 are historical provenance only and MUST NOT be selected as normal planning work. Before that terminal status, Issue #6 is the sole bootstrap completion surface.**"
      all_other_bytes_identical: true
      post_transform_assertions:
        - canonical_header_state_equals_CANONICAL
        - section_9_requires_issue_6_terminal_status_before_normal_wave_selection
        - section_29_routes_pre_terminal_window_only_to_issue_6_completion
        - section_30_routes_fully_activated_agents_to_open_PLAN_v1_issues
        - no_text_asserts_issue_5_or_6_is_normal_queue_after_terminal_activation
  agents_entry_patch:
    source_path: AGENTS.md
    base_must_match_verified_main: true
    replace_section:
      heading: "## Mandatory Cold-Start Entry Point"
      until_next_heading: "## Planning Work Output Rule"
      replacement: |
        ## Mandatory Cold-Start Entry Point

        A fresh agent with no prior conversation context MUST:

        1. Read this file.
        2. Read `docs/planning/START-HERE.md`.
        3. Follow the canonical Planning Program v1 referenced there.
        4. Before normal `[PLAN-v1]` selection, confirm Bootstrap Issue #6 has a valid terminal schema-2 `INTEGRATION_STATUS` for the exact current canonical main SHA.
        5. If that terminal status is absent, inspect Issue #6 and complete only its verified post-merge activation steps; do not treat an empty `[PLAN-v1]` queue as a liveness defect.
        6. After the terminal status exists, select/resume work only from repository + GitHub state using the canonical dispatcher rules.
        7. Preserve the canonical squash-only `main` integration rule.

        After terminal Issue #6 activation, Bootstrap Issues #2-#6 and #11 are provenance and are not the normal work queue.
  start_here_replacement:
    path: docs/planning/START-HERE.md
    content: |
      # START HERE — Canonical Planning Entry

      **Phase:** PLANNING  
      **Authority:** Entry pointer to canonical Planning Program v1.

      A fresh agent with no prior conversation context MUST:

      1. Read `/AGENTS.md`.
      2. Read `docs/planning/PLANNING-PROGRAM-v1.md` from current `main`.
      3. Confirm Bootstrap Issue #6 has a valid terminal schema-2 `INTEGRATION_STATUS` for this exact canonical main SHA.
      4. If that terminal status is absent, inspect Issue #6 and complete only the verified post-merge activation sequence; do not invoke normal liveness recovery for the not-yet-created Wave 1 queue.
      5. If the terminal status exists, query open GitHub issues beginning with `[PLAN-v1]`.
      6. Derive eligibility, ownership, recovery, priority, context, output, review, and handoff state exactly as defined by the canonical program and schema-2 operational registry.
      7. Prefer resumable/recovery and review/revision/verification/integration work before new proposal work.
      8. Never use prior chat history as project authority.
      9. Never integrate into `main` except by squash merge.

      After terminal Issue #6 activation, bootstrap planning artifacts are provenance and may be read only when the canonical program or selected issue explicitly requires them.
  post_merge_sequence:
    - obtain_squash_main_sha
    - verify_canonical_program_and_entry_docs_at_that_sha
    - load_adopted_wave_1_contract_sections_from_exact_blob
    - instantiate_exactly_23_wave_1_issues_with_concrete_activation_sha
    - validate_all_created_issue_contracts
    - post_mission_id_to_issue_number_mapping
    - post_schema_2_INTEGRATION_STATUS_for_issue_6
  wave_1_creation_before_merge: forbidden

wave_1_contract_adoption:
  source_path: docs/planning/08-planning-program-v1-canonicalization-manifest.yaml
  source_blob_sha: d7ba9d5e9f6afe6b83837f2da13831873a5b8ddd
  adopted_sections: [issue_compiler, universal_root_acceptance, wave_1, non_root_optional_retrieval, next_wave_candidate_schema]
  explicitly_not_adopted: [verification_contract, bootstrap_canonicalization]
  interpretation:
    activation_main_sha_placeholder_must_be_resolved_to_issue_6_squash_main_sha_before_issue_creation: true
    common_stopping_rule_final_STATUS_means_schema_2_registered_status_kind: true
    all_operational_comments_must_follow_schema_2_registry_below: true

operational_capsules:
  protocol: planning-v1
  schema: 2
  authority_metadata:
    ordering: github_comment_id_ascending
    creation_time: github_server_created_at
    edit_detection: github_server_created_at_must_equal_updated_at
    body_timestamps_authoritative: false
    unknown_top_level_fields: invalid
    extensions_field: {allowed: true, authority_effect: none}
  common_required_fields: [protocol, schema, kind, issue, mission_id, branch, actor_session_id]
  common_invariants:
    protocol: planning-v1
    schema: 2
    branch_pattern: planning/issue-N
    issue_must_match_selected_issue: true
    mission_id_must_match_issue_contract: true
    branch_must_match_issue_contract: true
    referenced_shas_must_exist: true
    edited_comments_invalid: true
    unsupported_kind_invalid: true
    invalid_comments_have_no_authority_effect: true

  kinds:
    CLAIM:
      required_fields: [state, base_sha, observed_head_sha, previous_ownership_comment_id]
      constants: {state: IN_PROGRESS, previous_ownership_comment_id: null}
      predecessor: {derived_state: READY, branch_existed_before_claim_attempt: false}
      winner_rule: earliest_valid_claim_for_created_branch_and_observed_head
      authority_effect: new_ownership_generation

    ORPHAN_PROBE:
      required_fields: [observed_head_sha, observed_main_sha, observed_no_ownership_through_comment_id]
      predecessor: {branch_exists: true, valid_ownership_grant_exists: false}
      winner_rule: none_non_owning
      authority_effect: none
      maturity: {minimum_server_age_minutes: 10, invalid_if_later_valid_ownership_grant_exists: true}

    RESUME_INTENT:
      required_fields: [reason, source_comment_id, observed_head_sha]
      enums: {reason: [HANDOFF, STALE, ORPHAN]}
      predecessor_by_reason:
        HANDOFF: {source_kind: STATUS, source_state: HANDOFF_READY}
        STALE: {source_kind: [CLAIM, RESUME, RECOVER, PROGRESS], source_condition: lease_expired_and_no_later_completion_or_handoff}
        ORPHAN: {source_kind: ORPHAN_PROBE, source_condition: mature_probe_and_no_later_ownership}
      validity:
        observed_head_must_equal_current_branch_head: true
        source_condition_must_still_hold_at_comment_creation: true
      winner_rule: lowest_comment_id_among_valid_intents_for_same_source_comment_and_observed_head
      authority_effect: none

    RESUME:
      required_fields: [state, base_sha, observed_head_sha, previous_ownership_comment_id, winning_intent_comment_id, source_status_comment_id]
      constants: {state: IN_PROGRESS}
      predecessor: {winning_intent_reason: HANDOFF, source_kind: STATUS, source_state: HANDOFF_READY}
      validity:
        actor_session_must_equal_winning_intent_actor_session: true
        winning_intent_must_be_lowest_valid_intent: true
        current_head_must_equal_observed_head: true
        only_first_valid_grant_for_winning_intent_is_valid: true
      authority_effect: new_ownership_generation

    RECOVER:
      required_fields: [state, recovery_reason, base_sha, observed_head_sha, previous_ownership_comment_id, winning_intent_comment_id, source_comment_id]
      constants: {state: IN_PROGRESS}
      enums: {recovery_reason: [STALE, ORPHAN]}
      predecessor_by_reason:
        STALE: {winning_intent_reason: STALE, source_condition: referenced_ownership_is_stale}
        ORPHAN: {winning_intent_reason: ORPHAN, source_condition: referenced_orphan_probe_is_mature}
      validity:
        actor_session_must_equal_winning_intent_actor_session: true
        winning_intent_must_be_lowest_valid_intent: true
        source_condition_must_still_hold: true
        current_head_must_equal_observed_head: true
        only_first_valid_grant_for_winning_intent_is_valid: true
      authority_effect: new_ownership_generation

    PROGRESS:
      required_fields: [state, ownership_generation_comment_id, observed_head_sha, progress_basis, evidence_refs]
      constants: {state: IN_PROGRESS}
      enums: {progress_basis: [HEAD_ADVANCE, EVIDENCE]}
      predecessor: {current_valid_owner_required: true}
      validity:
        ownership_generation_must_equal_current_owner: true
        posted_before_lease_expiry: true
        current_head_must_equal_observed_head: true
        HEAD_ADVANCE_requires_head_different_from_prior_renewal_head: true
        EVIDENCE_requires_nonempty_immutable_evidence_refs: true
        maximum_consecutive_EVIDENCE_renewals_without_head_advance: 3
      authority_effect: renew_current_lease_only

    STATUS:
      required_fields: [state, ownership_generation_comment_id, head_sha]
      enums: {state: [HANDOFF_READY, REVIEW_READY, VERIFICATION_READY, DONE, SUPERSEDED, INVALIDATED]}
      predecessor:
        ordinary_status_requires_current_valid_owner: true
        SUPERSEDED_external_path_requires_valid_superseding_INTEGRATION_STATUS: true
        INVALIDATED_external_path_requires_valid_authorizing_REVIEW_STATUS_or_INTEGRATION_STATUS: true
      conditional_required_fields:
        HANDOFF_READY: [work_sha, handoff_path]
        REVIEW_READY: [work_sha, artifact_paths, acceptance_evidence_refs]
        VERIFICATION_READY: [candidate_work_sha, manifest_identity, artifact_paths]
        DONE: [result_code, evidence_refs]
        SUPERSEDED: [superseded_by_issue_or_artifact, superseding_integration_status_comment_id, reason]
        INVALIDATED: [reason, remediation_issue_or_path, authorizing_comment_id]
      authority_effect: recorded_task_state

    REVIEW_STATUS:
      required_fields: [state, ownership_generation_comment_id, reviewed_work_shas, disposition, findings_artifact, blocker_count, major_count]
      enums:
        state: [DONE, INVALIDATED]
        disposition: [PASS_FOR_SYNTHESIS, CHANGES_REQUIRED, INVALIDATED]
      transition_constraints:
        PASS_FOR_SYNTHESIS: {required_state: DONE}
        CHANGES_REQUIRED: {required_state: DONE}
        INVALIDATED: {required_state: INVALIDATED}
      downstream_effect:
        PASS_FOR_SYNTHESIS: declared_synthesis_may_become_ready
        CHANGES_REQUIRED: declared_synthesis_revision_may_become_ready
        INVALIDATED: only_declared_recovery_or_replanning_may_become_ready

    VERIFICATION_STATUS:
      required_fields: [state, ownership_generation_comment_id, result, candidate_work_sha, manifest_identity, adopted_wave_1_contract_blob_sha, verified_base_main_sha, report_path, blocker_count, major_count]
      constants: {state: DONE}
      enums: {result: [PASS, FAIL]}
      validity:
        PASS_requires_blocker_count: 0
        PASS_requires_major_count: 0
        PASS_requires_fresh_independent_context: true
        candidate_manifest_and_adopted_blob_must_match_exact_verified_payload: true
      downstream_effect: {PASS: declared_canonicalization_issue_may_become_ready, FAIL: only_bounded_remediation_may_become_ready}

    INTEGRATION_STATUS:
      required_fields: [state, ownership_generation_comment_id, verification_status_comment_id, verified_candidate_work_sha, verified_manifest_identity, verified_base_main_sha, expected_pre_merge_head_sha, main_sha, merge_method, result_code, canonicality]
      constants: {state: DONE, merge_method: squash}
      validity:
        referenced_verification_must_be_valid_PASS: true
        expected_pre_merge_head_must_match_merged_PR_head: true
        verified_base_must_match_pre_merge_main_or_have_recorded_compatibility_reverification: true
        main_sha_must_be_result_of_referenced_squash_merge: true
      authority_effect: terminal_integration_and_canonicality_record

transition_table:
  new_issue:
    BLOCKED_to_READY: derived_when_all_hard_prerequisites_satisfied
    READY_to_IN_PROGRESS: winning_CLAIM
  orphan_branch:
    branch_without_owner_to_probe: ORPHAN_PROBE
    mature_probe_to_intent: RESUME_INTENT_reason_ORPHAN
    winning_intent_to_IN_PROGRESS: RECOVER_reason_ORPHAN
  intentional_handoff:
    IN_PROGRESS_to_HANDOFF_READY: STATUS_HANDOFF_READY
    HANDOFF_READY_to_intent: RESUME_INTENT_reason_HANDOFF
    winning_intent_to_IN_PROGRESS: RESUME
  stale_owner:
    IN_PROGRESS_to_STALE_OWNER: derived_on_lease_expiry
    STALE_OWNER_to_intent: RESUME_INTENT_reason_STALE
    winning_intent_to_IN_PROGRESS: RECOVER_reason_STALE
  active_owner:
    renew: PROGRESS
    producer_complete: STATUS_REVIEW_READY
    domain_synthesis_complete: STATUS_REVIEW_READY
    final_synthesis_complete: STATUS_VERIFICATION_READY
    intentional_yield: STATUS_HANDOFF_READY
    invalidate: STATUS_INVALIDATED
  review_task:
    complete_pass: REVIEW_STATUS_DONE_PASS_FOR_SYNTHESIS
    complete_changes: REVIEW_STATUS_DONE_CHANGES_REQUIRED
    invalidate: REVIEW_STATUS_INVALIDATED_INVALIDATED
  verification_task: {pass: VERIFICATION_STATUS_DONE_PASS, fail: VERIFICATION_STATUS_DONE_FAIL}
  integration_task: {terminal_after_squash: INTEGRATION_STATUS_DONE}
  retirement: {supersede: STATUS_SUPERSEDED, invalidate: STATUS_INVALIDATED}

mutation_fence:
  before_every_task_branch_mutation:
    - refetch_schema_2_operational_comments
    - verify_current_ownership_generation_and_unexpired_lease
    - fetch_remote_branch_head
    - require_remote_head_equals_proposed_commit_parent
    - create_commit_with_that_exact_parent
    - update_branch_ref_force_false_only
    - abort_on_any_mismatch_or_non_fast_forward

verification_scenarios_required_after_remediation:
  - simultaneous_new_claimants
  - branch_created_then_claim_comment_crash
  - mature_orphan_competing_recovery_intents
  - intentional_handoff_competing_resume_intents
  - stale_owner_continues_after_recovery
  - malformed_missing_field_unknown_kind_and_edited_capsules
  - duplicate_losing_RESUME_or_RECOVER_grants
  - review_PASS_CHANGES_REQUIRED_INVALIDATED_routing
  - domain_synthesis_REVIEW_READY_vs_final_VERIFICATION_READY
  - context_budget_unknown_window_fallback
  - no_READY_liveness
  - post_merge_pre_terminal_activation_window
  - mechanical_canonical_promotion_with_post_transform_assertions
  - main_advances_after_PASS
  - pre_activation_wave_1_claim
  - author_reviewer_identity_reuse
  - squash_only_integration

next_wave_governor:
  max_new_issues: 24
  max_initial_ready: 12
  adopted_from_wave_1_contract_blob: d7ba9d5e9f6afe6b83837f2da13831873a5b8ddd

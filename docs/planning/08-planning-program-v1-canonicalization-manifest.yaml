version: 1
state: REVIEWED_CANDIDATE_SUPPORT
bootstrap_issue: 4
candidate_path: docs/planning/08-planning-program-v1-reviewed-candidate.md
dispositions_path: docs/planning/reviews/issue-3-finding-dispositions.md

verification_contract:
  verifier_issue: 5
  required_result: PASS
  bind:
    - candidate_work_sha
    - manifest_blob_or_work_sha
    - verified_base_main_sha
  pass_forbidden_with_unresolved_severity:
    - BLOCKER
    - MAJOR

bootstrap_canonicalization:
  issue: 6
  pre_merge_requirements:
    current_main_must_equal_verified_base_main_sha: true
    base_drift_action: independent_compatibility_or_reverification
    unresolved_blocker_major_forbidden: true
    merge_method: squash
  program_promotion:
    source: docs/planning/08-planning-program-v1-reviewed-candidate.md
    destination: docs/planning/PLANNING-PROGRAM-v1.md
    transform:
      type: exact_literal_replacements_then_byte_identical_remainder
      replacements:
        - from: "**State:** REVIEWED-CANDIDATE"
          to: "**State:** CANONICAL"
        - from: "**Bootstrap issue:** #4"
          to: "**Canonicalized by:** Bootstrap Issue #6"
        - from: "**Authority:** Candidate operating model only. It MUST NOT become CANONICAL until Bootstrap Issue #5 independently verifies this exact candidate work state and Bootstrap Issue #6 performs the verified, mechanically constrained promotion."
          to: "**Authority:** CANONICAL planning operating model for the current planning phase, activated only after the verified Bootstrap Issue #6 squash integration recorded on GitHub."
      all_other_bytes_identical: true
  agents_entry_patch:
    source_path: AGENTS.md
    base_must_match_verified_main: true
    replace_section:
      heading: "## Mandatory Cold-Start Entry Point"
      until_next_heading: "## Planning Work Output Rule"
      replacement: |
        ## Mandatory Cold-Start Entry Point

        A fresh agent with no prior conversation context MUST:

        1. Read this file.
        2. Read `docs/planning/START-HERE.md`.
        3. Follow the canonical Planning Program v1 referenced there.
        4. Select/resume work only from repository + GitHub state using the canonical dispatcher rules.
        5. Preserve the canonical squash-only `main` integration rule.

        The bootstrap Issues #2-#6 are provenance after canonicalization and are not the normal work queue.

  start_here_replacement:
    path: docs/planning/START-HERE.md
    content: |
      # START HERE — Canonical Planning Entry

      **Phase:** PLANNING  
      **Authority:** Entry pointer to canonical Planning Program v1.

      A fresh agent with no prior conversation context MUST:

      1. Read `/AGENTS.md`.
      2. Read `docs/planning/PLANNING-PROGRAM-v1.md` from current `main`.
      3. Query open GitHub issues beginning with `[PLAN-v1]`.
      4. Derive eligibility, ownership, recovery, priority, context, output, review, and handoff state exactly as defined by the canonical program.
      5. Prefer resumable/recovery and review/revision/verification/integration work before new proposal work.
      6. Never use prior chat history as project authority.
      7. Never integrate into `main` except by squash merge.

      Bootstrap planning artifacts remain provenance and may be read only when the canonical program or selected issue explicitly requires them.

  post_merge_sequence:
    - obtain_squash_main_sha
    - verify_canonical_program_at_that_sha
    - instantiate_exactly_23_wave_1_issues_from_this_manifest
    - validate_all_created_issue_contracts
    - post_mission_id_to_issue_number_mapping
    - post_issue_6_DONE_with_main_sha
  wave_1_creation_before_merge: forbidden

issue_compiler:
  title_template: "[PLAN-v1][{mission_id}] {title}"
  body_field_order:
    - Mission ID
    - Role
    - State at creation
    - Priority rank
    - Objective
    - Hard prerequisites
    - Conflict/ownership surface
    - Authoritative inputs
    - Optional retrieval triggers
    - Forbidden-by-default context
    - Output path(s)
    - Output schema
    - Evidence requirements
    - Acceptance criteria
    - Required independent critique/review
    - Downstream missions unblocked
    - Branch/base rule
    - Stopping/handoff rule
    - Canonicalization/integration rule
  common_branch_rule: "Use planning/issue-N from current main after the concrete Wave 1 activation SHA is satisfied."
  common_stopping_rule: "Commit useful state; update docs/planning/handoffs/issue-N.md; post final STATUS with exact branch head."
  common_integration_rule: "No artifact becomes canonical by authorship or PR existence; every main integration is squash-only and follows the mission review/verification route."
  common_forbidden_context: "All planning documents not listed as authoritative inputs are forbidden-by-default unless an optional retrieval trigger is satisfied."
  root_output_schema: proposal_research_v1
  review_output_schema: adversarial_review_v1
  synthesis_output_schema: synthesis_v1
  verification_output_schema: verification_v1
  activation_prerequisite:
    bootstrap_issue: 6
    required_state: DONE
    required_integration_method: squash
    required_main_sha: RESOLVE_FROM_ISSUE_6_POST_MERGE_STATUS
    required_canonical_program: docs/planning/PLANNING-PROGRAM-v1.md

universal_root_acceptance:
  - exact_output_exists
  - review_index_at_most_4000_utf8_chars
  - proposal_research_schema_satisfied
  - scope_and_non_goals_explicit
  - assumptions_evidence_inference_recommendations_distinguished
  - material_alternatives_fairly_represented
  - current_external_claims_authoritative_or_deferred
  - empirical_uncertainty_bounded_as_experiment
  - interfaces_dependencies_conflict_surfaces_explicit
  - observability_and_failure_modes_explicit
  - open_questions_and_reopen_conditions_explicit
  - required_critique_named
  - no_self_instantiated_current_wave_work
  - handoff_and_final_head_status_present
  - pr_for_diff_visibility_or_explicit_no_pr_rationale

wave_1:
  initial_issue_count: 23
  max_initial_ready: 12
  instantiate_only_after_bootstrap_merge: true
  missions:
    - mission_id: W1-REC-01
      title: Planning liveness recovery
      role: checkpoint/recovery agent
      priority_rank: 5
      initial_state: BLOCKED
      objective: Diagnose a planning liveness defect and restore the smallest credible READY path without bypassing review, verification, canonicalization, or squash integration.
      prerequisites:
        condition: no_normal_ready_or_recoverable_work_and_no_valid_active_owner_can_unblock_graph
      ownership_surface: docs/planning/wave-1/recovery/
      authoritative_inputs:
        - docs/planning/PLANNING-PROGRAM-v1.md
        - complete_relevant_open_PLAN_v1_issue_graph
        - latest_valid_capsules_for_affected_missions
        - affected_task_branches_and_handoffs_as_needed
      optional_retrieval: Earlier proposal/review/synthesis artifacts only to trace the specific invalidated dependency or contradiction.
      output: docs/planning/wave-1/recovery/liveness-recovery.md
      schema: recovery_episode_v1
      evidence: Graph snapshot, failure classification, affected mission IDs/SHAs, smallest remediation, resulting eligible path.
      acceptance: Single-use episode; no gate waiver; accepted integration may create exactly one blocked successor W1-REC-02.
      review: independent_review_or_verification_as_required_by_remediation
      downstream: restored_ready_path_and_optional_single_successor_recovery_issue

    - mission_id: W1-GOV-01
      title: Governance, canonicality, and provenance
      role: governance planner
      priority_rank: 10
      initial_state: BLOCKED
      objective: Propose autonomy constitution, human-directive semantics, canonicality/decision rules, risk model, self-modification boundaries, and legal/IP/provenance requirements.
      ownership_surface: docs/planning/wave-1/proposals/governance-and-canonicality.md
      authoritative_inputs: [AGENTS.md, docs/planning/00-project-charter.md, docs/planning/01-autonomous-factory-mandate.md, docs/planning/05-research-agenda.md, docs/planning/06-planning-deliverables.md]
      output: docs/planning/wave-1/proposals/governance-and-canonicality.md
      schema: proposal_research_v1
      review: W1-REV-FAC
      downstream: [W1-REV-FAC]

    - mission_id: W1-FAC-01

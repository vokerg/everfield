      prerequisites:
        all_review_ready: [W1-SYN-FAC, W1-SYN-TECH, W1-SYN-GAME]
      authoritative_inputs: [W1-SYN-FAC@work_sha, W1-SYN-TECH@work_sha, W1-SYN-GAME@work_sha, prerequisite_status_capsules]
      output: docs/planning/wave-1/reviews/cross-domain-interface-and-parallelism.md
      schema: adversarial_review_v1
      allowed_dispositions: [PASS_FOR_SYNTHESIS, CHANGES_REQUIRED, INVALIDATED]
      downstream:
        PASS_FOR_SYNTHESIS: [W1-SYN-FINAL]
        CHANGES_REQUIRED: [W1-SYN-FINAL]
        INVALIDATED: [W1-REC-01]

    - mission_id: W1-SYN-FINAL
      title: Wave-1 canonicalization candidate and dependency map
      role: final planning synthesizer distinct from cross-domain reviewer
      priority_rank: 510
      initial_state: BLOCKED
      objective: Disposition cross-domain BLOCKER/MAJOR findings, separate candidate canonical decisions from deferrals, and emit typed dependencies, empirical work, conflicts, bounded next-wave candidates, and implementation-readiness blockers.
      ownership_surface: docs/planning/wave-1/synthesis/
      prerequisites:
        review: W1-REV-CROSS
        allowed_review_disposition: [PASS_FOR_SYNTHESIS, CHANGES_REQUIRED]
      authoritative_inputs: [W1-SYN-FAC@reviewed_work_sha, W1-SYN-TECH@reviewed_work_sha, W1-SYN-GAME@reviewed_work_sha, W1-REV-CROSS@work_sha, prerequisite_status_capsules]
      outputs: [docs/planning/wave-1/synthesis/wave-1-canonicalization-candidate.md, docs/planning/wave-1/synthesis/dependency-map.yaml, docs/planning/wave-1/synthesis/next-wave-promotion-manifest.yaml]
      schema: final_synthesis_v1
      completion_state: VERIFICATION_READY
      downstream: [W1-VERIFY-01]

    - mission_id: W1-VERIFY-01
      title: Independent wave-1 cold-start/coherence verification
      role: verifier distinct from final synthesizer and cross reviewer
      priority_rank: 610
      initial_state: BLOCKED
      objective: Independently verify exact final-synthesis work state, promotion manifest, issue graph, claim/recovery/fencing, base pinning, context limits, implementation barrier, and squash integration behavior.
      ownership_surface: docs/planning/wave-1/reviews/wave-1-cold-start-verification.md
      prerequisites:
        exact_state: W1-SYN-FINAL@VERIFICATION_READY
      authoritative_inputs: [W1-SYN-FINAL@work_sha, dependency_map_from_same_work_sha, next_wave_promotion_manifest_from_same_work_sha, complete_current_PLAN_v1_issue_graph_and_valid_capsules, current_main_entry_docs]
      output: docs/planning/wave-1/reviews/wave-1-cold-start-verification.md
      schema: verification_v1
      result: [PASS, FAIL]
      downstream:
        PASS: [W1-CANON-01]
        FAIL: [bounded_remediation_only]

    - mission_id: W1-CANON-01
      title: Canonicalize accepted wave-1 foundations and instantiate next bounded wave
      role: integration/canonicalization agent distinct from final synthesizer and verifier
      priority_rank: 710
      initial_state: BLOCKED
      objective: Promote only the exact verified Wave 1 candidate using its verified promotion manifest, retire superseded work, and instantiate only the compiler-validated bounded next wave.
      ownership_surface: canonical planning locations plus docs/planning/wave-1/canonicalization-report.md
      prerequisites:
        verification: W1-VERIFY-01@PASS
        exact_candidate_match_required: true
        verified_base_current_main_match_or_reverification: true
      authoritative_inputs: [W1-SYN-FINAL@verified_work_sha, dependency_map_same_work_state, next_wave_promotion_manifest_same_work_state, W1-VERIFY-01@PASS_work_sha, current_main_entry_docs, current_wave_issue_status_for_retirement]
      output: docs/planning/wave-1/canonicalization-report.md
      schema: canonicalization_report_v1
      integration: squash_only
      next_wave_governor:
        max_new_issues: 24
        max_initial_ready: 12
        compiler_checks: [unique_mission_ids, acyclic_hard_dependencies, no_output_path_collisions, ownership_conflict_validation, required_review_routes, activation_prerequisites]

non_root_optional_retrieval:
  W1-REV-FAC: Seed/mandate docs only to test a concrete contradiction or omission.
  W1-REV-TECH: Primary technical sources or seed mandates only to test a concrete claim/omission.
  W1-REV-GAME: Charter/game/evaluation seed docs only to test intent, reference boundaries, or evaluator requirements.
  W1-SYN-FAC: Seed mandates only when reviewed evidence cannot disposition a finding/conflict.
  W1-SYN-TECH: Primary technical evidence only when a finding disposition depends on a current technical claim.
  W1-SYN-GAME: Seed mandates only to adjudicate intent preservation or unresolved cross-artifact conflict.
  W1-REV-CROSS: Earlier root/review artifacts only to trace a concrete disputed provenance chain.
  W1-SYN-FINAL: Earlier proposals/reviews only to trace a disputed finding/evidence claim.
  W1-VERIFY-01: Earlier provenance only to verify a contradiction or promotion lineage.
  W1-CANON-01: Earlier provenance only to validate promotion, supersession, or disposition.

next_wave_candidate_schema:
  required_fields: [mission_id, role, priority_rank, objective, hard_prerequisites, ownership_surface, authoritative_inputs, output_paths, output_schema, evidence_requirements, acceptance_criteria, required_review, downstream, integration_rule]
  candidates_may_exceed_instantiation_cap: true
  excess_candidates_state: DEFERRED
  max_instantiated_per_activation: 24
  max_initial_ready_per_activation: 12

    decision_state: CANONICAL_CANDIDATE
    initial_state: READY
    objective: Specify and validate the singular TaskClaimContract → EvidenceRequirement → CheckPlan → ExecutionEvidenceEnvelope → EvidenceSatisfaction chain plus ActiveDirectiveSet, ResourceCapabilityState, RiskFloor, ArtifactIdentity, and ImplementationReadinessLedger.
    hard_prerequisites: [W1-CANON-01_TERMINAL_BINDING]
    ownership_surface: docs/planning/wave-2/foundations/authority-evidence-contract.md
    conflict_keys: [wave2:authority-evidence-contract]
    authoritative_inputs: [docs/planning/WAVE-1-FOUNDATIONS-v1.md, docs/planning/WAVE-1-DEPENDENCY-MAP-v1.yaml, docs/planning/PLANNING-PROGRAM-v1.md]
    output_paths: [docs/planning/wave-2/foundations/authority-evidence-contract.md]
    output_schema: proposal_research_v1
    evidence_requirements: Closed machine shapes, compile direction, invalid cases, directive-vs-evidence cases, degraded trust cases, validator fixtures; no object other than derived EvidenceSatisfaction may independently create empirical PASS.
    acceptance_criteria: Exact contract/fixtures; one acceptance authority; master lease directive represented without independence upgrade; deterministic readiness-ledger compilation; Review Index <=4000 UTF-8 chars; no production implementation.
    required_review: W2-REV-01
    downstream: [W2-ENG-03, W2-SIM-01, W2-REV-01]
    integration_rule: USE_COMMON
    evidence_targets: [IR-BLOCKER-EVIDENCE-FOUNDATION]
    readiness_scope: [PRODUCTION_IMPLEMENTATION]
    risk_floor: R2_CROSS_DOMAIN_AUTHORITY


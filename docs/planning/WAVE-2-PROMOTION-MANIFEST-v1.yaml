version: 2
state: VERIFICATION_CANDIDATE
source_mission: W1-SYN-FINAL
wave: 2
activation_main_sha: RESOLVE_FROM_W1_CANON_01_SQUASH_SHA
issue_title_template: "[PLAN-v1][{mission_id}] {title}"
queue_prefix_reason: canonical_PLANNING_PROGRAM_v1_dispatches_open_PLAN-v1_issues; wave identity is carried by W2 mission IDs, not a new queue prefix
instantiated_candidate_count: 18
initial_ready_count: 12
max_instantiated: 24
max_initial_ready: 12
current_phase: PLANNING
production_implementation_authorized: false
canonical_dispatcher_remains: docs/planning/PLANNING-PROGRAM-v1.md
canonical_foundations_after_promotion:
  - docs/planning/WAVE-1-FOUNDATIONS-v1.md
  - docs/planning/WAVE-1-DEPENDENCY-MAP-v1.yaml
  - docs/planning/WAVE-2-PROMOTION-MANIFEST-v1.yaml

compiler_contract:
  required_fields: [mission_id, role, priority_rank, objective, hard_prerequisites, ownership_surface, authoritative_inputs, output_paths, output_schema, evidence_requirements, acceptance_criteria, required_review, downstream, integration_rule]
  allowed_root_output_schema: proposal_research_v1
  review_output_schema: adversarial_review_v1
  synthesis_output_schema: synthesis_v1
  verification_output_schema: verification_v1
  common_branch_rule: "Use planning/issue-N from current main after concrete W1-CANON-01 activation SHA is satisfied."
  common_stopping_rule: "Commit useful state; update docs/planning/handoffs/issue-N.md; publish exact schema-3 terminal status at current branch head."
  common_forbidden_context: "Planning context not listed as authoritative input is forbidden-by-default unless a declared retrieval trigger is satisfied."
  common_integration_rule: "No artifact becomes canonical by authorship or PR existence; every main integration is squash-only and follows the declared review/verification route. PLANNING_EXPERIMENT code is non-production and may not become a production dependency without later verified promotion."
  prerequisite_tokens:
    W1-CANON-01_TERMINAL_BINDING: valid terminal W1-CANON-01 integration status whose main SHA is ancestor/equal current main and whose canonical Wave-1 foundation blob matches current canonical foundation
    MISSION_REVIEW_READY: valid owner STATUS(REVIEW_READY) for exact mission current work/head
    REVIEW_PASS_OR_CHANGES_REQUIRED: valid REVIEW_STATUS disposition PASS_FOR_SYNTHESIS or CHANGES_REQUIRED
    MISSION_VERIFICATION_READY: valid owner STATUS(VERIFICATION_READY) for exact mission current work/head
  initial_ready_rule: only W1-CANON-01_TERMINAL_BINDING prerequisite may remain after activation
  blocked_rule: every additional mission prerequisite must be satisfied by exact current terminal capsule before READY
  planning_experiment_rules:
    disposable: true
    production_dependency_allowed: false
    production_content_authority: NONE
    engine_lock_in_authority: NONE
    requires_exact_evidence_question: true
    requires_bounded_owned_surface: true
    result_promotion_requires_evidence_predicate_and_review: true


attack_plan:
  - engine evaluation can launder a preferred engine through harness deviations, scoring, or unmeasured adapter burden
  - runtime/data proposal can claim determinism while leaving physics, ordering, numeric, time, or external-input boundaries untestable
  - save/content/schema design can centralize ownership or make migrations/replays impossible to verify under continuous expansion
  - GitHub control-plane design can claim atomicity, leases, rulesets, or merge safety beyond actually enforceable authority
  - review/trust model can permit same-context or self-authored evidence to masquerade as independent verification
  - protected evidence can become opaque, mutable, or unavailable to reproducible debugging
  - CI/evidence topology can retry flaky failures into green, lose provenance, or make retention/cost unbounded
  - factory/evaluator metrics can become direct optimization targets with no escape/holdout detection
  - automated game evaluation can execute duplicate test logic rather than production/shared rules or let one evaluator family dominate
  - candidate/version/evaluator/toolchain drift can silently invalidate prior results
  - cross-proposal evidence identities can be incompatible, making exact reproduction impossible despite locally strong schemas
  - required experiments can be described but have no explicit promotion barrier preventing assumptions from hardening before evidence
severity_rule:
  BLOCKER: proceeding_to_synthesis_would_make_technical_or_evidence_candidate_logically_invalid_or_unverifiable
  MAJOR: material_cross_proposal_or_evidence_gap_requires_correction_or_bounded_evidence_before_acceptance
  MINOR: useful_correction_not_required_to_establish_core_synthesis_viability
  NOTE: nonblocking_observation_or_future_measurement

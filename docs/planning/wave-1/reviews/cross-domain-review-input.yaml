attack_plan:
  - authority collision between factory TaskContract/Trust/Evidence state and technical ExecutionEvidenceEnvelope/CheckPlan/decision state
  - circular readiness where evidence work requires engine/game interfaces that themselves require implementation readiness or a settled engine
  - game progression/time/generative-state contracts that do not map cleanly onto technical canonical state, replay, and migration boundaries
  - protected evidence and subjective panels that cannot satisfy factory permission/trust semantics under degraded single-agent operation
  - shared schema/registry/evidence structures that centralize ownership and collapse concurrency despite distributed-namespace intent
  - scheduler treating EVIDENCE_REQUIRED experiments as ordinary prerequisites and serializing all work or allowing unproven decisions through
  - implementation-readiness leakage through conditional engine selection, prototype spikes, accessibility deferrals, or factory protocol changes
  - inconsistent lifecycle semantics for external/current research freshness, evaluator drift, evidence retention, and reopening old decisions
  - next-wave promotion candidates that are not typed strongly enough to preserve dependencies, conflicts, review routes, and evidence gates
  - final synthesis being unable to deterministically distinguish canonical candidate decisions from deferred empirical work

attack_plan:
  - fake sandbox diversity and hidden foundational/mandatory routes
  - universal-currency or progression dominance despite nominal lifestyle choice
  - automation that either becomes compulsory optimizer play or removes meaningful play
  - discovery/UX/accessibility conflicts with hidden systems, timing, secrets, and broad possibility space
  - narrative/quest/world-state requirements that silently force one canonical progression path
  - technical determinism/persistence boundaries that distort world/NPC/narrative/experience design
  - content growth that inflates counts while semantic interaction and identity stay shallow
  - generated-content grounding, provenance, similarity, and semantic-sameness failure
  - synthetic-player/persona and semantic-coverage Goodhart paths
  - protected/subjective evaluator blind spots, correlation, drift, and player-representation laundering
  - player-surface versus simulation-surface contradictions
  - late-game resource/sink/automation escalation that erases small-scale/cozy/direct-play viability
severity_rule:
  BLOCKER: proceeding_to_synthesis_would_make_game_candidate_logically_or_quality_invalid
  MAJOR: material_cross_proposal_or_evidence_gap_requires_correction_or_bounded_evidence_before_acceptance
  MINOR: useful_correction_not_required_to_establish_core_synthesis_viability
  NOTE: nonblocking_observation_or_future_measurement

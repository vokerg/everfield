  initial_ready_missions: [W2-AUTH-01, W2-GH-01, W2-ENG-01, W2-ENG-02, W2-HASH-01, W2-MIG-01, W2-ORDER-01, W2-PROTECT-01, W2-CI-01, W2-EVAL-01, W2-PLAT-01, W2-RIGHTS-01]

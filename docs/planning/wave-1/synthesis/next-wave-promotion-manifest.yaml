    acceptance_criteria: Model simulations are granted only the claim authority supported by measured parity; divergence retained; no abstract model can self-certify production correctness.
    required_review: W2-REV-01
    downstream: [W2-REV-01]
    integration_rule: USE_COMMON
    evidence_targets: [TECH-EV-SIM-PARITY, MODEL_SIMULATION_ACCEPTANCE_AUTHORITY]
    readiness_scope: []
    risk_floor: R2_EVIDENCE_MODEL

  - mission_id: W2-REV-01
    title: Wave 2 evidence, engine, trust, and readiness adversarial review
    role: independent cross-domain evidence reviewer
    priority_rank: 220
    task_class: ADVERSARIAL_REVIEW
    decision_state: CANONICAL_CANDIDATE
    initial_state: BLOCKED
    objective: Independently attack exact Wave 2 authority/compiler, engine, runtime, CI, protected-evidence, evaluator, platform, accessibility, rights, and simulation evidence for invalid promotion, bias, missing attempts, stale sources, trust gaps, or implementation-readiness leakage.
    hard_prerequisites: [W1-CANON-01_TERMINAL_BINDING, W2-AUTH-01_REVIEW_READY, W2-GH-01_REVIEW_READY, W2-ENG-01_REVIEW_READY, W2-ENG-02_REVIEW_READY, W2-HASH-01_REVIEW_READY, W2-MIG-01_REVIEW_READY, W2-ORDER-01_REVIEW_READY, W2-PROTECT-01_REVIEW_READY, W2-CI-01_REVIEW_READY, W2-EVAL-01_REVIEW_READY, W2-PLAT-01_REVIEW_READY, W2-RIGHTS-01_REVIEW_READY, W2-ACC-01_REVIEW_READY, W2-ENG-03_REVIEW_READY, W2-SIM-01_REVIEW_READY]
    ownership_surface: docs/planning/wave-2/reviews/evidence-and-readiness.md
    conflict_keys: [wave2:review:evidence-readiness]
    authoritative_inputs: [docs/planning/WAVE-1-FOUNDATIONS-v1.md, exact_terminal_work_shas_for_W2_Authority_Evidence_Missions]
    optional_retrieval_triggers: Earlier Wave 2 task evidence only through exact refs; primary sources only to challenge a current claim.
    output_paths: [docs/planning/wave-2/reviews/evidence-and-readiness.md]
    output_schema: adversarial_review_v1
    evidence_requirements: Bind exact work/evidence identities; independent/degraded-independent attack plan before rationale; findings and blocker/major counts; no candidate edits; test engine bias, readiness leakage, evidence algebra, trust, freshness, and failed-run retention.
    acceptance_criteria: Disposition PASS_FOR_SYNTHESIS, CHANGES_REQUIRED, or INVALIDATED; every BLOCKER/MAJOR has correction/evidence question; exact trust profile/status/handoff; no engine/readiness decision self-certified.
    required_review: THIS_IS_THE_REQUIRED_INDEPENDENT_ADVERSARIAL_REVIEW
    downstream: [W2-SYN-01]
    integration_rule: USE_COMMON
    evidence_targets: [ENGINE_DECISION, IR-BLOCKER-EVIDENCE-FOUNDATION, IR-BLOCKER-ACCESSIBILITY-CURRENT, IR-BLOCKER-PLATFORM-SCOPE]
    readiness_scope: [PRODUCTION_IMPLEMENTATION]
    risk_floor: R3_CROSS_DOMAIN_REVIEW

  - mission_id: W2-SYN-01
    title: Wave 2 decision and implementation-readiness candidate
    role: decision synthesis agent distinct from W2-REV-01
    priority_rank: 320
    task_class: SYNTHESIS
    decision_state: CANONICAL_CANDIDATE
    initial_state: BLOCKED
    objective: Disposition W2-REV-01 material findings, synthesize exact engine/evidence/platform/accessibility/rights results, update decision states and ImplementationReadinessLedger, and emit a candidate engine ADR only if evidence actually supports it.
    hard_prerequisites: [W1-CANON-01_TERMINAL_BINDING, W2-REV-01_PASS_OR_CHANGES_REQUIRED]
    ownership_surface: docs/planning/wave-2/synthesis/
    conflict_keys: [wave2:synthesis:decision-readiness]
    authoritative_inputs: [docs/planning/WAVE-1-FOUNDATIONS-v1.md, W2-REV-01@work_sha, exact_reviewed_Wave2_evidence_work_shas]
    optional_retrieval_triggers: Earlier evidence only to trace disputed finding/provenance; current external source only when a disposition depends on freshness.
    output_paths: [docs/planning/wave-2/synthesis/decision-and-readiness-candidate.md, docs/planning/wave-2/synthesis/readiness-ledger.yaml]
    output_schema: synthesis_v1
    evidence_requirements: Explicit disposition of every BLOCKER/MAJOR; exact decision-state transitions; evidence refs for any engine ADR; unresolved/open blockers retained; no scalar score as sole decision.
    acceptance_criteria: Candidate and readiness ledger internally consistent; no OPEN production blocker silently cleared; any engine decision has exact evidence/review/exit/reopen route; terminal state VERIFICATION_READY only if suitable for W2-READY-01.
    required_review: W2-READY-01
    downstream: [W2-READY-01]
    integration_rule: USE_COMMON
    evidence_targets: [ENGINE_DECISION, IMPLEMENTATION_READINESS_LEDGER]
    readiness_scope: [PRODUCTION_IMPLEMENTATION]
    risk_floor: R3_FINAL_DECISION_SYNTHESIS

  - mission_id: W2-READY-01
    title: Independent implementation-readiness verification checkpoint
    role: verifier distinct from W2-SYN-01 and W2-REV-01
    priority_rank: 420
    task_class: INDEPENDENT_VERIFICATION
    decision_state: CANONICAL_CANDIDATE
    initial_state: BLOCKED
    objective: Cold-start verify the exact Wave 2 decision/readiness candidate, engine evidence if any, readiness ledger, evidence authority chain, current base, implementation barrier, and proposed next transition; return PASS/FAIL without itself implementing gameplay.
    hard_prerequisites: [W1-CANON-01_TERMINAL_BINDING, W2-SYN-01_VERIFICATION_READY]
    ownership_surface: docs/planning/wave-2/reviews/implementation-readiness-verification.md
    conflict_keys: [wave2:verify:implementation-readiness]
    authoritative_inputs: [docs/planning/WAVE-1-FOUNDATIONS-v1.md, W2-SYN-01@work_sha, W2-SYN-01_readiness_ledger, complete_current_PLAN_issue_graph]
    optional_retrieval_triggers: Earlier Wave 2 evidence only to verify exact contradiction/provenance; current external sources only for freshness checks.
    output_paths: [docs/planning/wave-2/reviews/implementation-readiness-verification.md]
    output_schema: verification_v1
    evidence_requirements: Fresh repository/GitHub cold start; exact candidate/base/evidence binding; simulate implementation barrier and dispatcher; zero unresolved BLOCKER/MAJOR for PASS; DEGRADED_SINGLE_AGENT explicit until stronger capability exists.
    acceptance_criteria: PASS only if exact ledger/payload/base coherent and no OPEN blocker covers the claimed readiness scope; otherwise FAIL with bounded remediation; terminal verification status exact.
    required_review: THIS_IS_THE_INDEPENDENT_VERIFICATION_GATE
    downstream: [bounded_next_canonicalization_or_planning_wave_only_after_result]
    integration_rule: USE_COMMON
    evidence_targets: [IMPLEMENTATION_READINESS_DECISION]
    readiness_scope: [PRODUCTION_IMPLEMENTATION]
    risk_floor: R3_IMPLEMENTATION_READINESS_GATE


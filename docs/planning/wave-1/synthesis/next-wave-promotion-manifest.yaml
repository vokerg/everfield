version: 1
state: VERIFICATION_CANDIDATE
source_mission: W1-SYN-FINAL
activation_main_sha: RESOLVE_FROM_W1_CANON_01_SQUASH_SHA
issue_title_template: "[PLAN-v2][{mission_id}] {title}"
wave: 2
instantiated_candidate_count: 18
initial_ready_count: 12
max_instantiated: 24
max_initial_ready: 12
current_phase: PLANNING
production_implementation_authorized: false
canonical_dispatcher_remains: docs/planning/PLANNING-PROGRAM-v1.md
canonical_foundations_after_promotion:
  - docs/planning/WAVE-1-FOUNDATIONS-v1.md
  - docs/planning/WAVE-1-DEPENDENCY-MAP-v1.yaml
  - docs/planning/WAVE-2-PROMOTION-MANIFEST-v1.yaml
common:
  branch_rule: "Use planning/issue-N from current main after the concrete W1-CANON-01 activation SHA is satisfied."
  stopping_rule: "Commit useful state; update docs/planning/handoffs/issue-N.md; publish exact schema-3 terminal status with current branch head."
  forbidden_context: "Planning context not listed as authoritative input is forbidden-by-default unless a declared retrieval trigger is satisfied."
  integration_rule: "No artifact becomes canonical by authorship or PR existence; every main integration is squash-only and follows the declared review/verification route. PLANNING_EXPERIMENT code is non-production and may not become a production dependency without later verified promotion."
  planning_experiment_rules:
    disposable: true
    production_dependency_allowed: false
    production_content_authority: NONE
    engine_lock_in_authority: NONE
    requires_exact_evidence_question: true
    requires_bounded_owned_surface: true
    result_promotion_requires_evidence_predicate_and_review: true

missions:
  - mission_id: W2-AUTH-01
    title: Authority, evidence, and readiness compiler contract
    role: cross-domain protocol compiler planner
    priority_rank: 10
    task_class: PLANNING_RESEARCH
    decision_state: CANONICAL_CANDIDATE
    initial_state: READY
    objective: Specify and mechanically validate the singular TaskClaimContract → EvidenceRequirement → CheckPlan → ExecutionEvidenceEnvelope → EvidenceSatisfaction chain, ActiveDirectiveSet, ResourceCapabilityState, RiskFloor, ArtifactIdentity, and ImplementationReadinessLedger interfaces.
    hard_prerequisites: [W1-CANON-01_TERMINAL_BINDING]
    ownership_surface: docs/planning/wave-2/foundations/authority-evidence-contract.md
    conflict_keys: [wave2:authority-evidence-contract]
    authoritative_inputs: [docs/planning/WAVE-1-FOUNDATIONS-v1.md, docs/planning/WAVE-1-DEPENDENCY-MAP-v1.yaml, docs/planning/PLANNING-PROGRAM-v1.md]
    optional_retrieval_triggers: Earlier Wave 1 factory/technical synthesis only to trace a disputed field/provenance rule.
    output_paths: [docs/planning/wave-2/foundations/authority-evidence-contract.md]
    output_schema: proposal_research_v1
    evidence_requirements: Define closed machine schemas, compile direction, invalid-state examples, directive-vs-evidence cases, degraded trust cases, and a validator fixture set; no policy field may independently create empirical PASS.
    acceptance_criteria: Exact contract and fixtures exist; original evidence authority is singular; current master directive is represented without upgrading independence; readiness ledger compilation is deterministic; Review Index <=4000 UTF-8 chars; no production implementation.
    required_review: W2-REV-01
    downstream: [W2-ENG-03, W2-SIM-01, W2-REV-01]
    integration_rule: USE_COMMON
    evidence_targets: [IR-BLOCKER-EVIDENCE-FOUNDATION]
    readiness_scope: [PRODUCTION_IMPLEMENTATION]
    risk_floor: R2_CROSS_DOMAIN_AUTHORITY


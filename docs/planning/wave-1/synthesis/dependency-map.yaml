    - pattern: "^(W2-[A-Z0-9-]+)_REVIEW_READY$"
      resolves_to: {mission_capture: 1, kind: STATUS, state: REVIEW_READY}
    - pattern: "^(W2-[A-Z0-9-]+)_PASS_OR_CHANGES_REQUIRED$"
      resolves_to: {mission_capture: 1, kind: REVIEW_STATUS, disposition_in: [PASS_FOR_SYNTHESIS, CHANGES_REQUIRED]}
    - pattern: "^(W2-[A-Z0-9-]+)_VERIFICATION_READY$"
      resolves_to: {mission_capture: 1, kind: STATUS, state: VERIFICATION_READY}
  internal_pattern_target_mission_must_exist: true


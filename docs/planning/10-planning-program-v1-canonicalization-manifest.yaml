version: 3
state: REVIEWED_CANDIDATE_SUPPORT
bootstrap_remediation_issue: 14
candidate_path: docs/planning/10-planning-program-v1-final-bootstrap-candidate.md
dispositions_path: docs/planning/reviews/issue-5-reverification-finding-dispositions.md

supersedes_for_verification:
  - path: docs/planning/09-planning-program-v1-remediated-candidate.md
    blob_sha: 5e60d827ab99fe04e8a23c4addfc59d6f418d281
    state: SUPERSEDED_FOR_VERIFICATION
  - path: docs/planning/09-planning-program-v1-canonicalization-manifest.yaml
    blob_sha: 9ecad20d9332eb1b649dfcb16beece5cda3fa330
    state: SUPERSEDED_FOR_VERIFICATION

resource_constraint:
  mode: SINGLE_AGENT
  source_issue: 5
  source_comment_id: 5244416013
  trust_level: DEGRADED
  scope: BOOTSTRAP_AND_WAVE_1_UNTIL_CANONICALLY_SUPERSEDED
  reopen_condition: MULTI_AGENT_OR_ISOLATED_CONTEXT_AVAILABLE

verification_contract:
  verifier_issue: 5
  required_result: PASS
  allowed_independence_modes: [FULL_INDEPENDENT_CONTEXT, DEGRADED_SINGLE_AGENT]
  degraded_mode_requires_resource_constraint_comment_id: 5244416013
  bind:
    - candidate_work_sha
    - manifest_identity
    - adopted_wave_1_contract_blob_sha
    - verified_base_main_sha
    - verification_report_work_sha
    - verification_report_head_sha
    - simulation_artifact_blob_sha
    - independence_profile
  pass_forbidden_with_unresolved_severity: [BLOCKER, MAJOR]

canonical_binding:
  program_header_locator: Canonicalized by
  status_kind: INTEGRATION_STATUS
  required_canonicality: CANONICAL_PLANNING_PROGRAM
  validity:
    status_issue_must_equal_program_header_issue: true
    status_canonical_program_blob_sha_must_equal_current_program_blob_sha: true
    status_main_sha_must_be_ancestor_or_equal_current_main: true
    referenced_verification_and_squash_merge_must_be_valid: true
  selection: highest_comment_id_among_valid_bindings_for_same_program_blob
  zero_valid_bindings: BOUNDED_CANONICALIZATION_ACTIVATION_WINDOW
  current_head_equality_required_after_activation: false

bootstrap_bridge:
  issue_5:
    issue: 5
    mission_id: BOOTSTRAP-VERIFY-05
    branch: planning/issue-5
    legacy_predecessor:
      source_kind: STATUS
      source_state: HANDOFF_READY
      required_fields:
        - kind
        - issue
        - branch
        - state
        - remediation_issue
        - remediation_work_sha
        - remediation_head_sha
        - remediation_candidate
        - remediation_manifest
        - verified_base_main_sha
        - next_action
      constants:
        kind: STATUS
        issue: 5
        branch: planning/issue-5
        state: HANDOFF_READY
        remediation_issue: 14
        next_action: reverify_issue_14_payload
      selection: latest_matching_legacy_status_comment
    resume_kind: BOOTSTRAP_RESUME
    result_kind: BOOTSTRAP_VERIFICATION_STATUS
  issue_6:
    issue: 6
    mission_id: BOOTSTRAP-CANON-06
    branch: planning/issue-6
    claim_kind: CLAIM
    eligibility:
      required_issue_5_result_kind: BOOTSTRAP_VERIFICATION_STATUS
      required_issue_5_result: PASS
      current_main_must_equal_issue_5_verified_base_main_sha: true
    integration_verification_source_kinds: [BOOTSTRAP_VERIFICATION_STATUS]

bootstrap_canonicalization:
  issue: 6
  pre_merge_requirements:
    unresolved_blocker_major_forbidden: true
    merge_method: squash
    expected_head_required: true
    verified_base_compatibility_evidence_required: true
  program_promotion:
    source: docs/planning/10-planning-program-v1-final-bootstrap-candidate.md
    destination: docs/planning/PLANNING-PROGRAM-v1.md
    transform:
      type: exact_literal_replacements_then_byte_identical_remainder
      replacements:
        - from: "# Planning Program v1 — Final Bootstrap Candidate"
          to: "# Planning Program v1 — Canonical"
        - from: "**State:** REVIEWED-CANDIDATE-FINAL-BOOTSTRAP"
          to: "**State:** CANONICAL"
        - from: "**Bootstrap remediation issue:** #14"
          to: "**Canonicalized by:** Bootstrap Issue #6"
        - from: "**Authority:** NON-CANONICAL until Bootstrap Issue #5 records a valid PASS for this exact work state and Bootstrap Issue #6 performs the verified squash-only promotion and activation sequence."
          to: "**Authority:** CANONICAL planning operating model for the current pre-implementation PLANNING phase."
      all_other_bytes_identical: true
      every_from_literal_must_match_exactly_once: true
  agents_transform:
    source_path: AGENTS.md
    title_literal_replacement:
      from: "# AGENTS.md — Planning Bootstrap"
      to: "# AGENTS.md — Canonical Planning"
      match_count: 1
    section_replacements:
      - heading: "## Status"
        until_next_heading: "## Prime Directive"
        replacement: |
          ## Status

          This file governs Everfield's **pre-implementation PLANNING phase** and delegates normal planning dispatch to canonical `docs/planning/PLANNING-PROGRAM-v1.md` through `docs/planning/START-HERE.md`.

          Bootstrap planning artifacts are provenance after canonical activation. High-throughput gameplay implementation remains blocked until a later independently verified implementation-readiness decision.

      - heading: "## Current Phase"
        until_next_heading: "## Canonical Working Principles"
        replacement: |
          ## Current Phase

          The repository is in **PLANNING** mode under canonical Planning Program v1.

          Agents MUST NOT:

          - implement gameplay or begin high-throughput implementation before an explicit verified implementation-readiness transition;
          - choose an engine as an unreviewed assumption;
          - generate an unbounded implementation backlog;
          - treat current design hypotheses as permanently settled;
          - optimize for issue count, code volume, or a single quality metric.

          Agents SHOULD execute the bounded factory, technical, evaluation, and game-design planning missions selected by the canonical dispatcher, preserve evidence/provenance, and reopen assumptions when evidence requires it.

      - heading: "## Mandatory Cold-Start Entry Point"
        until_next_heading: "## Planning Work Output Rule"
        replacement: |
          ## Mandatory Cold-Start Entry Point

          A fresh agent with no prior conversation context MUST:

          1. Read this file.
          2. Read `docs/planning/START-HERE.md`.
          3. Read current canonical `docs/planning/PLANNING-PROGRAM-v1.md`.
          4. Parse its `Canonicalized by` issue reference and resolve the active canonical binding defined by the program.
          5. If the binding resolves, select/resume work from open `[PLAN-v1]` issues under the canonical dispatcher.
          6. If the binding does not yet resolve, execute only the named canonicalization issue's verified post-merge activation sequence; do not treat the inactive Wave 1 queue as a liveness failure.
          7. Never use prior chat history as project authority and never integrate into `main` except by squash merge.

          After a valid canonical binding exists, Bootstrap Issues #2-#6, #11, and #14 are provenance rather than the normal work queue.

    every_section_interval_must_match_exactly_once: true
  start_here_replacement:
    path: docs/planning/START-HERE.md
    content: |
      # START HERE — Canonical Planning Entry

      **Phase:** PLANNING  
      **Authority:** Entry pointer to canonical Planning Program v1.

      A fresh agent with no prior conversation context MUST:

      1. Read `/AGENTS.md`.
      2. Read current `docs/planning/PLANNING-PROGRAM-v1.md`.
      3. Parse the program header's `Canonicalized by` issue reference.
      4. Fetch that issue and resolve the program's active canonical binding: a valid terminal `INTEGRATION_STATUS` whose canonical-program blob equals the current program blob and whose activation `main_sha` is an ancestor of or equal to current `main`.
      5. If no valid binding exists, execute only that canonicalization issue's verified post-merge activation sequence; do not invoke normal liveness recovery for an inactive Wave 1 queue.
      6. If the binding resolves, query open `[PLAN-v1]` issues and derive eligibility, ownership, recovery, priority, context, output, review, and handoff state under the canonical program and schema-3 registry.
      7. Prefer resumable/recovery and review/revision/verification/integration work before new proposal work.
      8. Never use prior chat history as project authority.
      9. Never integrate into `main` except by squash merge.

      Bootstrap artifacts are provenance after active canonical binding resolution.
  post_merge_sequence:
    - obtain_squash_main_sha
    - verify_promoted_program_and_root_entry_transforms_at_that_sha
    - compute_canonical_program_blob_sha
    - load_adopted_wave_1_contract_sections_from_exact_blob
    - instantiate_exactly_23_wave_1_issues_with_activation_sha
    - validate_all_created_issue_contracts
    - post_mission_id_to_issue_number_mapping
    - post_schema_3_INTEGRATION_STATUS_with_canonical_program_blob
  wave_1_creation_before_merge: forbidden

wave_1_contract_adoption:
  source_path: docs/planning/08-planning-program-v1-canonicalization-manifest.yaml
  source_blob_sha: d7ba9d5e9f6afe6b83837f2da13831873a5b8ddd
  adopted_sections: [issue_compiler, universal_root_acceptance, wave_1, non_root_optional_retrieval, next_wave_candidate_schema]
  explicitly_not_adopted: [verification_contract, bootstrap_canonicalization]
  interpretation:
    activation_main_sha_placeholder_resolves_to_issue_6_squash_sha: true
    all_operational_comments_after_activation_use_schema_3: true
    common_stopping_rule_STATUS_means_registered_schema_3_STATUS: true
    issue_6_terminal_binding_required_before_root_READY: true

operational_capsules:
  protocol: planning-v1
  schema: 3
  authority_metadata:
    ordering: github_comment_id_ascending
    creation_time: github_server_created_at
    edit_detection: created_at_must_equal_updated_at
    body_timestamps_authoritative: false
    unknown_top_level_fields: invalid
    extensions_field_allowed: true
    extensions_authority_effect: none
    fields_non_null_by_default: true

  scalar_types:
    positive_integer: integer_greater_than_zero
    nonnegative_integer: integer_greater_than_or_equal_zero
    sha40: lowercase_or_uppercase_40_hex_git_object_id
    repo_path: nonempty_repo_relative_path_without_dotdot_or_leading_slash
    nonempty_string: utf8_string_length_1_to_4096
    session_id: utf8_string_length_1_to_256
    immutable_ref: sha40_or_github_workflow_artifact_id_or_exact_comment_id_or_repo_path_at_work_sha
    boolean: true_or_false

  field_types:
    protocol: {type: nonempty_string, constant: planning-v1}
    schema: {type: positive_integer, constant: 3}
    kind: {type: nonempty_string}
    issue: {type: positive_integer}
    mission_id: {type: nonempty_string, pattern: "^[A-Z0-9][A-Z0-9-]*$"}
    branch: {type: nonempty_string, pattern: "^planning/issue-[1-9][0-9]*$"}
    actor_session_id: {type: session_id}
    extensions: {type: map, optional: true}
    state: {type: nonempty_string}
    base_sha: {type: sha40}
    observed_head_sha: {type: sha40}
    observed_main_sha: {type: sha40}
    previous_ownership_comment_id: {type: positive_integer, nullable: true}
    observed_no_ownership_through_comment_id: {type: positive_integer}
    reason: {type: nonempty_string}
    source_comment_id: {type: positive_integer}
    source_status_comment_id: {type: positive_integer}
    winning_intent_comment_id: {type: positive_integer}
    recovery_reason: {type: nonempty_string}
    ownership_generation_comment_id: {type: positive_integer, nullable: true}
    progress_basis: {type: nonempty_string}
    evidence_refs: {type: list, element_type: immutable_ref}
    authority_mode: {type: nonempty_string}
    head_sha: {type: sha40, nullable: true}
    work_sha: {type: sha40}
    handoff_path: {type: repo_path}
    artifact_paths: {type: list, element_type: repo_path}
    acceptance_evidence_refs: {type: list, element_type: immutable_ref}
    candidate_work_sha: {type: sha40}
    manifest_identity: {type: sha40}
    result_code: {type: nonempty_string}
    superseded_by_issue_or_artifact: {type: nonempty_string}
    superseding_integration_status_comment_id: {type: positive_integer}
    external_authorization_comment_id: {type: positive_integer}
    remediation_issue_or_path: {type: nonempty_string}
    reviewed_work_shas: {type: list, element_type: sha40}
    disposition: {type: nonempty_string}
    findings_artifact: {type: repo_path}
    blocker_count: {type: nonnegative_integer}
    major_count: {type: nonnegative_integer}
    independence_profile: {type: structured, schema_ref: independence_profile}
    adopted_wave_1_contract_blob_sha: {type: sha40}
    verified_base_main_sha: {type: sha40}
    report_path: {type: repo_path}
    simulation_artifact_path: {type: repo_path}
    simulation_artifact_blob_sha: {type: sha40}
    result: {type: nonempty_string}
    verification_status_comment_id: {type: positive_integer}
    verified_candidate_work_sha: {type: sha40}
    verified_manifest_identity: {type: sha40}
    expected_pre_merge_head_sha: {type: sha40}
    pr_number: {type: positive_integer}
    main_sha: {type: sha40}
    merge_method: {type: nonempty_string}
    canonicality: {type: nonempty_string}
    canonical_program_blob_sha: {type: sha40, nullable: true}
    compatibility_evidence: {type: structured, schema_ref: compatibility_evidence}
    issue_mapping_comment_id: {type: positive_integer, nullable: true}
    activated_issue_count: {type: nonnegative_integer}
    legacy_predecessor_comment_id: {type: positive_integer}

  structured_types:
    independence_profile:
      discriminator: mode
      variants:
        FULL_INDEPENDENT_CONTEXT:
          required_fields:
            - mode
            - episode_id
            - cold_start_input_manifest_path
            - cold_start_input_manifest_blob_sha
            - candidate_edit_prohibited
            - prior_rationale_gate
            - trust_level
            - excluded_actor_session_ids
            - platform_context_id
          constants:
            mode: FULL_INDEPENDENT_CONTEXT
            candidate_edit_prohibited: true
            prior_rationale_gate: AFTER_INITIAL_EVIDENCE
            trust_level: FULL
          field_types:
            episode_id: session_id
            cold_start_input_manifest_path: repo_path
            cold_start_input_manifest_blob_sha: sha40
            excluded_actor_session_ids: list_of_session_id
            platform_context_id: nonempty_string
        DEGRADED_SINGLE_AGENT:
          required_fields:
            - mode
            - episode_id
            - cold_start_input_manifest_path
            - cold_start_input_manifest_blob_sha
            - candidate_edit_prohibited
            - prior_rationale_gate
            - trust_level
            - resource_constraint_comment_id
            - reopen_condition
          constants:
            mode: DEGRADED_SINGLE_AGENT
            candidate_edit_prohibited: true
            prior_rationale_gate: AFTER_INITIAL_EVIDENCE
            trust_level: DEGRADED
            resource_constraint_comment_id: 5244416013
            reopen_condition: MULTI_AGENT_OR_ISOLATED_CONTEXT_AVAILABLE
          field_types:
            episode_id: session_id
            cold_start_input_manifest_path: repo_path
            cold_start_input_manifest_blob_sha: sha40
            resource_constraint_comment_id: positive_integer
            reopen_condition: nonempty_string
    compatibility_evidence:
      discriminator: mode
      variants:
        EXACT_BASE_MATCH:
          required_fields: [mode, observed_pre_merge_main_sha]
          constants: {mode: EXACT_BASE_MATCH}
          field_types: {observed_pre_merge_main_sha: sha40}
        REVERIFIED_BASE_DRIFT:
          required_fields: [mode, evidence_comment_id, evidence_work_sha, evidence_path, covered_main_range]
          constants: {mode: REVERIFIED_BASE_DRIFT}
          field_types:
            evidence_comment_id: positive_integer
            evidence_work_sha: sha40
            evidence_path: repo_path
            covered_main_range: nonempty_string

  common_required_fields: [protocol, schema, kind, issue, mission_id, branch, actor_session_id]
  common_invariants:
    issue_must_match_issue_contract_or_verified_bootstrap_overlay: true
    mission_id_must_match_issue_contract_or_verified_bootstrap_overlay: true
    branch_must_equal_planning_issue_number: true
    referenced_git_objects_must_exist: true
    edited_comments_invalid: true
    unsupported_kind_invalid: true
    unknown_authority_fields_invalid: true
    null_only_where_field_type_declares_nullable: true
    invalid_comments_have_no_authority_effect: true

  kinds:
    CLAIM:
      required_fields: [state, base_sha, observed_head_sha, previous_ownership_comment_id]
      constants: {state: IN_PROGRESS, previous_ownership_comment_id: null}
      predecessor:
        derived_state: READY
        branch_existed_before_claim_attempt: false
      winner_rule: earliest_valid_claim_for_created_branch_and_observed_head
      authority_effect: new_ownership_generation

    BOOTSTRAP_RESUME:
      scope: bootstrap_issue_5_only
      required_fields: [state, base_sha, observed_head_sha, legacy_predecessor_comment_id, previous_ownership_comment_id]
      constants: {state: IN_PROGRESS, previous_ownership_comment_id: null}
      predecessor:
        must_match_bootstrap_bridge_issue_5_legacy_predecessor: true
        observed_head_must_equal_legacy_predecessor_head: true
      winner_rule: lowest_comment_id_among_valid_BOOTSTRAP_RESUME_for_same_legacy_predecessor_and_head
      authority_effect: new_ownership_generation

    ORPHAN_PROBE:
      required_fields: [observed_head_sha, observed_main_sha, observed_no_ownership_through_comment_id]
      predecessor: {branch_exists: true, valid_ownership_grant_exists: false}
      winner_rule: none_non_owning
      authority_effect: none
      maturity: {minimum_server_age_minutes: 10, invalid_if_later_valid_owner_exists: true}

    RESUME_INTENT:
      required_fields: [reason, source_comment_id, observed_head_sha]
      enums: {reason: [HANDOFF, STALE, ORPHAN]}
      predecessor_by_reason:
        HANDOFF: {source_kind: STATUS, source_state: HANDOFF_READY}
        STALE: {source_kind: [CLAIM, BOOTSTRAP_RESUME, RESUME, RECOVER, PROGRESS], source_condition: lease_expired_and_no_later_completion_or_handoff}
        ORPHAN: {source_kind: ORPHAN_PROBE, source_condition: mature_probe_and_no_later_owner}
      validity:
        current_head_equals_observed_head: true
        source_condition_still_holds_at_creation: true
      winner_rule: lowest_comment_id_for_same_source_and_head
      authority_effect: none

    RESUME:
      required_fields: [state, base_sha, observed_head_sha, previous_ownership_comment_id, winning_intent_comment_id, source_status_comment_id]
      constants: {state: IN_PROGRESS}
      predecessor: {winning_intent_reason: HANDOFF, source_kind: STATUS, source_state: HANDOFF_READY}
      validity:
        actor_session_equals_winning_intent_actor: true
        winning_intent_is_lowest_valid: true
        current_head_equals_observed_head: true
        only_first_valid_grant_for_intent: true
      authority_effect: new_ownership_generation

    RECOVER:
      required_fields: [state, recovery_reason, base_sha, observed_head_sha, previous_ownership_comment_id, winning_intent_comment_id, source_comment_id]
      constants: {state: IN_PROGRESS}
      enums: {recovery_reason: [STALE, ORPHAN]}
      predecessor_by_reason:
        STALE: {winning_intent_reason: STALE, source_condition: referenced_owner_is_stale}
        ORPHAN: {winning_intent_reason: ORPHAN, source_condition: referenced_probe_is_mature}
      validity:
        actor_session_equals_winning_intent_actor: true
        winning_intent_is_lowest_valid: true
        source_condition_still_holds: true
        current_head_equals_observed_head: true
        only_first_valid_grant_for_intent: true
      authority_effect: new_ownership_generation

    PROGRESS:
      required_fields: [state, ownership_generation_comment_id, observed_head_sha, progress_basis, evidence_refs]
      constants: {state: IN_PROGRESS}
      enums: {progress_basis: [HEAD_ADVANCE, EVIDENCE]}
      predecessor: {current_valid_unexpired_owner_required: true}
      validity:
        ownership_generation_equals_current_owner: true
        current_head_equals_observed_head: true
        HEAD_ADVANCE_requires_new_head_since_prior_renewal: true
        EVIDENCE_requires_nonempty_immutable_evidence_refs: true
        maximum_consecutive_EVIDENCE_without_head_advance: 3
      authority_effect: renew_current_lease_only

    STATUS:
      required_fields: [state, authority_mode, ownership_generation_comment_id, head_sha]
      enums:
        state: [HANDOFF_READY, REVIEW_READY, VERIFICATION_READY, DONE, SUPERSEDED, INVALIDATED]
        authority_mode: [OWNER, EXTERNAL]
      conditional_authority:
        OWNER:
          ownership_generation_comment_id_nullable: false
          head_sha_nullable: false
          current_valid_unexpired_owner_required: true
          ownership_generation_equals_current_owner: true
          current_branch_head_equals_head_sha: true
        EXTERNAL:
          allowed_states: [SUPERSEDED, INVALIDATED]
          ownership_generation_comment_id_must_be_null: true
          head_sha_may_be_null_only_when_branch_absent: true
          required_fields: [external_authorization_comment_id]
          external_authorization_must_be_valid_REVIEW_STATUS_or_INTEGRATION_STATUS: true
      conditional_state_fields:
        HANDOFF_READY: [work_sha, handoff_path]
        REVIEW_READY: [work_sha, artifact_paths, acceptance_evidence_refs]
        VERIFICATION_READY: [candidate_work_sha, manifest_identity, artifact_paths]
        DONE: [work_sha, result_code, evidence_refs]
        SUPERSEDED: [superseded_by_issue_or_artifact, reason]
        INVALIDATED: [reason, remediation_issue_or_path]
      work_binding:
        when_work_sha_present_work_sha_must_be_ancestor_or_equal_head_sha: true
      authority_effect: recorded_task_state

    REVIEW_STATUS:
      required_fields: [state, ownership_generation_comment_id, head_sha, work_sha, reviewed_work_shas, disposition, findings_artifact, blocker_count, major_count, independence_profile]
      enums:
        state: [DONE, INVALIDATED]
        disposition: [PASS_FOR_SYNTHESIS, CHANGES_REQUIRED, INVALIDATED]
      validity:
        current_valid_unexpired_owner_required: true
        ownership_generation_equals_current_owner: true
        current_branch_head_equals_head_sha: true
        work_sha_ancestor_or_equal_head_sha: true
        findings_artifact_must_exist_at_work_sha: true
        independence_profile_must_validate: true
      transition_constraints:
        PASS_FOR_SYNTHESIS: {required_state: DONE}
        CHANGES_REQUIRED: {required_state: DONE}
        INVALIDATED: {required_state: INVALIDATED}
      downstream_effect:
        PASS_FOR_SYNTHESIS: declared_synthesis_may_become_ready
        CHANGES_REQUIRED: declared_synthesis_revision_may_become_ready
        INVALIDATED: only_declared_recovery_or_replanning_may_become_ready

    VERIFICATION_STATUS:
      required_fields: [state, ownership_generation_comment_id, head_sha, work_sha, result, candidate_work_sha, manifest_identity, adopted_wave_1_contract_blob_sha, verified_base_main_sha, report_path, simulation_artifact_path, simulation_artifact_blob_sha, blocker_count, major_count, independence_profile]
      constants: {state: DONE}
      enums: {result: [PASS, FAIL]}
      validity:
        current_valid_unexpired_owner_required: true
        ownership_generation_equals_current_owner: true
        current_branch_head_equals_head_sha: true
        work_sha_ancestor_or_equal_head_sha: true
        report_and_simulation_artifact_exist_at_work_sha: true
        candidate_manifest_adopted_blob_match_exact_payload: true
        independence_profile_must_validate: true
        PASS_requires_blocker_count_zero: true
        PASS_requires_major_count_zero: true
      downstream_effect: {PASS: declared_canonicalization_may_become_ready, FAIL: only_bounded_remediation_may_become_ready}

    BOOTSTRAP_VERIFICATION_STATUS:
      scope: bootstrap_issue_5_only
      required_fields: [state, ownership_generation_comment_id, head_sha, work_sha, result, candidate_work_sha, manifest_identity, adopted_wave_1_contract_blob_sha, verified_base_main_sha, report_path, simulation_artifact_path, simulation_artifact_blob_sha, blocker_count, major_count, independence_profile, legacy_predecessor_comment_id]
      constants: {state: DONE}
      enums: {result: [PASS, FAIL]}
      validity:
        ownership_generation_must_reference_winning_BOOTSTRAP_RESUME: true
        current_valid_unexpired_owner_required: true
        current_branch_head_equals_head_sha: true
        work_sha_ancestor_or_equal_head_sha: true
        legacy_predecessor_matches_bootstrap_bridge: true
        report_and_simulation_artifact_exist_at_work_sha: true
        candidate_manifest_adopted_blob_match_exact_payload: true
        independence_profile_must_validate: true
        PASS_requires_blocker_count_zero: true
        PASS_requires_major_count_zero: true
      downstream_effect: {PASS: bootstrap_issue_6_may_become_ready, FAIL: only_bounded_remediation_may_become_ready}

    INTEGRATION_STATUS:
      required_fields: [state, ownership_generation_comment_id, head_sha, work_sha, verification_status_comment_id, verified_candidate_work_sha, verified_manifest_identity, verified_base_main_sha, expected_pre_merge_head_sha, pr_number, main_sha, merge_method, canonicality, canonical_program_blob_sha, compatibility_evidence, issue_mapping_comment_id, activated_issue_count]
      constants: {state: DONE, merge_method: squash}
      enums: {canonicality: [CANONICAL_PLANNING_PROGRAM, CANONICAL_PLANNING_UPDATE, NON_CANONICAL_PROVENANCE]}
      validity:
        current_valid_unexpired_owner_required: true
        ownership_generation_equals_current_owner: true
        current_task_branch_head_equals_head_sha: true
        work_sha_ancestor_or_equal_head_sha: true
        expected_pre_merge_head_equals_merged_PR_head: true
        pr_number_must_identify_squash_merge_that_created_main_sha: true
        compatibility_evidence_must_validate: true
        main_sha_is_result_of_pr_squash_merge: true
        verification_source_kind_allowed_by_issue_contract_or_bootstrap_overlay: true
        referenced_verification_result_is_valid_PASS: true
        canonical_program_blob_sha_required_non_null_for_canonicality_CANONICAL_PLANNING_PROGRAM: true
        canonical_program_blob_sha_must_exist_at_main_sha_when_non_null: true
        issue_6_CANONICAL_PLANNING_PROGRAM_requires_activated_issue_count_23: true
        issue_6_CANONICAL_PLANNING_PROGRAM_requires_non_null_issue_mapping_comment_id: true
      authority_effect: terminal_integration_and_canonical_binding_record

transition_table:
  new_issue:
    BLOCKED_to_READY: derived_when_hard_prerequisites_satisfied
    READY_to_IN_PROGRESS: winning_CLAIM
  bootstrap_issue_5:
    legacy_HANDOFF_READY_to_IN_PROGRESS: winning_BOOTSTRAP_RESUME
    IN_PROGRESS_to_DONE_PASS_or_FAIL: BOOTSTRAP_VERIFICATION_STATUS
  orphan_branch:
    branch_without_owner_to_probe: ORPHAN_PROBE
    mature_probe_to_intent: RESUME_INTENT_ORPHAN
    winning_intent_to_IN_PROGRESS: RECOVER_ORPHAN
  intentional_handoff:
    IN_PROGRESS_to_HANDOFF_READY: STATUS_OWNER_HANDOFF_READY
    HANDOFF_READY_to_intent: RESUME_INTENT_HANDOFF
    winning_intent_to_IN_PROGRESS: RESUME
  stale_owner:
    IN_PROGRESS_to_STALE_OWNER: derived_on_lease_expiry
    STALE_OWNER_to_intent: RESUME_INTENT_STALE
    winning_intent_to_IN_PROGRESS: RECOVER_STALE
  active_owner:
    renew: PROGRESS
    producer_complete: STATUS_OWNER_REVIEW_READY
    final_synthesis_complete: STATUS_OWNER_VERIFICATION_READY
    intentional_yield: STATUS_OWNER_HANDOFF_READY
  review_task:
    complete_pass: REVIEW_STATUS_DONE_PASS_FOR_SYNTHESIS
    complete_changes: REVIEW_STATUS_DONE_CHANGES_REQUIRED
    invalidate: REVIEW_STATUS_INVALIDATED_INVALIDATED
  verification_task: {pass: VERIFICATION_STATUS_DONE_PASS, fail: VERIFICATION_STATUS_DONE_FAIL}
  integration_task: {terminal_after_squash: INTEGRATION_STATUS_DONE}
  external_retirement: {supersede: STATUS_EXTERNAL_SUPERSEDED, invalidate: STATUS_EXTERNAL_INVALIDATED}

mutation_fence:
  before_every_task_branch_mutation:
    - refetch_valid_operational_comments
    - verify_current_ownership_generation_and_unexpired_lease
    - fetch_remote_branch_head
    - require_remote_head_equals_proposed_commit_parent
    - create_commit_with_exact_parent
    - update_branch_ref_force_false_only
    - abort_on_mismatch_or_non_fast_forward

verification_scenarios_required:
  - simultaneous_new_claimants
  - legacy_issue_5_bootstrap_resume_competition
  - branch_created_then_claim_comment_crash
  - mature_orphan_competing_recovery_intents
  - intentional_handoff_competing_resume_intents
  - stale_owner_continues_after_recovery
  - stale_reviewer_or_verifier_attempts_terminal_status
  - malformed_wrong_type_illegal_null_unknown_kind_edited_capsules
  - external_retirement_of_never_claimed_work
  - review_PASS_CHANGES_REQUIRED_INVALIDATED_routing
  - domain_synthesis_REVIEW_READY_vs_final_VERIFICATION_READY
  - degraded_single_agent_independence_profile
  - context_budget_unknown_window_fallback
  - no_READY_liveness
  - mechanical_root_phase_transition
  - post_merge_pre_terminal_activation_window
  - canonical_binding_after_later_unrelated_main_merge
  - canonical_binding_superseded_by_later_program_version
  - main_advances_after_PASS_before_issue_6_merge
  - pre_activation_wave_1_claim
  - squash_only_integration

next_wave_governor:
  max_new_issues: 24
  max_initial_ready: 12
  compiler_checks: [unique_mission_ids, acyclic_hard_dependencies, no_output_path_collisions, ownership_conflict_validation, required_review_routes, activation_prerequisites]
  excess_candidates_state: DEFERRED
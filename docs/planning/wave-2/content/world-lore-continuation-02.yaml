world_structures:
  - id: WORLD02:CULTIVATION-MARGIN
    source_interface: WORLD_IFACE:CULTIVATION-MARGIN
    dimensions:
      productive_use_state: [ACTIVE, RECOVERING, FALLOW, DISPUTED]
      water_condition: [ADEQUATE, STRESSED, VARIABLE, UNKNOWN]
      habitat_continuity: [CONNECTED, FRAGMENTED, RESTORING, UNKNOWN]
      access_pressure: [LOW, MODERATE, HIGH, DISPUTED]
    unresolved: [crop_identity, ownership, yield, seasonal_timing]
    hooks: [SOCIAL_ROLE:LAND-USE-STAKE, CHAR_ROLE:LOCAL-USER, NARR_ROLE:LAND-USE-CONSEQUENCE]

  - id: WORLD02:COMMONS-EDGE
    source_interface: WORLD_IFACE:COMMONS-EDGE
    dimensions: [physical_condition, permitted_use_claims, observed_use, ecological_pressure, maintenance_burden]
    authority_rule: USE_OR_STANDING_NEVER_IMPLIES_OWNERSHIP_OR_LEGITIMACY
    unresolved: [custodian, quota, ownership, species_catalog, closure_schedule]
    hooks: [SOCIAL_ROLE:COMMONS-STAKE, CHAR_ROLE:LOCAL-USER, NARR_ROLE:ACCESS-CONSEQUENCE]

  - id: WORLD02:OUTER-CONNECTION
    source_interface: WORLD_IFACE:OUTER-CONNECTION
    evidence_types: [OBJECT_PROVENANCE, TRAFFIC_TRACE, REPAIR_TRACE, CLAIM, BRANCH_LOCAL_OBSERVATION]
    forbidden_inference: [route_timetable, travel_duration, neighboring_polity, trade_monopoly, route_safety_guarantee]
    hooks: [SOCIAL_ROLE:PUBLIC-WORKS-STAKE, CHAR_ROLE:LOCAL-USER, NARR_ROLE:ACCESS-CONSEQUENCE]

  - id: WORLD02:WATER-DEPENDENCY
    source_interface: WORLD_IFACE:WATER-DEPENDENCY
    layers: [PHYSICAL_OBSERVATION, PRACTICAL_DEPENDENCY, ENTITLEMENT_OR_CAUSE_CLAIM, PRIVATE_OR_SPECIALIZED_INTERPRETATION]
    authority_rule: PHYSICAL_FACT_AND_SOCIAL_ENTITLEMENT_ARE_ORTHOGONAL
    unresolved: [capacity, seasonal_cycle, timed_scarcity]
    hooks: [SOCIAL_ROLE:WATER-DEPENDENT-USER, CHAR_ROLE:LOCAL-USER, NARR_ROLE:WORKS-CHOICE]

  - id: WORLD02:SHARED-WORKS-JUNCTION
    source_interface: WORLD_IFACE:SHARED-WORKS-JUNCTION
    operability_states: [SERVICEABLE, DEGRADED, PARTIAL, UNKNOWN]
    repair_trace_append_only: true
    access_state_is_information_authority: false
    burden_trace_auto_attribution: false
    hooks: [SOCIAL_ROLE:PUBLIC-WORKS-STAKE, CHAR_ROLE:HISTORY-INTERPRETER, NARR_ROLE:WORKS-CHOICE]

  - id: WORLD02:HISTORY-TRACE
    source_interface: WORLD_IFACE:HISTORY-TRACE
    entry_classes: [OBSERVED_TRACE, DATED_RELATIVE, CLAIMED_ATTRIBUTION, INTERPRETATION, ABSENCE_RECORD]
    contradictory_attributions_allowed: true
    claim_or_interpretation_mutates_history: false
    hooks: [CHAR_ROLE:HISTORY-INTERPRETER, NARR_ROLE:CONSEQUENCE-WITNESS]

  - id: WORLD02:SETTLEMENT-CORE
    source_interface: LOC:SETTLEMENT-CORE
    affordances: [BASELINE_MOVEMENT, ORDINARY_COMMUNITY_INTERACTION, PUBLIC_INFORMATION, ADJACENT_WORLD_INTERFACE_REFERENCE]
    unresolved: [institution_identity, private_access, faction_control, office_holding, population, ownership, polity]
    hooks: [SOCIAL_ROLE:PUBLIC-WORKS-STAKE, CHAR_ROLE:LOCAL-USER, NARR_ROLE:CONSEQUENCE-WITNESS]

  - id: WORLD02:AFTERMATH-SURFACE
    source_interface: WORLD_ROLE:CONT_AFTERMATH_SURFACE
    selection_state: OPEN_BOUNDED_SET
    compatible_interfaces:
      - WORLD_IFACE:WATER-DEPENDENCY
      - WORLD_IFACE:SHARED-WORKS-JUNCTION
      - WORLD_IFACE:COMMONS-EDGE
      - WORLD_IFACE:CULTIVATION-MARGIN
      - WORLD_IFACE:HISTORY-TRACE
      - WORLD_IFACE:OUTER-CONNECTION
    required_record_fields:
      - affected_interface_refs
      - observable_physical_delta
      - persistence_or_reversibility
      - recovery_or_mitigation_evidence
      - branch_scope
      - authority_class
    authority_classes: [PROPOSED, BRANCH_FACT, OBJECTIVE_FACT]
    irreversible_requires: [BranchImpactEvidence, PRECOMMITMENT_SIGNALING, MEANINGFUL_CONTINUED_PLAY, ALTERNATIVE_GOALS_OR_CONTENT, REVIEW]


composition_rules:
  root_artifacts_are_immutable_provenance: true
  fanin_may_define_aliases_and_bindings: true
  fanin_may_rewrite_root_records: false
  only_uniquely_supported_bindings_may_be_exact: true
  ambiguous_bindings_must_remain_set_or_unresolved: true
  binding_does_not_promote_authority: true
  binding_does_not_create_canonical_content: true
  objective_fact_authority_remains_world_owned: true
  social_claim_authority_never_promotes_objective_truth: true
  character_knowledge_never_follows_from_player_exposure_or_relationship_state: true
  narrative_exposure_never_promotes_truth: true
  generated_presentation_never_mutates_authoritative_state: true
  exact_calendar_values_may_not_be_invented: true
  exact_game_time_policy_remains_deferred: true
  exact_semantic_graph_version_remains_deferred: true
  wsn_result_state_may_not_be_changed_here: true

binding_kinds:
  EXACT: One reviewed target uniquely satisfies the source role semantics for this fan-in scope.
  COMPOSITE: Multiple reviewed target IDs jointly implement one source interface without implying equivalence among them.
  SET: More than one reviewed target is materially compatible; no single concrete target is selected.
  STRUCTURAL: The source role binds to a reviewed structural contract, quest role, gate, branch family, or interface rather than a concrete entity.
  UNRESOLVED: Reviewed inputs intentionally or materially do not support a safe concrete mapping.


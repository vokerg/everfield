information_authority_reconciliation:
  objective_fact_owner: WORLD_FACT_RECORD_ONLY_WITH_REVIEWED_AUTHORITY
  layers:
    - layer: WORLD_OBJECTIVE_OR_CONSTRAINT
      records: [facts, chronology, world_rules]
      rule: Candidate objective/constraint authority is preserved exactly; NOT_CANONICAL remains.
    - layer: WORLD_PROPOSITION_OR_CLAIM
      records: [propositions, in_world_claims]
      rule: Proposition presence or claim confidence cannot create or mutate a facts record.
    - layer: SOCIAL_CLAIM_BELIEF
      records: [SocialClaimBelief]
      rule: objective_fact_authority MUST remain false; external fact refs may only point to separately reviewed world facts and do not transfer authority.
    - layer: CHARACTER_INFORMATION
      records: [information_records, information_record_patches]
      rule: Character truth status and holder access remain local candidate semantics; relationship state, shared role, generated text, or player exposure cannot grant access or objective truth.
    - layer: NARRATIVE_KNOWLEDGE_EXPOSURE
      records: [knowledge_model, discovery_roles]
      rule: Exposure and discovery remain orthogonal to truth; generated presentation cannot mutate authoritative state.
  cross_layer_rules:
    - A social claim may bind to a world proposition or fact reference only through an explicit fan-in binding; truth_relation remains UNKNOWN unless the target reviewed fact logically determines it.
    - A character belief may be narratively presented without becoming a world fact.
    - A character SECRET with CHARACTER_CANDIDATE_FACT_ONLY is not automatically a world objective fact and cannot settle world mysteries.
    - Player discovery never implies that every character knows the discovered information.
    - Shared provisional roles never grant knowledge or disclosure permission.
    - Branch-specific knowledge must carry a compatible branch predicate before exposure.

chronology_reconciliation:
  world_order:
    eras: [ERA:PRE-WORKS, ERA:WORKS-BUILDOUT, ERA:PATCHWORK-PRESENT]
    event_order: [EVT:WORKS-BUILDOUT, EVT:WORKS-FRAGMENTATION, EVT:PATCHWORK-PRESENT-START, EVT:PLAYER-ENTRY]
    exact_calendar_deferred: true
  narrative_boundary:
    player_entry_ref: EVT:PLAYER-ENTRY
    first_story_surface_refs: [ARC_ROLE:ORIENTATION, BEAT_ROLE:INVITATION]
    rule: Narrative story-state progression is at or after EVT:PLAYER-ENTRY unless a record is explicitly typed as retrospective evidence.
  character_history:
    event_refs: [REL_EVT:anwen_selka_uncertainty_dispute, REL_EVT:jori_maelin_unasked_support, REL_EVT:jori_oren_joint_attempt, REL_EVT:maelin_selka_burden_objection]
    exact_world_event_positions: UNRESOLVED_BY_REVIEWED_INPUTS

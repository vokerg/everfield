  version: 1
  foundational_gate_count: 0
  social_gates:
    - {gate_id: GATE-SOC-COMMONS-DELEGATION-01, gate_class: SPECIALIZATION}
    - {gate_id: GATE-SOC-FIELDWARD-SHARED-STOCK-01, gate_class: SPECIALIZATION}
    - {gate_id: GATE-SOC-MAKERS-COMMISSION-01, gate_class: OPTIONAL}
    - {gate_id: GATE-SOC-ARCHIVE-SENSITIVE-01, gate_class: OPTIONAL}
    - {gate_id: GATE-SOC-WAYKEEPER-SPONSOR-01, gate_class: OPTIONAL}
    - {gate_id: GATE-SOC-COALITION-COMMITMENT-01, gate_class: BRANCH_EXCLUSIVE}
  narrative_gates:
    - {gate_id: GATE:NARR:DEEP_HISTORY_INQUIRY, gate_class: OPTIONAL}
    - {gate_id: GATE:NARR:TRUSTED_TESTIMONY_ACCESS, gate_class: SPECIALIZATION}
    - {gate_id: GATE:NARR:PUBLIC_COMMITMENT, gate_class: BRANCH_EXCLUSIVE}
    - {gate_id: GATE:NARR:RECONCILIATION_ROUTE, gate_class: OPTIONAL}
    - {gate_id: GATE:NARR:AFTERMATH_LEADERSHIP, gate_class: SPECIALIZATION}
  composition_rules:
    - No social or narrative gate becomes FOUNDATIONAL merely because another root references its content.
    - GATE-SOC-COALITION-COMMITMENT-01 and GATE:NARR:PUBLIC_COMMITMENT remain distinct gates; they may share an explicit branch instance but are not aliases.
    - Baseline ordinary community interaction, repair/crafting, cultivation, movement/exploration, public information, mutual aid, and foundational shared gameplay remain legal without satisfying any gate in this fan-in packet.
    - Sensitive testimony may have relationship or record substitutes; relationship state alone never grants secret access.
    - Branch-exclusive gates require pre-commitment consequence signaling and reviewed alternative-content sufficiency before any permanent or high-impact use.
    - Gate routes retain explicit recovery/substitute semantics and may not be collapsed into a single dominant standing score.

branch_reconciliation:
  social_branches:
    ids: [SOC-BRANCH-COMMON-USE-01, SOC-BRANCH-DISCLOSURE-01, SOC-BRANCH-ACCESS-01, SOC-BRANCH-AID-01]
    permanence_authorized_here: false
  narrative_families:
    - id: BRANCH_FAMILY:PUBLIC_ALIGNMENT
      high_impact: true
      reversibility: CONDITIONALLY_REVERSIBLE
    - id: BRANCH_FAMILY:COMMONS_TRANSFORMATION
      high_impact: true
      reversibility: IRREVERSIBLE
    - id: BRANCH_FAMILY:DISCLOSURE_OR_WITHHOLDING
      high_impact: true
      reversibility: CONDITIONALLY_REVERSIBLE
  bindings:
    - source_ref: SOC-BRANCH-DISCLOSURE-01
      kind: STRUCTURAL
      target_refs: [BRANCH_FAMILY:DISCLOSURE_OR_WITHHOLDING]
      rule: Social disclosure branch can instantiate this family only with explicit audience, exposure, history, and branch-effect records.
    - source_ref: SOC-BRANCH-COMMON-USE-01
      kind: SET
      target_refs: [BRANCH_FAMILY:PUBLIC_ALIGNMENT, BRANCH_FAMILY:COMMONS_TRANSFORMATION]
      rule: Ordinary common-use disagreement is not automatically irreversible; COMMONS_TRANSFORMATION requires an explicit high-impact consequence contract.
    - source_ref: SOC-BRANCH-ACCESS-01
      kind: UNRESOLVED
      target_refs: []
      rule: Access changes remain bounded social state unless a later reviewed narrative branch contract explicitly elevates them.
    - source_ref: SOC-BRANCH-AID-01
      kind: UNRESOLVED
      target_refs: []
      rule: Aid choices remain bounded social consequence by default and do not require a high-impact narrative branch.
  invariants:
    - Social branch permanence remains unauthorized.
    - Narrative irreversible consequences require branch impact and observable pre-commitment signaling.
    - Restored access or relationships may change current dimensions but cannot erase meaningful history.
    - Where restoration is impossible, compensation_or_alternative_goal_refs are required.
    - Every high-impact branch preserves at least one meaningful continued goal and shared foundational gameplay route.
    - Branch facts, social claims, character knowledge, and narrative exposure require compatible branch scope before composition.


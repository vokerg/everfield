relationship_and_history_reconciliation:
  social_relationship_dimensions: [trust, reliability, reciprocity, value_alignment, public_standing, access_state]
  character_relationship_dimensions: [TRUST, WARMTH, RESPECT, OBLIGATION, RIVALRY, CAUTION]
  universal_scalar_allowed: false
  dimension_aliases:
    - {social: trust, character: TRUST, relation: RELATED_NOT_IDENTICAL}
    - {social: reliability, character: null, relation: DISTINCT_SOCIAL_EVIDENCE_DIMENSION}
    - {social: reciprocity, character: OBLIGATION, relation: RELATED_NOT_IDENTICAL}
    - {social: value_alignment, character: null, relation: DISTINCT_ISSUE_SPECIFIC_DIMENSION}
    - {social: public_standing, character: null, relation: DISTINCT_PUBLIC_SOCIAL_DIMENSION}
    - {social: access_state, character: null, relation: DERIVED_ACCESS_NOT_AFFECTION}
    - {social: null, character: WARMTH, relation: DISTINCT_INTERPERSONAL_DIMENSION}
    - {social: null, character: RESPECT, relation: DISTINCT_INTERPERSONAL_DIMENSION}
    - {social: null, character: RIVALRY, relation: DISTINCT_INTERPERSONAL_DIMENSION}
    - {social: null, character: CAUTION, relation: DISTINCT_INTERPERSONAL_DIMENSION}
  history_rules:
    - SocialHistoryEvent and REL_EVT records preserve meaningful history after recovery.
    - Current dimensions may change only with typed cause/evidence; history itself remains.
    - Repeated low-risk actions cannot satisfy all social or character dimensions.
    - Public standing cannot substitute for private trust, character knowledge, confidentiality permission, or objective truth.
    - Character relationship changes do not automatically alter faction standing and faction standing does not automatically alter character relationships.

originality_and_generation_boundary:
  external_fictional_expression_adopted: false
  root_originality_boundaries_preserved: true
  later_specific_reference_requires: [purpose, provenance, originality_review, rights_review_where_applicable]
  generated_content:
    build_time_authority: CANDIDATE_ONLY
    runtime_direct_canonical_mutation_allowed: false
    authoritative_effect_requires_validated_command_or_effect: true
    grounding_failure: DECLARED_FALLBACK_OR_INCONCLUSIVE
    generation_never_promotes_claim_to_objective_fact: true

wsn_evidence_bindings:
  source_map_blob_sha: e4f4e964f9b972ebbc22700c7b0a4e23b1c97593
  result_state_for_all: UNRUN_REQUIRED_EVIDENCE
  experiments:
    WSN-E1:
      title: Contradiction injection
      fanin_surfaces: [cross_root_bindings, chronology_reconciliation, information_authority_reconciliation, branch_reconciliation]
      required_attack: Inject contradictory world/social/character/narrative records and verify fail-closed authority, chronology, and branch compatibility.
    WSN-E2:
      title: Knowledge/secret leakage
      fanin_surfaces: [information_authority_reconciliation, relationship_and_history_reconciliation, quest_fanin_bindings]
      required_attack: Attempt knowledge transfer through player exposure, relationship state, faction standing, shared role, testimony, or generated prose and verify no unauthorized leak/promotion.
    WSN-E3:
      title: Quest solvability search
      fanin_surfaces: [quest_fanin_bindings, progression_gate_reconciliation, branch_reconciliation]
      required_attack: Search representative route/objective graphs for accidental cycles, mutually exclusive requirements, missing substitutes, and legal failure/recovery gaps.
    WSN-E4:
      title: NPC schedule conflict simulation
      fanin_surfaces: [chronology_reconciliation, quest_fanin_bindings]
      required_attack: This packet provides role/time-window constraints only; execution remains blocked until concrete schedule instances exist and MUST remain NOT_RUN meanwhile.
    WSN-E5:
      title: Branching consequence persistence
      fanin_surfaces: [branch_reconciliation, relationship_and_history_reconciliation, quest_fanin_bindings]
      required_attack: Verify high-impact branch facts, lost content, alternatives, mitigation, relationship/history persistence, and migration obligations across branch transitions.
    WSN-E6:
      title: Generated-content grounding tournament
      fanin_surfaces: [originality_and_generation_boundary, information_authority_reconciliation, quest_fanin_bindings]
      required_attack: Generated candidates must remain grounded to reviewed refs, fail closed on missing grounding, and never gain direct authoritative mutation rights.
    WSN-E7:
      title: Semantic-sameness audit
      fanin_surfaces: [cross_root_bindings, progression_gate_reconciliation, relationship_and_history_reconciliation]
      required_attack: Detect aliases or generated variants that erase meaningful route, relationship, actor, branch, or consequence distinctions.
    WSN-E8:
      title: Long-horizon social/NPC simulation
      fanin_surfaces: [relationship_and_history_reconciliation, branch_reconciliation, quest_fanin_bindings]
      required_attack: Test durable history, recovery, long-horizon branch alternatives, actor diversity, and non-degenerate social trajectories without assuming one dominant route.
    WSN-E9:
      title: Narrative critic disagreement calibration
      fanin_surfaces: [information_authority_reconciliation, branch_reconciliation, originality_and_generation_boundary, quest_fanin_bindings]
      required_attack: Calibrate disagreement on truth/claim separation, branch significance, consequence quality, and originality without converting critic consensus into canon or objective truth.


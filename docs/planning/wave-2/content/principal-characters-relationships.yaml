    role_summary: witness_mobility_advocate
    candidate_identity_facts:
      - FACT:tomas_values_mobility
      - FACT:tomas_risks_using_mobility_to_avoid_commitment
    motivations:
      - retain freedom of movement
      - make information useful without being owned by one interest
      - expose narrow perspectives presented as universal certainty
    needs:
      - accept one bounded durable responsibility without surrendering mobility
      - preserve provenance and context when carrying testimony
    capabilities:
      - bridge separated knowledge scopes
      - introduce alternative witnesses routes or resources when siblings support them
      - bring conflicting accounts into comparison
    limitations:

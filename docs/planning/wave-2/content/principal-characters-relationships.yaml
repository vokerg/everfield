    role_summary: coordinator_legitimacy_advocate
    candidate_identity_facts:
      - FACT:selka_values_defensible_decisions
      - FACT:selka_risks_procedural_overcentralization
    motivations:
      - make decisions defensible after immediate pressure passes
      - preserve legitimacy under conflicting interests
      - prevent informal power from becoming invisible rule
    needs:
      - recognize that procedural fairness can still impose unequal harm
      - share authority when consequence evidence warrants it
    capabilities:

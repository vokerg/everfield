  - character_id: CHAR:maelin_sor
    display_name_candidate: Maelin Sor
    role_summary: caretaker_reciprocal_obligation_advocate
    candidate_identity_facts:
      - FACT:maelin_values_durable_mutual_support
      - FACT:maelin_risks_absorbing_unbounded_burden
    motivations:
      - make mutual support durable rather than exceptional
      - prevent people being reduced to productivity or faction utility
      - preserve memory of who carried burdens
    needs:
      - set limits without treating them as abandonment
      - support agency rather than overprotect through silence
    capabilities:

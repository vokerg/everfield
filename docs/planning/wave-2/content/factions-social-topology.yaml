social_information_model:
  schema_version: 1
  record_type: SocialClaimBelief
  purpose: Represent in-world social claims and beliefs without conflating objective truth, perspective, exposure, dispute, provenance, or branch applicability.
  required_fields: [claim_id, holder_ref, source_refs, proposition_ref, authority_status, holder_epistemic_state, dispute_status, knowledge_state, exposure_scope, confidentiality, provenance_refs, branch_scope, objective_fact_ref, truth_relation, objective_fact_authority]
  holder_ref_types: [FAC-*, COM-*, CHAR_ROLE:*]
  proposition_ref_types: [PROP_ROLE:*]
  objective_fact_ref_types: [WORLD_FACT_ROLE:*]
  authority_status_values: [TESTIMONY, INSTITUTIONAL_RECORD, RUMOR, ANALYSIS, DISPUTED_RECORD]
  holder_epistemic_state_values: [ASSERTS, BELIEVES, DOUBTS, WITHHOLDS, UNKNOWN]
  dispute_status_values: [UNCONTESTED_CLAIM, DISPUTED, CORROBORATION_PENDING, RETRACTED]
  knowledge_state_values: [HELD_BY_SOURCE, KNOWN_TO_HOLDER, DISCLOSED_TO_PLAYER, NOT_DISCLOSED_TO_PLAYER]
  exposure_scope_values: [PUBLIC, INSTITUTIONAL, PRIVATE, SECRET]
  confidentiality_values: [NONE, BOUNDED_ROLE, SOURCE_RESTRICTED, SECRET_RESTRICTED]
  truth_relation_values: [UNKNOWN_TO_SOCIAL_ROOT, EXTERNALLY_BOUND_CONSISTENT, EXTERNALLY_BOUND_CONTRADICTED]
  branch_scope_semantics: null means branch-independent claim applicability; otherwise a NARR_BRANCH_ROLE:* provisional ref is required
  objective_fact_authority_rule: objective_fact_authority MUST remain false in this social root. objective_fact_ref may only bind a separately reviewed external fact and does not transfer authority to the social claim.
  promotion_forbidden: true
  examples:
    - claim_id: SOC-CLM-EXAMPLE-001
      holder_ref: FAC-COMMONS-01
      source_refs: [FAC-COMMONS-01]
      proposition_ref: PROP_ROLE:SOCIAL_PUBLIC_WORK_RELIABILITY
      authority_status: INSTITUTIONAL_RECORD
      holder_epistemic_state: ASSERTS
      dispute_status: UNCONTESTED_CLAIM
      knowledge_state: DISCLOSED_TO_PLAYER
      exposure_scope: PUBLIC
      confidentiality: NONE
      provenance_refs: [SOCIAL_HISTORY_EVENT_ROLE:PUBLIC_WORK]
      branch_scope: null
      objective_fact_ref: null
      truth_relation: UNKNOWN_TO_SOCIAL_ROOT
      objective_fact_authority: false
    - claim_id: SOC-CLM-EXAMPLE-002
      holder_ref: FAC-ARCHIVE-01
      source_refs: [CHAR_ROLE:COMMUNITY_NEIGHBOR]
      proposition_ref: PROP_ROLE:SOCIAL_DISCLOSURE_DISPUTE
      authority_status: DISPUTED_RECORD
      holder_epistemic_state: DOUBTS
      dispute_status: DISPUTED
      knowledge_state: HELD_BY_SOURCE
      exposure_scope: PRIVATE
      confidentiality: SOURCE_RESTRICTED
      provenance_refs: [SOCIAL_HISTORY_EVENT_ROLE:TESTIMONY]
      branch_scope: NARR_BRANCH_ROLE:SOCIAL_DISPUTE
      objective_fact_ref: WORLD_FACT_ROLE:EXTERNAL_REVIEWED_FACT
      truth_relation: UNKNOWN_TO_SOCIAL_ROOT
      objective_fact_authority: false

  - id: ARC_ROLE:RECKONING
    purpose: confront commitments with evidence and affected parties
    required_exit_obligations:
      - branch_impact_evaluated
      - claims_remain_separate_from_objective_truth
  - id: ARC_ROLE:AFTERMATH
    purpose: preserve meaningful play after major choices
    required_exit_obligations:
      - alternative_goals_or_reviewed_exception


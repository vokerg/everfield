progression_gates:
  version: 1
  foundational_gate_count: 0
  gates:
    - gate_id: GATE:NARR:DEEP_HISTORY_INQUIRY
      gate_class: OPTIONAL
      blocks_or_unlocks:
        - optional historical interpretation content
      requirements:
        - discovery route eligibility
      routes:
        - route_id: ROUTE:NARR:HISTORY:PUBLIC
          route_kind: KNOWLEDGE
          prerequisite_refs:
            - DISC_ROLE:PUBLIC_RECORD
          lifestyle_impacts: []
        - route_id: ROUTE:NARR:HISTORY:WITNESS
          route_kind: RELATIONSHIP
          prerequisite_refs:
            - CHAR_ROLE:LOCAL_WITNESS
          lifestyle_impacts: []
        - route_id: ROUTE:NARR:HISTORY:MATERIAL
          route_kind: SUBSTITUTE
          prerequisite_refs:
            - DISC_ROLE:MATERIAL_TRACE
          lifestyle_impacts: []
      visibility_or_discovery:
        - optional route hints may be incomplete but not deceptive about foundational status
      miss_failure_recovery: remain optional; other gameplay remains legal
      branch_scope: null
      evidence_requirements:
        - WSN-E2
        - WSN-E3
      exception_rationale: null
    - gate_id: GATE:NARR:TRUSTED_TESTIMONY_ACCESS
      gate_class: SPECIALIZATION
      blocks_or_unlocks:
        - perspective-specific testimony and relationship content
      requirements:
        - relationship or substitute evidence route
      routes:
        - route_id: ROUTE:NARR:TESTIMONY:RELATIONSHIP
          route_kind: RELATIONSHIP
          prerequisite_refs:
            - CHAR_ROLE:LOCAL_WITNESS
          lifestyle_impacts: []
        - route_id: ROUTE:NARR:TESTIMONY:RECORD
          route_kind: KNOWLEDGE
          prerequisite_refs:
            - DISC_ROLE:PUBLIC_RECORD
          lifestyle_impacts: []
      visibility_or_discovery:
        - route class is legible before commitment
      miss_failure_recovery: use substitute record/evidence route or skip specialized content
      branch_scope: null
      evidence_requirements:
        - WSN-E2
        - WSN-E3
      exception_rationale: null
    - gate_id: GATE:NARR:PUBLIC_COMMITMENT
      gate_class: BRANCH_EXCLUSIVE
      blocks_or_unlocks:
        - commitment-specific consequences and aftermath content
      requirements:
        - material tradeoffs exposed
      routes:
        - route_id: ROUTE:NARR:COMMIT:DECLARE
          route_kind: QUEST
          prerequisite_refs:
            - QROLE:COMMIT_TO_PROJECT
          lifestyle_impacts:
            - branch-specific content changes
        - route_id: ROUTE:NARR:COMMIT:DEFER
          route_kind: SUBSTITUTE
          prerequisite_refs:
            - STATE:NARRATIVE:CONTEST_RECOGNIZED
          lifestyle_impacts:
            - preserves uncommitted route temporarily
      visibility_or_discovery:
        - affected-goal and irreversibility class signaled before selection
      miss_failure_recovery: defer if supported; post-commit recovery follows branch contract
      branch_scope: BRANCH_FAMILY:PUBLIC_ALIGNMENT
      evidence_requirements:
        - WSN-E3
        - WSN-E5
      exception_rationale: null
    - gate_id: GATE:NARR:RECONCILIATION_ROUTE
      gate_class: OPTIONAL
      blocks_or_unlocks:
        - repair or reframing content
      requirements:
        - prior consequence exists
      routes:
        - route_id: ROUTE:NARR:RECONCILE:REPAIR
          route_kind: SERVICE
          prerequisite_refs:
            - QROLE:REPAIR_OR_REFRAME
          lifestyle_impacts: []
        - route_id: ROUTE:NARR:RECONCILE:DISCLOSE
          route_kind: KNOWLEDGE
          prerequisite_refs:
            - DISC_ROLE:PLAYER_OBSERVATION
          lifestyle_impacts: []
      visibility_or_discovery:
        - recovery route availability is observable when material
      miss_failure_recovery: consequence remains; alternative aftermath goals remain
      branch_scope: null
      evidence_requirements:
        - WSN-E3
        - WSN-E5
      exception_rationale: null
    - gate_id: GATE:NARR:AFTERMATH_LEADERSHIP
      gate_class: SPECIALIZATION
      blocks_or_unlocks:
        - leadership/stewardship aftermath goals
      requirements:
        - aftermath state and relevant branch
      routes:
        - route_id: ROUTE:NARR:AFTERMATH:PROJECT
          route_kind: DIRECT_SYSTEM
          prerequisite_refs:
            - QROLE:AFTERMATH_AMBITION
          lifestyle_impacts: []
        - route_id: ROUTE:NARR:AFTERMATH:SERVICE
          route_kind: SERVICE
          prerequisite_refs:
            - STATE:NARRATIVE:AFTERMATH_ENTERED
          lifestyle_impacts: []
      visibility_or_discovery:
        - specialization status explicit
      miss_failure_recovery: alternative aftermath goal families remain
      branch_scope: null
      evidence_requirements:
        - WSN-E3
        - WSN-E8
      exception_rationale: null


      - policy_context
      - pause_scale_semantics
      - accessibility_timing_alternatives
      - opening_predicate
      - closing_predicate
      - retry_recovery
      - evidence_scenario_refs
  fixtures:
    - window_id: TIME_WINDOW:WITNESS_AVAILABILITY
      clock_domain: CALENDAR
      policy_context: gameplay_world
      pause_scale_semantics: DELEGATE_TO_BOUND_GAME_TIME_POLICY
      accessibility_timing_alternatives:
        - alternate appointment or non-timed evidence route must be supported for required content
      opening_predicate: PROVISIONAL
      closing_predicate: PROVISIONAL
      retry_recovery: alternate cycle or substitute evidence route
      evidence_scenario_refs:
        - WSN-E3
        - WSN-E8
    - window_id: TIME_WINDOW:CONSEQUENCE_RESPONSE
      clock_domain: SIMULATION
      policy_context: gameplay_world
      pause_scale_semantics: DELEGATE_TO_BOUND_GAME_TIME_POLICY
      accessibility_timing_alternatives:
        - response window semantics must preserve declared accessibility timing policy
      opening_predicate: PROVISIONAL
      closing_predicate: PROVISIONAL
      retry_recovery: consequence-specific; cannot soft-lock foundational gameplay
      evidence_scenario_refs:
        - WSN-E3
        - WSN-E5

consequence_contract:
  version: 1
  reversibility_classes:
    - REVERSIBLE
    - CONDITIONALLY_REVERSIBLE
    - IRREVERSIBLE
  required_fields:
    - consequence_id
    - trigger_ref
    - affected_domain_state_refs
    - preconditions
    - effect_operations
    - reversibility
    - reversal_route
    - persistence_migration_obligation
    - observability
    - downstream_dependencies
    - branch_impact_ref
    - compensation_or_alternative_goal_refs
  invariants:
    - prose_does_not_perform_state_transition
    - irreversible_requires_branch_impact
    - restoration_may_preserve_history
    - consequence_state_must_survive_save_migration_when_authoritative

branch_families:
  - id: BRANCH_FAMILY:PUBLIC_ALIGNMENT
    high_impact: true
    reversibility: CONDITIONALLY_REVERSIBLE
    affected_goal_classes:
      - relationship access
      - perspective-specific narrative goals
    unavailable_content_obligation: enumerate at fan-in
    alternative_goal_obligation:
      - at least one non-aligned route to shared foundational gameplay
      - at least one meaningful continued narrative goal
    recovery_or_compensation: branch-specific repair, deferral, or alternative affiliation route
    signaling_obligation: affected-goal and relationship consequences legible before commitment
    long_horizon_scenario_refs:
      - WSN-E5
      - WSN-E8
  - id: BRANCH_FAMILY:COMMONS_TRANSFORMATION
    high_impact: true
    reversibility: IRREVERSIBLE
    affected_goal_classes:
      - world project access
      - maintenance/stewardship goals
      - location or service availability
    unavailable_content_obligation: enumerate displaced content at fan-in
    alternative_goal_obligation:
      - transformation-specific projects
      - maintenance or mitigation goals
      - at least one unrelated long-horizon goal remains
    recovery_or_compensation: no world-state rollback by default; mitigation/compensation routes required
    signaling_obligation: irreversibility and foreseeable lost opportunities signaled
    long_horizon_scenario_refs:
      - WSN-E5
      - WSN-E8
  - id: BRANCH_FAMILY:DISCLOSURE_OR_WITHHOLDING
    high_impact: true
    reversibility: CONDITIONALLY_REVERSIBLE
    affected_goal_classes:
      - knowledge exposure
      - relationship/trust content
      - testimony availability
    unavailable_content_obligation: enumerate perspective-specific content changes
    alternative_goal_obligation:
      - evidence-gathering path
      - repair/reframing path
      - at least one continued aftermath goal
    recovery_or_compensation: correction/disclosure may change exposure but cannot erase history
    signaling_obligation: disclosure audience and likely relationship effects legible
    long_horizon_scenario_refs:
      - WSN-E2
      - WSN-E5

semantic_graph_interface:
  contract_type: GameSemanticGraph
  graph_version: PROVISIONAL_BIND_AT_FANIN_OR_EVIDENCE
  required_node_families:
    - goals
    - verbs
    - knowledge
    - relationships
    - gates
    - content_families
    - consequences
  required_edge_types:
    - REQUIRES
    - ENABLES
    - REVEALS
    - SUBSTITUTES
    - CONFLICTS
    - CHANGES
  edge_invariants:
    - semantic_value_ref_required_for_evidence_edge
    - raw_edge_count_not_quality
  coverage_obligations:
    - routes
    - branches
    - transitions
    - named_trajectories

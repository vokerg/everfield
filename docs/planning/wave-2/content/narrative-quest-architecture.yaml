solvability_obligations:
  - references_exist_and_types_match
  - required_objective_graph_has_no_accidental_cycle
  - every_required_predicate_has_supported_route
  - mutually_exclusive_branches_not_jointly_required
  - role_unavailability_has_substitution_or_legal_failure_recovery
  - timed_window_has_legal_completion_window_under_bound_policy
  - terminal_transitions_terminate_or_monotonically_progress
  - effects_and_rewards_reference_valid_state
  - irreversible_consequence_has_branch_impact
  - incompatible_branch_facts_do_not_leak

generation_boundary:
  build_time_candidate_authority: CANDIDATE_ONLY
  runtime_presentation_only_mutates_authoritative_state: false
  runtime_canonical_effect_direct_mutation_allowed: false
  runtime_canonical_effect_requires_validated_command_effect: true
  accepted_outcome_persistence_required: true
  outage_or_grounding_failure: DECLARED_FALLBACK_OR_INCONCLUSIVE
  originality_reference_policy_required: true

evidence_debt:
  WSN-E1: UNRUN_REQUIRED_EVIDENCE
  WSN-E2: UNRUN_REQUIRED_EVIDENCE
  WSN-E3: UNRUN_REQUIRED_EVIDENCE
  WSN-E4: UNRUN_REQUIRED_EVIDENCE
  WSN-E5: UNRUN_REQUIRED_EVIDENCE
  WSN-E6: UNRUN_REQUIRED_EVIDENCE
  WSN-E7: UNRUN_REQUIRED_EVIDENCE
  WSN-E8: UNRUN_REQUIRED_EVIDENCE
  WSN-E9: UNRUN_REQUIRED_EVIDENCE

assumptions:
  - fixture quest roles provide useful structural coverage without forming a final catalog
  - provisional sibling roles can be resolved at fan-in without producer cross-editing
  - high-impact choices can retain meaningful alternative goals at tractable content cost
  - exact timing can remain deferred while timed-window semantics are typed
  - narrative participation can be first-class without becoming universal foundational progression

reopen_conditions:
  - provisional roles cannot resolve without mutable sibling dependency
  - representative quests require unvalidated cycles or opaque custom handlers
  - quest state search misses common softlocks
  - scoped narrative gates compose into de_facto_foundational_progression
  - knowledge_claim_model cannot express disputed_or_unreliable_history
  - high_impact_branches_hollow_out_continued_play
  - time_policy_binding_cannot_model_intended_accessible_windows
  - consequence_persistence_or_migration_is_unsound
  - structural_validation_drives_fake_choice_or_blandness
  - originality_or_generation_controls_are_insufficient

self_review:
  target_findings:
    blocker: 0
    major: 0
    correction_requiring_minor: 0
  checks:
    owned_paths_only: true
    mutable_sibling_outputs_consumed: false
    engine_selected: false
    foundational_narrative_gates_authored: false
    failure_retry_recovery_explicit: true
    knowledge_truth_exposure_separate: true
    exact_time_values_authored: false
    irreversible_branches_bind_impact: true
    wsn_evidence_marked_pass: false
    authority_inflation: false

downstream:
  required_fresh_root_review: true
  clean_review_may_unlock: W2-CONTENT-SYN-01
  content_fanin_authority_now: false
  vertical_slice_now: false

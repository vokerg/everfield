strings:
  OW_WORLD_TITLE:
    surface: scene_title
    text: "The Old Works"
  OW_WORLD_SUBTITLE:
    surface: scene_subtitle
    text: "Inherited channels, patched routes, unfinished arguments."
  OW_WORLD_ENTRY:
    surface: entry_cue
    text: "Old stone, newer timber, and repairs from more than one hand meet in the same working yard. Nothing here explains itself in one layer."
  OW_WORLD_ROUTE_CUE:
    surface: traversal_cue
    text: "The ledger table, exposed repair seam, hearing space, and project table all face the same inherited works."

  OW_ARCHIVE_TITLE:
    surface: public_record_title
    text: "Archive Ledger"
  OW_ARCHIVE_PROMPT:
    surface: public_record_prompt
    text: "Read the public record."
  OW_ARCHIVE_BODY_01:
    surface: public_record_body
    text: "The surviving entries agree that coordinated upkeep broke apart. They do not agree that one cause explains why."
  OW_ARCHIVE_BODY_02:
    surface: public_record_body
    text: "One recorded account argues for a single dominant cause. Another rejects that reading. Both remain recorded as accounts, not findings."
  OW_ARCHIVE_BODY_03:
    surface: public_record_body
    text: "Later pages list local repairs, bypasses, and changed uses without resolving the older dispute."
  OW_ARCHIVE_EXIT:
    surface: public_record_exit
    text: "The ledger gives you claims and a sequence of changes—not a verdict. Compare it with something independent, or leave the conclusion open."

  OW_TRACE_TITLE:
    surface: material_trace_title
    text: "Material Trace"
  OW_TRACE_PROMPT:
    surface: material_trace_prompt
    text: "Inspect the repair seam."
  OW_TRACE_BODY_01:
    surface: material_trace_body
    text: "A dressed stone channel continues beneath a later timber crossing. Their wear patterns do not match exactly."
  OW_TRACE_BODY_02:
    surface: material_trace_body
    text: "Several fasteners and braces were added after the surrounding surface had already weathered. Some older fixing points are empty."
  OW_TRACE_BODY_03:
    surface: material_trace_body
    text: "The trace supports a history of alteration and repeated maintenance. It does not identify a single cause for the fragmentation."
  OW_TRACE_EXIT:
    surface: material_trace_exit
    text: "This is independent material evidence within the inspected surface, not proof of either account."

  OW_DEFER_TITLE:
    surface: truth_deferral_title
    text: "Leave the Cause Open"
  OW_DEFER_PROMPT:
    surface: truth_deferral_prompt
    text: "Record that the evidence is insufficient for a final conclusion."
  OW_DEFER_RESULT:
    surface: truth_deferral_result
    text: "You can act on the present condition without pretending the old dispute is settled."

  OW_ENV_CHANNEL_PATCHWORK:
    surface: environment
    text: "Old channel edge; later patch; another repair over that."
  OW_ENV_BYPASS:
    surface: environment
    text: "A capped opening sits beside a narrower working bypass."
  OW_ENV_REUSED_FITTING:
    surface: environment
    text: "A reused fitting carries marks from more than one placement."
  OW_ENV_LEDGER_TO_TRACE:
    surface: environment
    text: "The ledger records repairs in general; the seam shows one place where change is physically visible."
  OW_ENV_TRACE_TO_HEARING:
    surface: environment
    text: "From the repair seam, the hearing space remains in view: observation can travel into debate without becoming a verdict."
  OW_ENV_HEARING_TO_PROJECT:
    surface: environment
    text: "The project table is close enough to the works to make tradeoffs concrete, but no repair plan answers the historical mystery by itself."


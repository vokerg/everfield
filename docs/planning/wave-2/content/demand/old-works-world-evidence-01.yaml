location_presentation:
  working_name: The Old Works
  scope: VS:OLD-WORKS-ACCOUNTS-01_ONLY
  identity: >-
    A compact working yard where inherited stone channels, timber walkways,
    patched housings, reused fittings, and newer braces show continued use,
    bypass, repair, and repurposing without identifying one original layer or
    one final historical cause.
  material_cues:
    - inherited_stone_channel
    - later_timber_crossing
    - layered_braces_and_fasteners
    - capped_opening_and_working_bypass
    - reused_fitting_with_multiple_placement_marks
  forbidden_implications:
    - final_owner
    - final_custodian
    - final_polity
    - exact_calendar_date
    - single_original_purpose
    - universal_restoration_preference
    - single_resolved_fragmentation_cause


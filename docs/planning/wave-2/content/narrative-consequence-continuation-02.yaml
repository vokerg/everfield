        objective_id: OBJ_CONT02:SELECT_RESPONSE_PORTFOLIO
        minimum_simultaneously_legal_materially_differentiated_response_families: 2
        enforcement_phase: PRE_OBJECTIVE_ACTIVATION_AND_AFTER_RECOVERY
        underflow_transition: STATE_CONT02:PRE_RESPONSE_DEFERRED
        underflow_before_objective_activation: true
      each_selectable_response_requires:
        - AFFECTED_GOAL_OR_CONTENT_CLASSES

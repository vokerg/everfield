      route_cardinality_ref: QFAM_CONT02:TRACE_CAUSAL_ACCOUNTS.route_cardinality
      routes:
        - route_id: ROUTE:NARR-CONT02:TRACE:PUBLIC_MATERIAL
          route_kind: KNOWLEDGE
          prerequisite_refs:

        private_context_counts: false
        enforcement_phase: PRE_OBJECTIVE_ACTIVATION_AND_AFTER_RECOVERY
        underflow_transition: STATE_CONT02:PRE_TRACE_DEFERRED
        underflow_before_objective_activation: true
      recovery:

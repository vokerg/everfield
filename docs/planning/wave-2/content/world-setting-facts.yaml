    statement: A bounded watershed can support sufficient gameplay/content variety before external regions are frozen.
    evidence_state: UNPROVEN_DESIGN_ASSUMPTION
    reopen_on: REVIEW_OR_WSN_EVIDENCE_FAILURE
  - id: ASM:WORLD-02
    statement: Cross-location consequences can remain player-legible when observable signals and causal edges are explicit.
    evidence_state: UNPROVEN_DESIGN_ASSUMPTION
    reopen_on: WSN_EVIDENCE_OR_PLAY_EVIDENCE_FAILURE
  - id: ASM:WORLD-03
    statement: Relative chronology is sufficient for this root before exact GameTimePolicy mapping.
    evidence_state: BOUNDED_PLANNING_ASSUMPTION
    reopen_on: DOWNSTREAM_CHRONOLOGY_DEPENDENCY
  - id: ASM:WORLD-04
    statement: Sibling roots can consume typed role/location IDs without final names or ownership assignments.

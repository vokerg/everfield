mysteries:
  - id: MYS:FRAGMENTATION-CAUSE
    authority: UNKNOWN_BY_DESIGN
    question: Why did coordinated operation of the inherited works fragment?
    allowed_invention:
      - local_evidence
      - incomplete_records
      - conflicting_accounts
      - multiple_contributing_pressures
    forbidden_resolution:
      - single_global_catastrophe_as_fact
      - named_final_villain_or_faction_as_cause
      - supernatural_cause_as_fact
      - technological_cause_as_fact
  - id: MYS:WORKS-ORIGINAL-PURPOSE
    authority: UNKNOWN_BY_DESIGN
    question: Were all inherited works built for the functions current residents assign to them?
    allowed_invention: [repurposing_evidence, layered_modifications, partial_records]
    forbidden_resolution: [single_master_builder_civilization, lost_utopia_as_fact]
  - id: MYS:SEASONAL-ANOMALIES
    authority: UNKNOWN_BY_DESIGN
    question: Which unusual seasonal observations are ordinary ecology and which imply another ontology, if any?
    allowed_invention: [repeatable_observation_without_cause, conflicting_interpretation]
    forbidden_resolution: [canonical_magic_system, gods_as_fact, aliens_as_fact, simulation_twist_as_fact, no_supernatural_possible_as_fact]
  - id: MYS:OUTER-CONNECTIONS
    authority: UNKNOWN_BY_DESIGN
    question: What systems and places exist beyond the bounded watershed?
    allowed_invention: [evidence_of_exchange, travel, information_flow, obligations]
    forbidden_resolution: [final_neighboring_polities, final_external_regions, imported_sibling_factions]


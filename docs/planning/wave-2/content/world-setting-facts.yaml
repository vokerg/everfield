chronology:
  eras:
    - id: ERA:PRE-WORKS
      authority: CANDIDATE_OBJECTIVE
      description: Landscape and human/community use before the coordinated inherited works.
    - id: ERA:WORKS-BUILDOUT
      authority: CANDIDATE_OBJECTIVE
      description: Period in which connected shared infrastructure was established or substantially coordinated.
    - id: ERA:PATCHWORK-PRESENT
      authority: CANDIDATE_OBJECTIVE
      description: Current period of maintained, improvised, repurposed, abandoned, and contested systems.
  events:
    - id: EVT:WORKS-BUILDOUT
      authority: CANDIDATE_OBJECTIVE
      knowledge: DISCOVERABLE
      era: ERA:WORKS-BUILDOUT
      event_type: INFRASTRUCTURE_HISTORY
      exact_cause_frozen: false
    - id: EVT:WORKS-FRAGMENTATION
      authority: CANDIDATE_OBJECTIVE
      knowledge: DISCOVERABLE
      era: ERA:WORKS-BUILDOUT
      event_type: MAINTENANCE_ORDER_CHANGE
      exact_cause_frozen: false
    - id: EVT:PATCHWORK-PRESENT-START
      authority: CANDIDATE_OBJECTIVE
      knowledge: SYSTEM_ONLY
      era: ERA:PATCHWORK-PRESENT
      event_type: PERIOD_BOUNDARY
      exact_cause_frozen: false
    - id: EVT:PLAYER-ENTRY
      authority: PROVISIONAL_INTERFACE
      knowledge: NOT_APPLICABLE
      era: ERA:PATCHWORK-PRESENT
      event_type: NARRATIVE_INTERFACE
      exact_cause_frozen: false
  precedes:
    - [ERA:PRE-WORKS, EVT:WORKS-BUILDOUT]
    - [EVT:WORKS-BUILDOUT, EVT:WORKS-FRAGMENTATION]
    - [EVT:WORKS-FRAGMENTATION, EVT:PATCHWORK-PRESENT-START]
    - [EVT:PATCHWORK-PRESENT-START, EVT:PLAYER-ENTRY]

world_rules:
  - id: WR-01
    authority: CANDIDATE_CONSTRAINT
    rule: Material world effects propagate only through declared causal/state dependencies.
  - id: WR-02
    authority: CANDIDATE_CONSTRAINT
    rule: Shared works use multi-state condition/function rather than a universal repaired boolean.
  - id: WR-03
    authority: CANDIDATE_CONSTRAINT
    rule: Resource-relevant world state must be able to represent bounded use, regeneration, stewardship, substitution, or access change where materially relevant.
  - id: WR-04
    authority: CANDIDATE_CONSTRAINT
    rule: Seasonal condition changes do not change stable logical location identity.
  - id: WR-05
    authority: CANDIDATE_CONSTRAINT
    rule: Important consequences bind cause, affected IDs, branch scope, reversibility, and observable signal.
  - id: WR-06
    authority: CANDIDATE_CONSTRAINT
    rule: In-world claims and generated prose do not become objective truth without explicit validated fact authority.
  - id: WR-07
    authority: CANDIDATE_CONSTRAINT
    rule: Restoring inherited works is not intrinsically or universally the preferred outcome.
  - id: WR-08
    authority: CANDIDATE_CONSTRAINT
    rule: Permanent mutually exclusive world branches require explicit downstream content and evidence support.


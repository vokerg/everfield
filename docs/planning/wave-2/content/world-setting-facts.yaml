world_promise:
  candidate_id: WORLD_PROMISE:STEWARDSHIP_WATERSHED
  authority: CANDIDATE_CONSTRAINT
  branch: BRANCH:BASELINE
  statement: >-
    A lived-in watershed of settlements, cultivated spaces, commons, routes, habitat,
    and inherited shared works where care, use, repair, restraint, and neglect can create
    legible cross-location consequences without implying one universal prosperity meter.
  thematic_axes:
    - stewardship_vs_extraction
    - repair_vs_repurpose_vs_release
    - public_memory_vs_partial_history
    - local_benefit_vs_shared_consequence
    - continuity_vs_change
  forbidden_shortcuts:
    - conquest_of_empty_frontier_as_default
    - restore_every_old_system_as_universal_good
    - one_global_prosperity_score
    - final_engine_specific_representation
    - copied_reference_game_expression


checkable_invariants:
  - id: INV:ALL-FACTS-TYPED
    predicate: every facts[] record has id,type,authority,knowledge,branch,subject_refs,predicate,value,source_basis
  - id: INV:CHRONOLOGY-ACYCLIC
    predicate: chronology.precedes forms a directed acyclic graph
  - id: INV:CORE-TRIANGLE
    predicate: topology contains LOC:SETTLEMENT-CORE, LOC:CULTIVATION-MOSAIC, LOC:RIPARIAN-CORRIDOR and edges connecting all three through declared relations
  - id: INV:UPSTREAM-DOWNSTREAM
    predicate: LOC:UPLAND-CATCHMENT has a directed causal path to LOC:RIPARIAN-CORRIDOR
  - id: INV:OLD-WORKS-CROSS-ZONE
    predicate: LOC:OLD-WORKS has declared edges affecting at least two distinct functional zones
  - id: INV:OUTER-INTERFACE
    predicate: LOC:OUTER-THRESHOLD is reachable from LOC:SETTLEMENT-CORE and remains PROVISIONAL_INTERFACE or explicitly reviewed successor state
  - id: INV:MYSTERY-NOT-OBJECTIVE
    predicate: no mystery record is simultaneously resolved by a CANDIDATE_OBJECTIVE fact in this packet
  - id: INV:NO-SIBLING-CONCRETE-BINDING
    predicate: provisional_roles have no concrete faction, character, or narrative entity IDs in this packet
  - id: INV:NO-ENGINE-TYPE-AUTHORITY
    predicate: no world fact identity depends on engine scene, asset, editor, component, or runtime-specific type
  - id: INV:NO-PROSE-PASS
    predicate: no WSN-E1..WSN-E9 experiment is marked PASS or SATISFIED by this packet
  - id: INV:ORIGINALITY-BOUNDARY
    predicate: no external reference game's protected names, characters, locations, quest lines, dialogue, or expressive content are adopted as world facts


quest:
  quest_template_id: QUEST:VS:OLD-WORKS-ACCOUNTS-01
  version: 1
  quest_role_sequence:
    - QROLE:INVESTIGATE_CONFLICTING_ACCOUNTS
    - QROLE:NEGOTIATE_SHARED_USE
    - QROLE:COMMIT_TO_PROJECT
    - QROLE:REPAIR_OR_REFRAME
  availability:
    entry_predicates:
      - narrative_state_at_or_after: EVT:PLAYER-ENTRY
      - location_reachable_ref: LOC:OLD-WORKS
    forbidden_hidden_predicates:
      - UNIVERSAL_RELATIONSHIP_SCORE
      - FOUNDATIONAL_NARRATIVE_GATE
      - UNBOUND_GAME_TIME_POLICY
      - CONCRETE_NPC_SCHEDULE
  progression_gate_refs:
    - gate_id: GATE:NARR:DEEP_HISTORY_INQUIRY
      version: 1
      gate_class: OPTIONAL
    - gate_id: GATE:NARR:TRUSTED_TESTIMONY_ACCESS
      version: 1
      gate_class: SPECIALIZATION
    - gate_id: GATE:NARR:PUBLIC_COMMITMENT
      version: 1
      gate_class: BRANCH_EXCLUSIVE
    - gate_id: GATE:NARR:RECONCILIATION_ROUTE
      version: 1
      gate_class: OPTIONAL
  objectives:
    - objective_id: OBJ:VS:PUBLIC-RECORD
      role: DISC_ROLE:PUBLIC_RECORD
      required: true
      completion: review_public_record_material_for_old_works
    - objective_id: OBJ:VS:TOMAS-WITNESS
      role: DISC_ROLE:WITNESS_ACCOUNT
      actor_ref: CHAR:tomas_irel
      required: false
      completion: obtain_contextual_testimony_or_use_substitute_evidence
    - objective_id: OBJ:VS:MATERIAL-TRACE
      role: DISC_ROLE:MATERIAL_TRACE
      location_ref: LOC:OLD-WORKS
      required: false
      completion: inspect_independent_material_trace
    - objective_id: OBJ:VS:ANWEN-PRIVATE-PROVENANCE
      role: DISC_ROLE:PRIVATE_TESTIMONY
      actor_ref: CHAR:anwen_rell
      information_ref: INFO:anwen_contested_record_provenance_gap
      required: false
      access_rule: EXPLICIT_HOLDER_DISCLOSURE_OR_LEGAL_SUBSTITUTE_ROUTE
    - objective_id: OBJ:VS:COMPARE-ACCOUNTS
      role: QROLE:INVESTIGATE_CONFLICTING_ACCOUNTS
      required: true
      completion: compare_claims_with_at_least_one_independent_evidence_source_or_explicitly_defer_conclusion
      truth_conclusion_required: false
    - objective_id: OBJ:VS:NEGOTIATE-SHARED-USE
      role: QROLE:NEGOTIATE_SHARED_USE
      required: true
      location_ref: LOC:OLD-WORKS
      actor_refs: [CHAR:selka_vey, CHAR:maelin_sor]
      social_refs: [FAC-COMMONS-01, FAC-MAKERS-01, COM-NEIGHBOR-01]
      completion: choose_one_supported_public_route_or_defer_with_recovery
    - objective_id: OBJ:VS:DISCLOSURE-DECISION
      role: BRANCH_FAMILY:DISCLOSURE_OR_WITHHOLDING
      required: true
      completion: choose_disclose_or_withhold_or_defer_without_promoting_claim_to_truth
    - objective_id: OBJ:VS:PUBLIC-COMMITMENT
      role: QROLE:COMMIT_TO_PROJECT
      required: true
      completion: select_repair_pilot_or_records_first_after_tradeoff_signaling
    - objective_id: OBJ:VS:REPAIR-OR-REFRAME
      role: QROLE:REPAIR_OR_REFRAME
      required: false
      completion: pursue_repair_or_relationship_reframing_after_a_material_consequence
  objective_edges:
    - {from: OBJ:VS:PUBLIC-RECORD, to: OBJ:VS:COMPARE-ACCOUNTS, edge: REQUIRES}
    - {from: OBJ:VS:TOMAS-WITNESS, to: OBJ:VS:COMPARE-ACCOUNTS, edge: ENABLES}
    - {from: OBJ:VS:MATERIAL-TRACE, to: OBJ:VS:COMPARE-ACCOUNTS, edge: SUBSTITUTES}
    - {from: OBJ:VS:ANWEN-PRIVATE-PROVENANCE, to: OBJ:VS:COMPARE-ACCOUNTS, edge: ENABLES}
    - {from: OBJ:VS:COMPARE-ACCOUNTS, to: OBJ:VS:NEGOTIATE-SHARED-USE, edge: ENABLES}
    - {from: OBJ:VS:NEGOTIATE-SHARED-USE, to: OBJ:VS:DISCLOSURE-DECISION, edge: ENABLES}
    - {from: OBJ:VS:DISCLOSURE-DECISION, to: OBJ:VS:PUBLIC-COMMITMENT, edge: ENABLES}
    - {from: OBJ:VS:PUBLIC-COMMITMENT, to: OBJ:VS:REPAIR-OR-REFRAME, edge: ENABLES}
  graph_invariants:
    - REQUIRED_SUBGRAPH_ACYCLIC
    - WITNESS_AND_MATERIAL_TRACE_ARE_MEANINGFUL_ALTERNATIVE_EVIDENCE_ROUTES
    - PRIVATE_SECRET_OBJECTIVE_IS_NOT_HIDDEN_REQUIRED
    - MUTUALLY_EXCLUSIVE_BRANCHES_ARE_NOT_JOINTLY_REQUIRED
    - DEFERRED_TRUTH_CONCLUSION_IS_LEGAL
    - BASELINE_COMMUNITY_PLAY_REMAINS_LEGAL_WITHOUT_OPTIONAL_GATES
  failure_policy:
    possible: true
    recoverable: true
    cases:
      - failure_id: FAIL:VS:WITNESS-UNAVAILABLE
        recovery: use_public_record_plus_material_trace_or_defer_conclusion
      - failure_id: FAIL:VS:PRIVATE-TESTIMONY-DENIED
        recovery: use_public_record_or_material_trace; secret remains undisclosed
      - failure_id: FAIL:VS:NEGOTIATION-STALLS
        recovery: defer_commitment_and_preserve_baseline_services
      - failure_id: FAIL:VS:REPAIR-PILOT-DECLINED
        recovery: records_first_or_reframing_route_remains
  retry_recovery_policy:
    abandon_reaccept_allowed: true
    retry_erases_history: false
    retry_resets_claim_truth: false
    retry_may_change_current_relationship_dimensions_only_with_typed_evidence: true
  timed_window_refs: []
  explicit_time_deferral:
    game_time_policy_ref: OPEN:SYN:GAME-TIME-POLICY
    schedule_dependent_required_objectives: []
    timed_content_required_for_completion: false
  observability:
    pre_commitment_signals:
      - disclosure_audience_and_likely_relationship_effects
      - repair_pilot_scope_and_reversibility
      - records_first_tradeoff_and_delayed_physical_change
      - affected_goal_classes
    hidden_irreversibility_allowed: false


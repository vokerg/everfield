provisional_interfaces:
  world:
    - id: WORLD_ROLE:CONT_CONTESTED_SITE
      meaning: scoped site/resource/project surface affected by prior or possible action
    - id: WORLD_ROLE:CONT_HISTORY_OR_EVIDENCE_SOURCE
      meaning: non-character evidence-bearing world surface
    - id: WORLD_ROLE:CONT_AFTERMATH_SURFACE
      meaning: world/project surface on which a consequence can remain observable
  social:
    - id: SOCIAL_ROLE:CONT_AFFECTED_GROUP
      meaning: group/community materially affected by the decision
    - id: SOCIAL_ROLE:CONT_STEWARDSHIP_OR_SERVICE
      meaning: group supporting maintenance, repair, mitigation, or alternatives
    - id: SOCIAL_ROLE:CONT_COUNTERPRESSURE
      meaning: group/institution representing a materially different pressure or objective
  character:
    - id: CHAR_ROLE:CONT_PERSPECTIVE_HOLDER
      meaning: claimant or witness with bounded knowledge
    - id: CHAR_ROLE:CONT_PRIVATE_CONTEXT_HOLDER
      meaning: holder of optional deny-by-default information
    - id: CHAR_ROLE:CONT_AFFECTED_TIE
      meaning: relationship surface affected by consequences but never information authority by itself

information_model:
  authority_layers:
    - OBJECTIVE_FACT_REF
    - CLAIM_REF
    - KNOWLEDGE_REF
    - PLAYER_DISCOVERY_REF
    - SECRET_REF
    - BRANCH_FACT_REF
  invariants:
    - CLAIM_DOES_NOT_IMPLY_OBJECTIVE_FACT
    - KNOWLEDGE_DOES_NOT_PROMOTE_CLAIM_TO_OBJECTIVE_FACT
    - PLAYER_EXPOSURE_DOES_NOT_GRANT_UNIVERSAL_CHARACTER_KNOWLEDGE
    - RELATIONSHIP_STATE_DOES_NOT_GRANT_INFORMATION_AUTHORITY
    - PUBLIC_STANDING_DOES_NOT_GRANT_INFORMATION_AUTHORITY
    - SUBSTITUTE_TESTIMONY_DOES_NOT_GRANT_PRIVATE_SECRET
    - DISCLOSURE_DOES_NOT_SETTLE_UNRESOLVED_OBJECTIVE_TRUTH
    - BRANCH_FACT_REQUIRES_COMPATIBLE_BRANCH_PREDICATE
    - GENERATED_PRESENTATION_CANNOT_MUTATE_AUTHORITATIVE_STATE
  optional_private_context:
    secret_role_id: SECRET_ROLE:CONT_PRIVATE_CONTEXT
    concrete_secret_authored: false
    access_default: DENY
    legal_access_routes:
      - EXPLICIT_HOLDER_DISCLOSURE
      - VALIDATED_AUTHORITY_EFFECT
    forbidden_access_inference:
      - RELATIONSHIP_STATE
      - PUBLIC_STANDING
      - PLAYER_EXPOSURE
      - PROXIMITY
      - REPEATED_INTERACTION
      - SUBSTITUTE_TESTIMONY
    required_for_completion: false
    counts_toward_required_route_minimum: false
    permanent_denial_keeps_required_path_solvable: true

continuation:
  arc_count: 1
  authored_concrete_quest_count: 0
  arc:
    arc_id: ARC_CONT:REASSESS_COMMIT_CONTINUE
    candidate_only: true
    purpose: >-
      Move from interpretation through recommitment or deferral into aftermath continuation after
      an observable consequence, without requiring private information, one concrete sibling entity,
      a hidden foundational gate, or exact timing.
    stage_sequence:
      - QFAM_CONT:REASSESS_AFTER_CONSEQUENCE
      - QFAM_CONT:RECOMMIT_REDIRECT_OR_DEFER
      - QFAM_CONT:AFTERMATH_CONTINUATION

quest_family_contract:
  name: ContinuationQuestFamilyContract
  version: 1
  required_fields:
    - quest_or_family_id
    - version
    - availability
    - forbidden_predicates
    - objectives
    - objective_edges
    - progression_gate_refs
    - branches
    - effect_refs
    - consequence_refs
    - failure_cases
    - retry_recovery_policy
    - abandon_reaccept_policy
    - alternative_or_substitute_routes
    - observability
    - provisional_role_refs
    - time_policy_refs_if_used
    - evidence_refs
    - reopen_refs
  graph_invariants:
    - REQUIRED_SUBGRAPH_ACYCLIC_UNLESS_BOUNDED_MONOTONIC_LOOP_WITH_LEGAL_EXIT
    - OPTIONAL_EVIDENCE_NOT_HIDDEN_REQUIRED
    - PRIVATE_INFORMATION_NOT_HIDDEN_REQUIRED
    - MUTUALLY_EXCLUSIVE_BRANCH_OBJECTIVES_NOT_JOINTLY_REQUIRED
    - EVERY_ACTIVE_REQUIRED_OBJECTIVE_HAS_OBJECTIVE_MINIMUM_MATERIALLY_DISTINCT_ROUTES_OR_PREACTIVATION_LEGAL_TRANSITION
    - RECOVERY_RECOMPUTES_REQUIRED_ROUTE_CARDINALITY_BEFORE_OBJECTIVE_CONTINUES
    - UNAVAILABLE_ACTOR_SITE_SERVICE_HAS_SUBSTITUTION_DEFERRAL_COMPENSATION_OR_LEGAL_FAILURE
    - RETRY_DOES_NOT_ERASE_MATERIAL_HISTORY
    - GENERATED_PROSE_DOES_NOT_PERFORM_AUTHORITATIVE_STATE_MUTATION

quest_family_stages:
  - id: QFAM_CONT:REASSESS_AFTER_CONSEQUENCE
    stage_class: STRUCTURAL_GRAMMAR_FIXTURE
    availability:
      required:
        - OBSERVABLE_PRIOR_CONSEQUENCE_OR_BRANCH_EFFECT_OR_CONTESTED_STATE
        - AT_LEAST_TWO_MATERIALLY_DISTINCT_NONPRIVATE_EVIDENCE_OR_PERSPECTIVE_ROUTES
      forbidden_hidden_requirements:
        - SECRET_ROLE:CONT_PRIVATE_CONTEXT
        - EXACT_SCHEDULE
        - FOUNDATIONAL_NARRATIVE_GATE
    required_objectives:
      - objective_id: OBJ_CONT:OBSERVE_CURRENT_EFFECT
        completion: observe one material current effect or consequence surface
      - objective_id: OBJ_CONT:COMPARE_PERSPECTIVES
        completion: compare at least two materially distinct claim or evidence perspectives, both legally available without requiring private context
      - objective_id: OBJ_CONT:DECLARE_INTERPRETATION_OR_DEFER
        completion: choose a working interpretation, acknowledge uncertainty, or explicitly defer conclusion
    optional_objectives:
      - objective_id: OBJ_CONT:PRIVATE_CONTEXT
        information_ref: SECRET_ROLE:CONT_PRIVATE_CONTEXT
        required: false
        access_rule: EXPLICIT_HOLDER_DISCLOSURE_OR_VALIDATED_AUTHORITY_EFFECT
        counts_toward_required_route_minimum: false
    objective_edges:
      - {from: OBJ_CONT:OBSERVE_CURRENT_EFFECT, to: OBJ_CONT:COMPARE_PERSPECTIVES, edge: ENABLES}
      - {from: OBJ_CONT:COMPARE_PERSPECTIVES, to: OBJ_CONT:DECLARE_INTERPRETATION_OR_DEFER, edge: ENABLES}
      - {from: OBJ_CONT:PRIVATE_CONTEXT, to: OBJ_CONT:COMPARE_PERSPECTIVES, edge: OPTIONAL_ENRICHES}
    required_route_kinds:
      - PUBLIC_OR_MATERIAL_EVIDENCE
      - SUBSTITUTE_TESTIMONY_OR_OTHER_NONPRIVATE_EVIDENCE
    route_cardinality_contract:
      objective_id: OBJ_CONT:COMPARE_PERSPECTIVES
      minimum_simultaneously_legal_routes: 2
      materially_distinct: true
      private_context_counts_toward_minimum: false
      enforcement_phase: PRE_OBJECTIVE_ACTIVATION_AND_AFTER_RECOVERY
      underflow_transition: STATE_CONT:PRE_COMPARE_DEFERRED
      underflow_transition_before_objective_activation: true
    failure_cases:
      - failure_id: FAIL_CONT:PERSPECTIVE_HOLDER_UNAVAILABLE
        recovery: recompute qualifying nonprivate routes; use public/material/substitute routes if at least two remain, otherwise enter STATE_CONT:PRE_COMPARE_DEFERRED before OBJ_CONT:COMPARE_PERSPECTIVES activates
      - failure_id: FAIL_CONT:PRIVATE_CONTEXT_DENIED
        recovery: secret remains undisclosed; private context is excluded from the required route minimum so cardinality is unchanged
      - failure_id: FAIL_CONT:EVIDENCE_REMAINS_CONTRADICTORY
        recovery: after a legal two-perspective comparison, explicit deferred conclusion remains legal
      - failure_id: FAIL_CONT:AFFECTED_SURFACE_INACCESSIBLE
        recovery: recompute qualifying nonprivate routes; if fewer than two remain, enter STATE_CONT:PRE_COMPARE_DEFERRED before comparison activates; foundational play remains legal
    progression_gate_refs:
      - GATE:NARR-CONT:CONSEQUENCE_REASSESSMENT
    provisional_role_refs:
      - WORLD_ROLE:CONT_HISTORY_OR_EVIDENCE_SOURCE
      - CHAR_ROLE:CONT_PERSPECTIVE_HOLDER
      - CHAR_ROLE:CONT_PRIVATE_CONTEXT_HOLDER

  - id: QFAM_CONT:RECOMMIT_REDIRECT_OR_DEFER
    stage_class: STRUCTURAL_GRAMMAR_FIXTURE
    availability:
      required:
        - REASSESSMENT_COMPLETED_OR_EXPLICITLY_DEFERRED
        - MATERIAL_OPTIONS_AND_AFFECTED_GOAL_CLASSES_SIGNALED
        - AT_LEAST_TWO_SIMULTANEOUS_LEGAL_MATERIALLY_DIFFERENTIATED_DIRECTION_ROUTE_KINDS
    required_objectives:
      - objective_id: OBJ_CONT:SELECT_DIRECTION
        completion: select among at least two simultaneously legal materially differentiated route kinds
    route_cardinality_contract:
      objective_id: OBJ_CONT:SELECT_DIRECTION
      allowed_route_kinds:
        - MAINTAIN
        - REDIRECT
        - COMPENSATE_OR_REPAIR
        - DEFER
      minimum_simultaneously_legal_route_kinds: 2
      materially_differentiated: true
      enforcement_phase: PRE_OBJECTIVE_ACTIVATION_AND_AFTER_RECOVERY
      underflow_transition: STATE_CONT:PRE_DIRECTION_DEFERRED
      underflow_transition_before_objective_activation: true
    branch_requirements:
      - AFFECTED_GOALS_AND_CONTENT_EXPLICIT
      - REVERSIBILITY_EXPLICIT
      - OBSERVABILITY_AND_PRECOMMITMENT_SIGNALING_EXPLICIT
      - RECOVERY_MITIGATION_OR_COMPENSATION_EXPLICIT
      - EVIDENCE_NEEDS_EXPLICIT
      - BRANCH_EXCLUSIVE_OR_IRREVERSIBLE_ROUTE_MAY_NOT_REMOVE_ORDINARY_FOUNDATIONAL_PLAY
      - HIGH_IMPACT_OR_IRREVERSIBLE_REQUIRES_BRANCH_IMPACT_EVIDENCE
    failure_cases:
      - failure_id: FAIL_CONT:SERVICE_OR_ACTOR_ROUTE_UNAVAILABLE
        recovery: recompute direction route kinds after substitution or route loss; if fewer than two materially differentiated kinds remain, enter STATE_CONT:PRE_DIRECTION_DEFERRED before OBJ_CONT:SELECT_DIRECTION is active
      - failure_id: FAIL_CONT:COMMITMENT_REJECTED
        recovery: continued nonaligned goals remain and direction route kinds are recomputed; underflow below two enters STATE_CONT:PRE_DIRECTION_DEFERRED before another selection activates
      - failure_id: FAIL_CONT:SITE_OR_RESOURCE_STATE_INVALIDATES_ROUTE
        recovery: recompute direction route kinds and redirect or defer when at least two kinds remain; otherwise enter STATE_CONT:PRE_DIRECTION_DEFERRED before selection
    progression_gate_refs:
      - GATE:NARR-CONT:PUBLIC_RECOMMITMENT
    provisional_role_refs:
      - WORLD_ROLE:CONT_CONTESTED_SITE
      - SOCIAL_ROLE:CONT_AFFECTED_GROUP
      - SOCIAL_ROLE:CONT_STEWARDSHIP_OR_SERVICE
      - SOCIAL_ROLE:CONT_COUNTERPRESSURE
      - CHAR_ROLE:CONT_AFFECTED_TIE

  - id: QFAM_CONT:AFTERMATH_CONTINUATION
    stage_class: STRUCTURAL_GRAMMAR_FIXTURE
    availability:
      required:
        - MATERIAL_CONSEQUENCE_OR_BRANCH_STATE_EXISTS
        - AT_LEAST_TWO_SIMULTANEOUS_MATERIALLY_DISTINCT_CONTINUED_GOAL_FAMILIES
    required_objectives:
      - objective_id: OBJ_CONT:CHOOSE_CONTINUED_GOAL
        completion: choose from at least two simultaneously legal materially distinct continued-goal families
    continued_goal_families:
      - GOAL_CONT:MAINTAIN_OR_STEWARD
      - GOAL_CONT:REPAIR_OR_COMPENSATE
      - GOAL_CONT:LEARN_OR_RECONTEXTUALIZE
      - GOAL_CONT:REDIRECT_PROJECT
      - GOAL_CONT:NONALIGNED_BASELINE_CONTINUATION
    route_cardinality_contract:
      objective_id: OBJ_CONT:CHOOSE_CONTINUED_GOAL
      minimum_simultaneously_legal_goal_families: 2
      materially_distinct: true
      enforcement_phase: PRE_OBJECTIVE_ACTIVATION_AND_AFTER_RECOVERY
      underflow_transition: STATE_CONT:PRE_GOAL_SELECTION_DEFERRED
      underflow_transition_before_objective_activation: true
    failure_cases:
      - failure_id: FAIL_CONT:ONE_GOAL_FAMILY_UNAVAILABLE
        recovery: recompute legal goal families; selection continues only if at least two materially distinct families remain, otherwise enter STATE_CONT:PRE_GOAL_SELECTION_DEFERRED before OBJ_CONT:CHOOSE_CONTINUED_GOAL activates
      - failure_id: FAIL_CONT:RESTORATION_IMPOSSIBLE
        recovery: compensation or changed-goal route required and the two-family minimum must hold before goal selection activates
      - failure_id: FAIL_CONT:RELATIONSHIP_ACCESS_CHANGED
        recovery: unrelated foundational play remains legal; any resulting goal-family underflow enters STATE_CONT:PRE_GOAL_SELECTION_DEFERRED before selection
      - failure_id: FAIL_CONT:OBJECTIVE_TRUTH_UNRESOLVED
        recovery: aftermath goals may proceed without forced mystery closure only while two materially distinct goal families remain legal; otherwise pre-goal-selection deferral remains legal
    progression_gate_refs:
      - GATE:NARR-CONT:AFTERMATH_STEWARDSHIP
    provisional_role_refs:
      - WORLD_ROLE:CONT_AFTERMATH_SURFACE
      - SOCIAL_ROLE:CONT_STEWARDSHIP_OR_SERVICE
      - CHAR_ROLE:CONT_AFFECTED_TIE

progression_gates:
  contract_name: ProgressionGateContract
  contract_version: 1
  foundational_gate_count: 0
  gates:
    - gate_id: GATE:NARR-CONT:CONSEQUENCE_REASSESSMENT
      version: 1
      gate_class: OPTIONAL
      blocks_or_unlocks:
        - optional deeper interpretation and reassessment content
      requirements:
        - observable prior consequence or contested-state marker
        - at least two materially distinct nonprivate evidence or perspective routes while OBJ_CONT:COMPARE_PERSPECTIVES is active
      route_cardinality_ref: QFAM_CONT:REASSESS_AFTER_CONSEQUENCE.route_cardinality_contract
      routes:
        - route_id: ROUTE:NARR-CONT:REASSESS:PUBLIC_MATERIAL
          route_kind: KNOWLEDGE
          prerequisite_refs:
            - WORLD_ROLE:CONT_HISTORY_OR_EVIDENCE_SOURCE
          lifestyle_impacts: []
        - route_id: ROUTE:NARR-CONT:REASSESS:SUBSTITUTE
          route_kind: SUBSTITUTE
          prerequisite_refs:
            - CHAR_ROLE:CONT_PERSPECTIVE_HOLDER
          lifestyle_impacts: []
        - route_id: ROUTE:NARR-CONT:REASSESS:PRIVATE_OPTIONAL
          route_kind: RELATIONSHIP
          prerequisite_refs:
            - SECRET_ROLE:CONT_PRIVATE_CONTEXT
          lifestyle_impacts: []
          optional: true
          counts_toward_required_route_minimum: false
      visibility_or_discovery:
        - optional status explicit
        - private context never presented as required
      miss_failure_recovery: recompute nonprivate route cardinality; underflow below two enters STATE_CONT:PRE_COMPARE_DEFERRED before comparison activates; ordinary play remains legal
      branch_scope: null
      evidence_requirements:
        - WSN-E1
        - WSN-E2
      exception_rationale: null

    - gate_id: GATE:NARR-CONT:PUBLIC_RECOMMITMENT
      version: 1
      gate_class: BRANCH_EXCLUSIVE
      blocks_or_unlocks:
        - commitment-specific consequences and aftermath content
      requirements:
        - reassessment completed or explicitly deferred
        - material tradeoffs and affected goal classes signaled
        - at least two materially differentiated direction route kinds simultaneously legal while OBJ_CONT:SELECT_DIRECTION is active
      route_cardinality_ref: QFAM_CONT:RECOMMIT_REDIRECT_OR_DEFER.route_cardinality_contract
      routes:
        - route_id: ROUTE:NARR-CONT:RECOMMIT:MAINTAIN_OR_REDIRECT
          route_kind: QUEST
          prerequisite_refs:
            - OBJ_CONT:SELECT_DIRECTION
          lifestyle_impacts:
            - branch-specific goals and content may change
        - route_id: ROUTE:NARR-CONT:RECOMMIT:COMPENSATE_OR_REPAIR
          route_kind: SERVICE
          prerequisite_refs:
            - SOCIAL_ROLE:CONT_STEWARDSHIP_OR_SERVICE
          lifestyle_impacts:
            - specialized repair or compensation effort may be required for that branch goal
        - route_id: ROUTE:NARR-CONT:RECOMMIT:DEFER
          route_kind: SUBSTITUTE
          prerequisite_refs:
            - QFAM_CONT:REASSESS_AFTER_CONSEQUENCE
          lifestyle_impacts:
            - preserves noncommitted and baseline routes temporarily
      visibility_or_discovery:
        - affected-goal classes and reversibility class signaled before commitment
        - defer or nonalignment route visible before commitment
      miss_failure_recovery: recompute direction route-kind cardinality; underflow below two enters STATE_CONT:PRE_DIRECTION_DEFERRED before selection; no silent permanent soft lock
      branch_scope: BRANCH_FAMILY:NARR-CONT:PUBLIC_DIRECTION
      evidence_requirements:
        - WSN-E3
        - WSN-E5
      exception_rationale: null

    - gate_id: GATE:NARR-CONT:AFTERMATH_STEWARDSHIP
      version: 1
      gate_class: SPECIALIZATION
      blocks_or_unlocks:
        - specialized stewardship, repair, maintenance, or leadership aftermath goals
      requirements:
        - material aftermath state exists
        - containing aftermath selection stage has at least two materially distinct continued-goal families while OBJ_CONT:CHOOSE_CONTINUED_GOAL is active
      route_cardinality_ref: QFAM_CONT:AFTERMATH_CONTINUATION.route_cardinality_contract
      routes:
        - route_id: ROUTE:NARR-CONT:AFTERMATH:STEWARDSHIP
          route_kind: SERVICE
          prerequisite_refs:
            - SOCIAL_ROLE:CONT_STEWARDSHIP_OR_SERVICE
          lifestyle_impacts:
            - specialization-specific work and goals
        - route_id: ROUTE:NARR-CONT:AFTERMATH:REDIRECT
          route_kind: QUEST
          prerequisite_refs:
            - GOAL_CONT:REDIRECT_PROJECT
          lifestyle_impacts: []
        - route_id: ROUTE:NARR-CONT:AFTERMATH:NONALIGNED
          route_kind: SUBSTITUTE
          prerequisite_refs:
            - GOAL_CONT:NONALIGNED_BASELINE_CONTINUATION
          lifestyle_impacts: []
      visibility_or_discovery:
        - specialization status explicit
        - alternative non-stewardship goal families visible
      miss_failure_recovery: recompute aftermath goal-family cardinality; underflow below two enters STATE_CONT:PRE_GOAL_SELECTION_DEFERRED before selection; unrelated foundational play stays legal
      branch_scope: null
      evidence_requirements:
        - WSN-E5
        - WSN-E8
      exception_rationale: null

consequence_contract:
  name: ContinuationConsequenceContract
  version: 1
  reversibility_classes:
    - REVERSIBLE
    - CONDITIONALLY_REVERSIBLE
    - IRREVERSIBLE
  required_fields:
    - consequence_id
    - trigger_ref
    - affected_state_refs
    - preconditions

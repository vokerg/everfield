  - id: PLAT-SRC-STEAM-DECK
    authority: Valve / Steamworks
    title: Steam Deck and Steam Machine Compatibility Review
    url: https://partner.steamgames.com/doc/steamhardware/compat
    source_version: versionless_live_compatibility_checklist
    observed_at: "2026-08-12T19:37:30+02:00"
    mutable: true
    verification_status: VERIFIED_CURRENT_FOR_USED_FACTS
    facts_used:
      - The default controller configuration must provide access to all content.
      - On-screen glyphs must match the active input.
      - Required text entry must have a controller-usable path.
      - Steam Deck default configuration must provide a playable 30 fps at 800p.
      - Device-compatibility warning and launcher behavior are review criteria.
      - Windows games without native Linux builds can run through Proton, a Windows compatibility layer.
      - Steam Deck display guidance includes 1280x800 as the preferred native resolution and a minimum text-legibility criterion.
    freshness_rule: Recheck before engine comparison, Milestone Zero, readiness verification, or when Valve changes compatibility criteria/hardware.
    drift_from_issue79: >-
      Current page now presents joint Deck/Steam Machine criteria; the Deck facts consumed by the
      producer remain materially supported. The remediation does not promote Steam Machine into scope.

  - id: PLAT-SRC-STEAM-SURVEY
    authority: Valve / Steam
    title: Steam Hardware & Software Survey
    url: https://store.steampowered.com/hwsurvey/
    source_version: July 2026
    observed_at: "2026-08-12T19:37:30+02:00"
    mutable: true
    verification_status: VERIFIED_LATEST_MONTH_AVAILABLE
    latest_month_check:
      newest_first_party_month_visible: July 2026
      record_month: July 2026
      current: true
    facts_used:
      - Participation is optional and anonymous.
      - Windows represents 93.67 percent of participating systems in the July 2026 survey.
      - Windows 11 64-bit represents 70.26 percent of participating systems in the July 2026 survey.
      - The survey is directional Steam-user evidence, not total-market or product-demand evidence.
    freshness_rule: Recheck newest available month before commercial platform commitment or whenever survey data is used as current evidence.
    drift_from_issue79: >-
      MATERIAL_FRESHNESS_CORRECTION: Issue #79 recorded June 2026 at 94.10 percent Windows
      and 70.44 percent Windows 11 64-bit while July 2026 was already available on the
      claimed 2026-08-12 observation date. This record supersedes those values.


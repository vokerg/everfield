  - id: PLAT-SRC-XAG
    authority: Microsoft Game Dev
    title: Xbox Accessibility Guidelines
    url: https://learn.microsoft.com/en-us/xbox/accessibility/guidelines
    source_version: XAG v3.2; page last updated 2026-03-04
    observed_at: "2026-08-12T19:37:30+02:00"
    mutable: true
    verification_status: VERIFIED_CURRENT_FOR_USED_FACTS
    facts_used:
      - XAG v3.2 is the published guideline version.
      - XAGs are best-practice guidance for design/development/testing and are not presented as a legal-compliance checklist.
      - The guideline set spans text, contrast, subtitles/captions, audio, narration, input, difficulty, UI navigation/focus/context, destructive actions, timing, motion/photosensitivity, communication, documentation/support, and mental-health practices.
    freshness_rule: W2-ACC-01 must recheck current XAG version/history and map actual applicable requirements rather than inherit this list as compliance authority.
    drift_from_issue79: none_material_for_used_facts


record_policy:
  purpose: >-
    Preserve an immutable project-side record of the exact external facts consumed by
    the remediated platform-scope report without copying unnecessary third-party page text.
  mutable_source_rule: >-
    A live/versionless external page may support a frozen project claim only through this
    immutable normalized record, which binds source identity, observation time, explicit
    version/month/last-updated data when available, the exact facts consumed, and a
    freshness/reopen rule.
  monthly_current_rule: >-
    A monthly source may be labeled CURRENT only when its recorded month equals the newest
    first-party month available at observed_at. If a newer first-party month is visible,
    an older record is STALE and cannot support a current-source acceptance claim.
  inference_rule: >-
    These records contain external facts only. Project recommendations and sequencing
    inferences are kept in target-platform-scope.md and may not be represented as source facts.

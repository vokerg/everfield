evidence_requirements:
  ACC-EV-TEXT-DESKTOP-01:
    state: NOT_RUN
    purpose: PC text size, glyph size, 200-percent scaling, overflow and layout behavior
  ACC-EV-TEXT-STYLE-01:
    state: NOT_RUN
    purpose: sans-serif/non-stylized font alternatives and complete supported-language character sets
  ACC-EV-TEXT-SPACING-01:
    state: NOT_RUN
    purpose: text-block spacing configurability or source minimum bounds
  ACC-EV-TEXT-LANGUAGE-01:
    state: NOT_RUN
    purpose: sentence-case and language-aware alignment behavior
  ACC-EV-INPUT-NAV-01:
    state: NOT_RUN
    purpose: digital/analog UI navigation and single non-simultaneous UI operation
  ACC-EV-INPUT-REMAP-01:
    state: NOT_RUN
    purpose: complete in-game remap, axis inversion, label synchronization and digital equivalents
  ACC-EV-INPUT-ALTERNATIVES-01:
    state: NOT_RUN
    purpose: alternatives for rapid, held, simultaneous, gesture and nontraditional input barriers
  ACC-EV-INPUT-POINTER-01:
    state: NOT_RUN
    purpose: pointer activation/cancel/undo behavior
  ACC-EV-INPUT-KBM-01:
    state: NOT_RUN
    purpose: keyboard-only start, settings, gameplay and exit flow when keyboard input is supported
  ACC-EV-INPUT-SENSITIVITY-01:
    state: NOT_RUN
    purpose: per-analog-control sensitivity range
  ACC-EV-INPUT-CUSTOMIZATION-01:
    state: NOT_RUN
    purpose: accessibility of the input customization process itself
  ACC-EV-TEXT-ENTRY-DICTATION-01:
    state: NOT_RUN
    purpose: speech-to-text or dictation for applicable text-entry/chat surfaces
  ACC-EV-INPUT-CONTROLLER-01:
    state: NOT_RUN
    purpose: controller-only representative core flow including settings, errors and required text entry
  ACC-EV-GLYPH-01:
    state: NOT_RUN
    purpose: active device/remap glyph correctness
  ACC-EV-DECK-PERF-01:
    state: NOT_RUN
    purpose: exact Deck default-configuration 30 fps at 800p performance evidence
  ACC-EV-DECK-LAUNCH-01:
    state: NOT_RUN
    purpose: Deck launch and unsupported-device-warning scan
  ACC-EV-DECK-LAUNCHER-01:
    state: NOT_RUN
    purpose: launcher controller/accessibility compatibility when a launcher exists
  ACC-EV-DECK-DISPLAY-01:
    state: NOT_RUN
    purpose: Deck-supported resolution behavior including 1280x800 target coverage
  ACC-EV-TEXT-DECK-01:
    state: NOT_RUN
    purpose: Deck 1280x800 text floor and readability evidence
  ACC-EV-DECK-PROTON-01:
    state: NOT_RUN
    purpose: project-selected Windows-build-on-Deck/SteamOS via Proton launch/core-flow evidence

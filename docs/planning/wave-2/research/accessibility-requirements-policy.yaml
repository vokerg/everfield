atomic_clause_addition_patch:
  XAG112-SCALED-MAP-NONSCROLLING-NAVIGATION:
    source_id: XAG-112
    authority_class: BEST_PRACTICE_REQUIRED_IF_APPLICABLE
    source_modality: SHOULD
    applicability: CONDITIONAL
    trigger: game_map_ui_is_scaled_or_zoomed
    required_semantics:
      non_scrolling_alternative_navigation_method_provided: true
      implementation_form: NONEXCLUSIVE

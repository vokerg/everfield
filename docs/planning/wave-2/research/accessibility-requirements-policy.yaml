atomic_clause_correction_patch:
  XAG102-PLATFORM-HIGH-CONTRAST-DEFAULT:
    source_id: XAG-102
    authority_class: BEST_PRACTICE_REQUIRED_IF_APPLICABLE
    applicability: CONDITIONAL
    trigger: platform_high_contrast_setting_is_available_to_title
    required_semantics:
      read_platform_setting: true
      apply_as_launch_default: true
    evidence_requirement_refs: [ACC-EV-PLATFORM-A11Y]
    gap_ref: ACC-GAP-XAG102

  XAG104-SPEAKER-ID-REFRESH:
    source_id: XAG-104
    authority_class: BEST_PRACTICE_REQUIRED_IF_APPLICABLE
    applicability: CONDITIONAL
    trigger: speaker_changes_or_same_speaker_resumes_after_source_significant_pause
    required_semantics:
      speaker_name_reappears: true
      source_significant_pause_phrase: 'greater than 1-2 minutes'
      source_threshold_machine_semantics: AMBIGUOUS_RANGE_NOT_EXECUTABLE
    project_fail_closed_evaluation_rule:
      authority_class: PROJECT_EVALUATION_RULE_NOT_SOURCE_REQUIREMENT
      source_normative: false
      comparison: 'pause_duration_seconds > 60'
      threshold_seconds: 60
      rationale: conservative lower-bound trigger prevents the ambiguous source range from silently passing while preserving the exact source phrase separately
      reopen_condition: independently approved deterministic interpretation of the source range
    evidence_requirement_refs: [ACC-EV-CAPTIONS]
    gap_ref: ACC-GAP-XAG104

  XAG104-PRESTART-OR-DEFAULT-ON:
    source_id: XAG-104
    authority_class: BEST_PRACTICE_REQUIRED_IF_APPLICABLE
    applicability: CONDITIONAL
    trigger: game_has_spoken_content_for_which_subtitles_apply
    required_semantics:
      one_of:
        - player_can_adjust_before_game_start
        - subtitles_enabled_by_default
    evidence_requirement_refs: [ACC-EV-CAPTIONS]
    gap_ref: ACC-GAP-XAG104

  XAG105-PAUSE-AUDIO-EVENTS:
    source_id: XAG-105
    authority_class: BEST_PRACTICE_REQUIRED_IF_APPLICABLE
    applicability: CONDITIONAL
    trigger: audio_event_duration_seconds_greater_than_or_equal_to_3
    required_semantics:
      player_can_pause: true
      includes_cinematics_with_audio: true
    evidence_requirement_refs: [ACC-EV-AUDIO-PAUSE]
    gap_ref: ACC-GAP-XAG105
    exceptions:
      - audio_event_under_3_seconds
      - real_time_multiplayer_gameplay

  XAG106-CORE-UI-NARRATION:
    source_id: XAG-106
    authority_class: BEST_PRACTICE_REQUIRED_IF_APPLICABLE
    applicability: CONDITIONAL
    trigger: core_game_ui_text_or_state_information_exists
    required_semantics:
      auditory_representation_required: true
      allowed_solution_set:
        - platform_screen_reader
        - game_ui_speech_synthesizer
        - recorded_audio_files
      recorded_audio_files_preference: ALLOWED_BUT_NOT_IDEAL
      coverage:
        - main_menu
        - options
        - HUD
        - state_changes
        - players_in_game
        - time_based_events
    evidence_requirement_refs: [ACC-EV-NARRATION]
    gap_ref: ACC-GAP-XAG106

  XAG106-CONTEXT-CHANGE-INITIATED-NARRATED:
    source_id: XAG-106
    authority_class: BEST_PRACTICE_REQUIRED_IF_APPLICABLE
    applicability: CONDITIONAL
    trigger: ui_context_change_occurs
    required_semantics:
      context_change_player_initiated: true
      new_context_narrated_after_change: true
    evidence_requirement_refs: [ACC-EV-NARRATION]
    gap_ref: ACC-GAP-XAG106


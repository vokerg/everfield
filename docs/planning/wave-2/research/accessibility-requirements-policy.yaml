    evidence_requirement_refs:
      - ACC-EV-XAG112
    gap_ref: ACC-GAP-XAG112

  XAG112-SUBMENU-PERSISTENT-RETURN-LINK:
    source_id: XAG-112
    authority_class: BEST_PRACTICE_REQUIRED_IF_APPLICABLE
    source_modality: SHOULD
    applicability: CONDITIONAL
    trigger: submenu_exists
    required_semantics:
      persistent_return_link_present: true
      return_target_alternatives_minimum: 1
      allowed_return_targets:
        - main_menu_screen
        - initial_interactive_screen
    evidence_requirement_refs:
      - ACC-EV-XAG112
    gap_ref: ACC-GAP-XAG112

  XAG112-SAME-INPUT-FOCUS-ESCAPE:
    source_id: XAG-112
    authority_class: BEST_PRACTICE_REQUIRED_IF_APPLICABLE
    source_modality: SHOULD
    applicability: CONDITIONAL
    trigger: ui_element_can_receive_focus_via_input_method
    required_semantics:
      normal_case:
        focus_can_be_moved_away_using_same_input_method: true
      conditional_fallback:
        when: moving_focus_away_requires_navigation_inconsistent_with_rest_of_interface
        require:
          clear_interaction_prompt_explains_how_to_move_focus_away: true
        fallback_is_not_unconditional_simultaneous_requirement: true
    evidence_requirement_refs:
      - ACC-EV-XAG112
    gap_ref: ACC-GAP-XAG112


  XAG118-LUMINANCE-FLASH-LIMITS:
    source_id: XAG-118
    authority_class: BEST_PRACTICE_REQUIRED_IF_APPLICABLE
    source_modality: SHOULD
    applicability: CONDITIONAL
    trigger: visual_content_contains_luminance_change_or_flash
    required_semantics:
      flash_luminance_change_percent_threshold: 10
      darker_luminance_threshold: 0.8
      failure_frequency_per_second_greater_than_about: 3
      failure_area_percent_about_or_greater: 20
      extended_lower_intensity_flashing_can_fail: true
      mitigation_options:
      - reduce_contrast
      - reduce_frequency
      - reduce_area
    source_fidelity_note: Threshold bundle retained as one conjunctive test criterion rather than splitting definitions from failure logic.

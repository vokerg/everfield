atomic_clause_correction_patch:
  XAG122-MULTIPLE-ACCESSIBLE-SUPPORT-METHODS:
    source_id: XAG-122
    authority_class: BEST_PRACTICE_REQUIRED_IF_APPLICABLE
    source_modality: SHOULD
    applicability: CONDITIONAL
    trigger: customer_support_is_offered
    required_semantics:
      multiple_accessible_support_methods_available: true
      required_accessible_support_methods:
        - phone
        - tty
        - email
        - chat
    source_fidelity_note: >-
      The current first-party implementation guideline names phone, TTY, email, and
      chat inside the SHOULD directive using including-language. These methods are
      therefore load-bearing members of the mapped support-method set, not merely
      illustrative metadata. This remains best-practice SHOULD authority and creates
      no legal/compliance or platform-certification claim.
    evidence_requirement_refs:
      - ACC-EV-XAG122
    gap_ref: ACC-GAP-XAG122


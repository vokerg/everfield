atomic_clauses:
  XAG101-PC-DEFAULT-SIZE:
    source_id: XAG-101
    source_section: Implementation guidelines / Text size
    authority_class: CURRENT_ACCESSIBILITY_BEST_PRACTICE
    applicability: APPLICABLE_BASELINE
    semantics:
      pc_vr_minimum_default_px_1080p: 18
      pc_vr_minimum_default_px_4k: 36
    evidence_requirement_refs:
    - ACC-EV-TEXT-DESKTOP-01
    gap_refs:
    - ACC-GAP-TEXT-01
  XAG101-GLYPH-CONTAINED-TEXT:
    source_id: XAG-101
    source_section: Implementation guidelines / Icons and glyph sizes
    authority_class: CURRENT_ACCESSIBILITY_BEST_PRACTICE
    applicability: APPLICABLE_BASELINE
    semantics:
      contained_text_meets_platform_text_minimum: true
    evidence_requirement_refs:
    - ACC-EV-TEXT-DESKTOP-01
    gap_refs:
    - ACC-GAP-TEXT-01
  XAG101-GLYPH-SCALE-200:
    source_id: XAG-101
    source_section: Implementation guidelines / Icons and glyph sizes
    authority_class: CURRENT_ACCESSIBILITY_BEST_PRACTICE
    applicability: APPLICABLE_BASELINE
    semantics:
      glyphs_scale_with_text_to_percent_of_minimum: 200
    evidence_requirement_refs:
    - ACC-EV-TEXT-DESKTOP-01
    gap_refs:
    - ACC-GAP-TEXT-01
  XAG101-TEXT-SCALE-200:
    source_id: XAG-101
    source_section: Implementation guidelines / Text scaling
    authority_class: CURRENT_ACCESSIBILITY_BEST_PRACTICE
    applicability: APPLICABLE_BASELINE
    semantics:
      scale_to_percent_of_minimum: 200
      no_loss_of:
      - content
      - functionality
      - meaning
    evidence_requirement_refs:
    - ACC-EV-TEXT-DESKTOP-01
    gap_refs:
    - ACC-GAP-TEXT-01
  XAG101-SCALED-OVERFLOW:
    source_id: XAG-101
    source_section: Implementation guidelines / Text scaling
    authority_class: CURRENT_ACCESSIBILITY_BEST_PRACTICE
    applicability: APPLICABLE_BASELINE
    semantics:
      overflow_remains_readable: true
      simultaneous_horizontal_and_vertical_scroll_for_one_ui_forbidden: true
      scaled_headers_remain_distinguishable: true
    evidence_requirement_refs:
    - ACC-EV-TEXT-DESKTOP-01
    gap_refs:
    - ACC-GAP-TEXT-01
  XAG101-SANS-SERIF:
    source_id: XAG-101
    source_section: Implementation guidelines / Font style
    authority_class: CURRENT_ACCESSIBILITY_BEST_PRACTICE
    applicability: APPLICABLE_BASELINE
    semantics:
      at_least_one_sans_serif_option: true
    evidence_requirement_refs:
    - ACC-EV-TEXT-STYLE-01
    gap_refs:
    - ACC-GAP-TEXT-STYLE-01
  XAG101-NONSTYLIZED-FONT:
    source_id: XAG-101
    source_section: Implementation guidelines / Font style
    authority_class: CURRENT_ACCESSIBILITY_BEST_PRACTICE
    applicability: APPLICABLE_IF_FEATURE_PRESENT
    trigger: stylistic_fonts_are_used
    semantics:
      non_stylized_option_required_when_triggered: true
    evidence_requirement_refs:
    - ACC-EV-TEXT-STYLE-01
    gap_refs:
    - ACC-GAP-TEXT-STYLE-01
  XAG101-COMPLETE-CHARSETS:
    source_id: XAG-101
    source_section: Implementation guidelines / Font style
    authority_class: CURRENT_ACCESSIBILITY_BEST_PRACTICE
    applicability: APPLICABLE_BASELINE
    semantics:
      all_fonts_cover_all_supported_language_character_sets: true
    evidence_requirement_refs:
    - ACC-EV-TEXT-STYLE-01
    gap_refs:
    - ACC-GAP-TEXT-STYLE-01
  XAG101-TEXT-BLOCK-SPACING:
    source_id: XAG-101
    source_section: Implementation guidelines / Text spacing
    authority_class: CURRENT_ACCESSIBILITY_BEST_PRACTICE
    applicability: APPLICABLE_IF_FEATURE_PRESENT
    trigger: text_block_has_more_than_two_lines
    semantics:
      acceptable_modes:
      - player_configurable_spacing
      - source_minimum_spacing_bounds
      source_minimum_spacing_bounds:
        line_width_max_characters: 80
        line_width_max_characters_cjk: 40
        line_spacing_min_multiplier: 1.5
        paragraph_spacing_min_multiple_of_line_spacing: 2
        letter_spacing_min_multiple_of_font_size: 0.12
        word_spacing_min_multiple_of_font_size: 0.16
    evidence_requirement_refs:
    - ACC-EV-TEXT-SPACING-01
    gap_refs:
    - ACC-GAP-TEXT-SPACING-01
  XAG101-SENTENCE-CASE:
    source_id: XAG-101
    source_section: Implementation guidelines / Text case and alignment
    authority_class: CURRENT_ACCESSIBILITY_BEST_PRACTICE
    applicability: APPLICABLE_IF_FEATURE_PRESENT
    trigger: lines_of_text_use_full_caps_or_full_lowercase
    semantics:
      sentence_case_option_required: true
      one_or_two_word_labels_exempt: true
    evidence_requirement_refs:
    - ACC-EV-TEXT-LANGUAGE-01
    gap_refs:
    - ACC-GAP-TEXT-LANGUAGE-01
  XAG101-LANGUAGE-ALIGNMENT:
    source_id: XAG-101
    source_section: Implementation guidelines / Text case and alignment
    authority_class: CURRENT_ACCESSIBILITY_BEST_PRACTICE
    applicability: APPLICABLE_BASELINE
    semantics:
      alignment_follows_player_language_direction_or_is_player_configurable: true
      centered_or_fully_justified_default_for_lines_of_text: false
    evidence_requirement_refs:
    - ACC-EV-TEXT-LANGUAGE-01
    gap_refs:
    - ACC-GAP-TEXT-LANGUAGE-01
  XAG107-UI-DIGITAL-ANALOG:
    source_id: XAG-107
    source_section: Implementation guidelines
    authority_class: CURRENT_ACCESSIBILITY_BEST_PRACTICE
    applicability: APPLICABLE_BASELINE
    semantics:
      ui_supports_digital_and_analog_navigation: true
    evidence_requirement_refs:
    - ACC-EV-INPUT-NAV-01
    gap_refs:
    - ACC-GAP-INPUT-NAV-01
  XAG107-UI-SINGLE-PRESS:
    source_id: XAG-107
    source_section: Implementation guidelines
    authority_class: CURRENT_ACCESSIBILITY_BEST_PRACTICE
    applicability: APPLICABLE_BASELINE
    semantics:
      ui_navigable_with_single_non_simultaneous_key_presses: true
    evidence_requirement_refs:
    - ACC-EV-INPUT-NAV-01
    gap_refs:
    - ACC-GAP-INPUT-NAV-01
  XAG107-REMAP-ALL:
    source_id: XAG-107
    source_section: Implementation guidelines
    authority_class: CURRENT_ACCESSIBILITY_BEST_PRACTICE
    applicability: APPLICABLE_BASELINE
    semantics:
      in_game_remap_all_controls: true
      includes_analog_and_digital: true
      invert_x_and_y_individually_per_stick: true
      pc_escape_key_remappable: true
      prefer_action_remap_over_only_button_swap: true
    evidence_requirement_refs:
    - ACC-EV-INPUT-REMAP-01
    gap_refs:
    - ACC-GAP-INPUT-REMAP-01
  XAG107-REMAP-LABELS:
    source_id: XAG-107
    source_section: Implementation guidelines
    authority_class: CURRENT_ACCESSIBILITY_BEST_PRACTICE
    applicability: APPLICABLE_BASELINE
    semantics:
      hints_tips_tutorials_and_control_maps_follow_current_mapping: true
    evidence_requirement_refs:
    - ACC-EV-INPUT-REMAP-01
    gap_refs:

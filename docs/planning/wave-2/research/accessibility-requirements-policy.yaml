  - assert all empirical evidence remains NOT_RUN and all new page gaps remain OPEN
  required_semantic_assertions:
  - load exact v5 policy blob and preserve all XAG 101-107 identities and reviewed semantic corrections before applying this overlay
  - XAG108 pause obligations cover active gameplay and cinematics for single-player/local multiplayer/local split-screen, with saving/loading as the declared exception
  - XAG109 static controls/controller mapping alone cannot satisfy the gameplay tutorial demonstration record
  - XAG110 haptics are never the sole information channel when they communicate game information
  - XAG111 audio description preserves localization and natural-gap timing with extended description/pause when gaps are insufficient
  - XAG112 initial accessibility path preserves the three source strategies and defaults screen narration on when the platform narration setting cannot be read
  - XAG112 linear-menu wrap applies only to one-axis linear menus and does not silently apply to multidirectional menus
  - XAG113 focus can never be invisible or offscreen
  - XAG114 critical UI/settings reading-level rule retains narrative/story and proper-name exceptions and does not become a legal/compliance claim
  - XAG115 input-error detail preserves the security/purpose exception and destructive-action confirmation cannot require a button hold as the only method
  - XAG116 excludes core gameplay timing and treats the four time-limit modification mechanisms as alternatives, not four simultaneous requirements
  - XAG116 retains at-least-10x adjustment, at-least-20-second expiry action window, and at-least-10 extension-use semantics
  - XAG117 ancillary gameplay around text UI and core-gameplay movement exemptions remain explicit
  - XAG118 luminance, saturated-red, and spatial-pattern thresholds remain bundled with their source definitions and failure logic
  - XAG119 incoming STT, outgoing TTS, local narration, character-intent transcription, platform defaults, and in-game overrides remain distinct
  - XAG120 communication accessibility is conditional on communication being offered and covers access/launch, prerequisite pathways, settings, notifications, social actions, and chat operations
  - XAG121 WCAG 2 Level AA remains a source cross-reference in best-practice documentation semantics and grants no legal certification
  - XAG123 harmful-content applicability remains content-triggered; warnings, customization, skip, resources, accessibility, and respectful representation remain distinct

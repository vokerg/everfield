    threshold_or_semantic_rule_must_be_explicit_when_source_provides_one: true
    unknown_or_unmapped_clause_result: MAPPING_INCOMPLETE
    summary_only_source_page_result: MAPPING_INCOMPLETE
    not_run_is_not_not_applicable: true
    aggregate_mapping_complete_is_derived: true
  mapping_complete_when:
  - every_current_scope_source_page_is_ATOMICALLY_EXPANDED_or_explicitly_DEFERRED_PLATFORM_ONLY

    applicability: CONDITIONAL
    trigger: visual_content_contains_saturated_red_flash
    required_semantics:
      saturated_red_ratio_threshold: R/(R+G+B)>=0.8
      red_flash_change_formula: (R-G-B)*320
      red_flash_change_threshold_greater_than: 20
      failure_frequency_per_second_greater_than_about: 3
      failure_area_percent_about_or_greater: 20
      extended_lower_intensity_flashing_can_fail: true
      mitigation_options:

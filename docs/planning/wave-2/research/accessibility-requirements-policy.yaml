mechanical_validation:
  algorithm: ACCESSIBILITY-POLICY-VALIDATOR-v3
  steps:
  - apply exact v2 base policy blob then this v3 overlay
  - require XAG 102-106 source records to bind to the registered first-party URLs/version/observed date
  - for every ATOMICALLY_EXPANDED page require exact set-and-count equality against expected_source_clause_inventory
  - reject duplicate, missing, or extra clause IDs
  - require every clause to have source_id, deterministic applicability, trigger, required_semantics, resolvable evidence_requirement_refs, and resolvable gap_ref
  - require conditional clauses to carry a non-empty trigger and any source exception to be explicit
  - require XAG 108-123 to remain GUIDELINE_SUMMARY_ONLY and mapping_complete false
  - require empirical evidence states for this tranche to remain NOT_RUN until separately produced and independently reviewed
  - derive aggregate accessibility blocker only after all mapping and empirical predicates; expected current state remains OPEN
  expected_result:
    inherited_atomic_clause_count: 28
    new_atomic_clause_count: 77
    expected_atomic_clause_count: 105
    per_page_new_clause_counts: {XAG-102: 12, XAG-103: 8, XAG-104: 29, XAG-105: 5, XAG-106: 23}
    xag_102_106_inventory: PASS
    reference_integrity: PASS
    applicability_trigger_totality: PASS
    xag_108_123_summary_only: PASS
    empirical_accessibility_pass_claimed: false
    mapping_complete: false
    blocker_authority_state: OPEN
  adversarial_fixtures:
    OMIT_EXPECTED_TRANCHE_CLAUSE: REJECT_ATOMIC_EXPANSION
    ADD_UNREGISTERED_TRANCHE_CLAUSE: REJECT_ATOMIC_EXPANSION
    DUPLICATE_CLAUSE_ID: REJECT_ATOMIC_EXPANSION
    CONDITIONAL_WITHOUT_TRIGGER: REJECT_APPLICABILITY_TOTALITY
    DANGLING_EVIDENCE_REF: REJECT_REFERENCE_INTEGRITY
    DANGLING_GAP_REF: REJECT_REFERENCE_INTEGRITY
    UPGRADE_XAG108_123_WITHOUT_INVENTORY: REJECT_ATOMIC_EXPANSION
    SET_MAPPING_COMPLETE_TRUE: REJECT_AGGREGATE_STATE
    CLAIM_EMPIRICAL_PASS_WITH_NOT_RUN_EVIDENCE: REJECT_EVIDENCE_STATE

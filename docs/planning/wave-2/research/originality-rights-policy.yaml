  path: docs/planning/WAVE-1-FOUNDATIONS-v1.md
  blob: a252e3c93702f3ebaecd3e888944a23dbe1b0e1d

authority_limits:
  legal_conclusion: NONE
  release_clearance: NONE
  implementation_readiness: NONE
  canonicalization: NONE
  similarity_score_can_clear: false
  provider_output_assignment_can_clear: false

reference_use_context_record:
  type: ReferenceUseContextRecord
  identity_rule: content_addressed_over_all_identity_fields_before_originality_execution
  required_fields:
    - context_id
    - candidate_artifact_id
    - reference_artifact_ids
    - origin_class
    - reference_class
    - reference_purpose
    - allowed_reuse
    - prohibited_reuse
    - provider_terms_refs
    - license_or_permission_refs
    - current_rights_research_refs
    - release_scope_ref
    - originality_risk_policy_id
    - originality_evidence_requirement_ref
    - freshness_requirement_refs
  identity_fields:
    - candidate_artifact_id
    - reference_artifact_ids
    - origin_class
    - reference_class
    - reference_purpose
    - allowed_reuse
    - prohibited_reuse
    - provider_terms_refs
    - license_or_permission_refs
    - current_rights_research_refs
    - release_scope_ref
    - originality_risk_policy_id
    - originality_evidence_requirement_ref
    - freshness_requirement_refs
  enums:
    origin_class:
      - PROJECT_NATIVE
      - GENERATED_PROVIDER
      - EXTERNAL_REFERENCE
      - EXTERNAL_ASSET
      - THIRD_PARTY_OUTPUT
      - LICENSED_MATERIAL
      - PUBLIC_DOMAIN_CLAIM
      - UNKNOWN
    reference_class:
      - NONE_DECLARED
      - FACTUAL_OR_FUNCTIONAL
      - GENERAL_CONCEPTUAL
      - STYLE_OR_CREATOR_NAMED
      - EXPRESSION_SPECIFIC
      - DIRECT_ASSET_OR_CODE
      - MARK_LIKENESS_PERSONA
      - CONFIDENTIAL_PRIVATE_RESTRICTED
      - PUBLIC_DOMAIN_CLAIM
    reference_purpose:
      - NO_REFERENCE
      - FACT_RESEARCH
      - FUNCTIONAL_RESEARCH
      - CONCEPTUAL_DIRECTION
      - STYLE_DIRECTION
      - EXPRESSION_ANALYSIS
      - DIRECT_INCORPORATION
      - ASSET_OR_CODE_DEPENDENCY
      - MARK_LIKENESS_PERSONA_USE
      - PUBLIC_DOMAIN_BASIS
      - CONFIDENTIAL_RESTRICTED_RESEARCH
  invariants:
    - context_is_not_reusable_if_any_identity_field_changes
    - candidate_artifact_id_must_resolve_to_ArtifactIdentity
    - each_retained_reference_must_resolve_to_ArtifactIdentity_and_external_only_nonretained_sources_must_have_exact_source_identity
    - allowed_reuse_and_prohibited_reuse_must_not_conflict
    - release_scope_ref_must_be_exact_and_nonempty_for_release_sensitive_assessment
    - current_rights_research_refs_must_be_fresh_for_the_declared_scope

reference_use_record:
  type: ReferenceUseRecord
  construction_stage: after_originality_review
  identity_rule: content_addressed_over_context_ref_and_originality_review_ref
  required_fields:
    - record_id
    - context_ref
    - originality_review_ref
  identity_fields:
    - context_ref
    - originality_review_ref
  invariants:
    - context_ref_must_resolve_to_ReferenceUseContextRecord
    - originality_review_ref_must_bind_the_same_context_ref
    - final_record_is_the_single_release_assessment_reference_use_identity
    - changing_context_or_review_requires_a_new_record_id
  cycle_avoidance:
    - OriginalityReviewRecord references context_ref, never final ReferenceUseRecord
    - final ReferenceUseRecord is constructed only after the review identity exists

license_or_permission_record:
  type: LicenseOrPermissionRecord
  required_fields:
    - record_id
    - source_or_artifact_id
    - authority_source_ref
    - license_or_permission_kind
    - version_or_grant_date
    - observed_at
    - allowed_uses
    - prohibited_uses
    - obligations
    - jurisdiction_or_scope
    - expiration_or_recheck
    - immutable_evidence_ref
  invariants:
    - missing_or_ambiguous_record_cannot_support_CLEAR
    - intended_release_scope_must_be_subset_of_allowed_uses_and_scope
    - unsatisfied_obligation_cannot_support_CLEAR

originality_review_record:
  type: OriginalityReviewRecord
  required_fields:
    - review_id
    - candidate_artifact_id
    - reference_use_context_ref
    - policy_id
    - evidence_requirement_ref
    - check_plan_ref
    - reference_corpus_ref
    - exact_duplicate_checks
    - normalized_identity_checks
    - known_reference_checks
    - near_duplicate_checks
    - targeted_external_search_refs
    - judgment_panel_ref
    - qualified_legal_review_ref
    - material_signals
    - blind_spots
    - result
  result_enum:
    - NO_MATERIAL_SIGNAL_FOUND
    - MATERIAL_SIGNAL
    - NEAR_DUPLICATE
    - EXACT_DUPLICATE
    - INCONCLUSIVE
    - NOT_RUN
  invariants:
    - reference_use_context_ref_must_bind_the_same_candidate_artifact_id
    - evidence_requirement_ref_must_be_compiled_from_this_policy_id_before_execution
    - NOT_RUN_or_INCONCLUSIVE_cannot_satisfy_REQUIRED_evidence
    - material_signal_cannot_be_averaged_away
    - legal_conclusion_is_never_derived_from_similarity_score

originality_risk_policy:
  policy_id: ORP-RISK-v1
  policy_epoch_ref: ORP-R1-2026-08-12
  applicability_states:
    - REQUIRED
    - CONDITIONAL
    - NOT_APPLICABLE
  evidence_kinds:
    - EXACT_IDENTITY
    - NORMALIZED_IDENTITY
    - KNOWN_REFERENCE_COMPARISON
    - NEAR_DUPLICATE
    - TARGETED_EXTERNAL_SEARCH
    - JUDGMENT_REVIEW
    - QUALIFIED_LEGAL_REVIEW
  compile_before_assessment: true
  fail_closed_rules:
    - missing_policy_id -> UNKNOWN_POLICY
    - unknown_origin_class -> UNKNOWN_POLICY
    - unknown_reference_class -> UNKNOWN_POLICY
    - missing_release_scope_for_release_sensitive_use -> UNKNOWN_POLICY
    - no_matching_rule -> UNKNOWN_POLICY
    - conditional_trigger_unknown -> REQUIRED
  aggregation:
    rule: most_restrictive_applicability_per_evidence_kind
    order:
      - REQUIRED
      - CONDITIONAL
      - NOT_APPLICABLE
  rules:
    - rule_id: ORP-RULE-GENERATED-NO-DECLARED-REFERENCE
      when:
        origin_class: GENERATED_PROVIDER
        reference_class: NONE_DECLARED
      evidence:
        EXACT_IDENTITY: REQUIRED
        NORMALIZED_IDENTITY: REQUIRED
        KNOWN_REFERENCE_COMPARISON: REQUIRED
        NEAR_DUPLICATE: REQUIRED
        TARGETED_EXTERNAL_SEARCH: CONDITIONAL
        JUDGMENT_REVIEW: CONDITIONAL
        QUALIFIED_LEGAL_REVIEW: CONDITIONAL
      conditional_triggers:
        TARGETED_EXTERNAL_SEARCH:
          - material_signal
          - distinctive_named_entity_or_work_signal
          - high_value_release_artifact
        JUDGMENT_REVIEW:
          - expressive_release_artifact
          - tool_disagreement
        QUALIFIED_LEGAL_REVIEW:
          - unresolved_legal_interpretation_material_to_release
          - credible_complaint
    - rule_id: ORP-RULE-FACTUAL-CONCEPTUAL
      when:
        reference_class_any:
          - FACTUAL_OR_FUNCTIONAL
          - GENERAL_CONCEPTUAL
      evidence:
        EXACT_IDENTITY: REQUIRED
        NORMALIZED_IDENTITY: REQUIRED
        KNOWN_REFERENCE_COMPARISON: REQUIRED
        NEAR_DUPLICATE: CONDITIONAL
        TARGETED_EXTERNAL_SEARCH: CONDITIONAL
        JUDGMENT_REVIEW: CONDITIONAL
        QUALIFIED_LEGAL_REVIEW: CONDITIONAL
      conditional_triggers:
        NEAR_DUPLICATE:
          - output_contains_source_specific_expression
        TARGETED_EXTERNAL_SEARCH:
          - material_signal
        JUDGMENT_REVIEW:
          - expressive_convergence_signal
        QUALIFIED_LEGAL_REVIEW:
          - unresolved_legal_interpretation_material_to_release
    - rule_id: ORP-RULE-NAMED-STYLE-OR-EXPRESSION
      when:
        reference_class_any:
          - STYLE_OR_CREATOR_NAMED
          - EXPRESSION_SPECIFIC
      evidence:
        EXACT_IDENTITY: REQUIRED
        NORMALIZED_IDENTITY: REQUIRED
        KNOWN_REFERENCE_COMPARISON: REQUIRED
        NEAR_DUPLICATE: REQUIRED
        TARGETED_EXTERNAL_SEARCH: REQUIRED
        JUDGMENT_REVIEW: REQUIRED
        QUALIFIED_LEGAL_REVIEW: CONDITIONAL
      conditional_triggers:
        QUALIFIED_LEGAL_REVIEW:
          - unresolved_material_similarity
          - intended_direct_incorporation
          - credible_complaint
    - rule_id: ORP-RULE-DIRECT-ASSET-CODE
      when:
        reference_class: DIRECT_ASSET_OR_CODE
      evidence:
        EXACT_IDENTITY: REQUIRED
        NORMALIZED_IDENTITY: NOT_APPLICABLE
        KNOWN_REFERENCE_COMPARISON: NOT_APPLICABLE
        NEAR_DUPLICATE: NOT_APPLICABLE
        TARGETED_EXTERNAL_SEARCH: NOT_APPLICABLE
        JUDGMENT_REVIEW: NOT_APPLICABLE
        QUALIFIED_LEGAL_REVIEW: CONDITIONAL
      separate_required_evidence:
        - exact_LicenseOrPermissionRecord
        - obligation_satisfaction_evidence
      conditional_triggers:
        QUALIFIED_LEGAL_REVIEW:
          - ambiguous_or_conflicting_license
          - material_release_interpretation
    - rule_id: ORP-RULE-MARK-LIKENESS-PERSONA
      when:
        reference_class: MARK_LIKENESS_PERSONA
      evidence:
        EXACT_IDENTITY: REQUIRED
        NORMALIZED_IDENTITY: CONDITIONAL
        KNOWN_REFERENCE_COMPARISON: REQUIRED
        NEAR_DUPLICATE: REQUIRED
        TARGETED_EXTERNAL_SEARCH: REQUIRED
        JUDGMENT_REVIEW: REQUIRED
        QUALIFIED_LEGAL_REVIEW: CONDITIONAL
      conditional_triggers:
        NORMALIZED_IDENTITY:
          - media_supports_normalized_comparison
        QUALIFIED_LEGAL_REVIEW:
          - release_or_commercial_use
    - rule_id: ORP-RULE-CONFIDENTIAL-RESTRICTED
      when:
        reference_class: CONFIDENTIAL_PRIVATE_RESTRICTED
      precondition_state: RESTRICTED
      evidence:
        EXACT_IDENTITY: REQUIRED
        NORMALIZED_IDENTITY: NOT_APPLICABLE
        KNOWN_REFERENCE_COMPARISON: NOT_APPLICABLE
        NEAR_DUPLICATE: NOT_APPLICABLE
        TARGETED_EXTERNAL_SEARCH: NOT_APPLICABLE
        JUDGMENT_REVIEW: NOT_APPLICABLE
        QUALIFIED_LEGAL_REVIEW: CONDITIONAL
      conditional_triggers:
        QUALIFIED_LEGAL_REVIEW:
          - proposed_scope_expansion
      release_rule: cannot_CLEAR_until_exact_permission_and_provider_input_admission_are_bound_then_recompile_under_resulting_use_class
    - rule_id: ORP-RULE-PUBLIC-DOMAIN-CLAIM
      when:
        reference_class: PUBLIC_DOMAIN_CLAIM
      evidence:
        EXACT_IDENTITY: REQUIRED
        NORMALIZED_IDENTITY: NOT_APPLICABLE
        KNOWN_REFERENCE_COMPARISON: NOT_APPLICABLE
        NEAR_DUPLICATE: NOT_APPLICABLE
        TARGETED_EXTERNAL_SEARCH: REQUIRED
        JUDGMENT_REVIEW: NOT_APPLICABLE
        QUALIFIED_LEGAL_REVIEW: CONDITIONAL
      separate_required_evidence:
        - exact_public_domain_basis
        - jurisdiction_and_scope
      conditional_triggers:
        QUALIFIED_LEGAL_REVIEW:
          - status_or_jurisdiction_ambiguity

check_plan_compiler:
  output_type: OriginalityCheckPlan
  required_bindings:
    - policy_id
    - evidence_requirement_ref
    - candidate_artifact_id
    - reference_use_context_ref
    - release_scope_ref
    - applicable_rule_ids
    - evidence_kind_applicability
    - conditional_trigger_resolutions
  rules:
    - compile_before_any_originality_execution_or_release_assessment
    - NOT_APPLICABLE_is_resolved_before_execution
    - NOT_RUN_is_an_execution_result_and_never_equals_NOT_APPLICABLE
    - required_evidence_may_only_be_replaced_by_exact_versioned_requirement_substitution

release_rights_assessment:
  type: ReleaseRightsAssessment
  required_fields:
    - assessment_id
    - artifact_id
    - release_scope_ref
    - reference_use_record_refs
    - provider_terms_refs
    - license_or_permission_refs
    - originality_policy_id
    - originality_check_plan_refs
    - originality_evidence_satisfaction_refs
    - freshness_requirement_refs
    - unresolved_triggers
    - reason_codes
    - prior_assessment_ref
    - derived_rights_or_terms_state
    - derivation_trace
  state_enum:
    - CLEAR
    - RESTRICTED
    - QUARANTINED
    - UNKNOWN
    - NOT_APPLICABLE
  deterministic_state_precedence:
    - state: RESTRICTED
      when_any:
        - explicit_scope_restriction
        - known_prohibited_use
        - permission_scope_narrower_than_release_scope
    - state: QUARANTINED
      when_any:
        - unresolved_material_similarity
        - exact_or_near_direct_third_party_match_without_adequate_permission
        - active_license_or_terms_conflict
        - credible_complaint_or_contrary_source
        - unresolved_mark_likeness_persona_confidentiality_risk
    - state: UNKNOWN
      when_any:
        - stale_required_evidence
        - missing_required_evidence
        - incomplete_or_conflicting_provenance
        - unknown_provider_contract
        - unknown_or_unmatched_policy
        - required_originality_evidence_NOT_RUN_or_INCONCLUSIVE
    - state: CLEAR
      when_all:
        - no_higher_precedence_state_matches
        - all_required_evidence_satisfied
        - all_applicable_freshness_requirements_current
        - all_license_or_permission_obligations_satisfied
        - no_unresolved_material_signal
  reason_codes:
    - EXPLICIT_SCOPE_RESTRICTION
    - KNOWN_PROHIBITED_USE
    - PERMISSION_SCOPE_MISMATCH
    - MATERIAL_SIMILARITY_UNRESOLVED
    - THIRD_PARTY_MATCH_UNPERMITTED
    - LICENSE_TERMS_CONFLICT
    - CREDIBLE_COMPLAINT
    - MARK_LIKENESS_PERSONA_RISK
    - STALE_REQUIRED_EVIDENCE
    - MISSING_REQUIRED_EVIDENCE
    - PROVENANCE_INCOMPLETE_OR_CONFLICTING
    - PROVIDER_CONTRACT_UNKNOWN
    - ORIGINALITY_POLICY_UNKNOWN
    - REQUIRED_ORIGINALITY_EVIDENCE_UNSATISFIED
  stale_evidence_rule:
    default_state: UNKNOWN
    default_reason_code: STALE_REQUIRED_EVIDENCE
    override_only_if:
      - independent_RESTRICTED_trigger_is_true
      - independent_QUARANTINED_trigger_is_true
    historical_state_rule: retain_prior_assessment_ref_and_do_not_rewrite_prior_CLEAR

freshness_binding:
  required_source_classes:
    - PROVIDER_TERMS
    - LEGAL_IP_RESEARCH
  each_reference_must_bind:
    - immutable_evidence_ref
    - observed_date
    - source_version_or_scope
    - invalidation_triggers
    - rerequest_predicate
    - dependent_decision_refs
  stale_effect: dependent_assessment_OPEN_and_state_UNKNOWN_unless_higher_precedence_trigger_applies

self_checks:
  - id: SC-R00
    case: construct_context_then_review_then_final_reference_use_record
    expected: ACYCLIC_IDENTITIES_CONTEXT_TO_REVIEW_TO_FINAL_RECORD
  - id: SC-R01
    case: same_originality_review_with_changed_reference_purpose
    expected: REJECT_REUSE_NEW_CONTEXT_REVIEW_AND_REFERENCE_USE_RECORD_REQUIRED
  - id: SC-R02
    case: same_originality_review_with_changed_release_scope
    expected: REJECT_REUSE_NEW_CONTEXT_REVIEW_AND_REFERENCE_USE_RECORD_REQUIRED
  - id: SC-R03
    case: no_matching_originality_policy_rule
    expected: UNKNOWN_POLICY_AND_NO_CLEAR
  - id: SC-R04
    case: conditional_trigger_unknown
    expected: TREAT_AS_REQUIRED
  - id: SC-R05
    case: stale_terms_only_after_prior_clear
    expected: UNKNOWN_WITH_STALE_REQUIRED_EVIDENCE_AND_PRIOR_ASSESSMENT_RETAINED
  - id: SC-R06
    case: stale_terms_plus_material_similarity_conflict
    expected: QUARANTINED_WITH_MATERIAL_CONFLICT_AND_STALE_REASON_RETAINED
  - id: SC-R07
    case: explicit_license_scope_restriction_plus_missing_optional_similarity_tool
    expected: RESTRICTED
  - id: SC-R08
    case: low_similarity_score_with_missing_license
    expected: NO_CLEAR

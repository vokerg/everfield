state: NONCANONICAL_PLANNING_REVISION
decision_state: EVIDENCE_REQUIRED
mission_id: W2-REM-RIGHTS-01
issue: 95
source_candidate:
  issue: 80
  work_sha: 3c262cbf767633e0ca42f6bdf387e262056b4fb0
  report_blob: bda0551c446c93492c9d8e809d087d592dfcdae3
  terminal_status_comment: 5270525266
pre_gate_review:
  comment: 5271490456
  findings:
    - PG-RIGHTS-M01
    - PG-RIGHTS-M02
    - PG-RIGHTS-m01
